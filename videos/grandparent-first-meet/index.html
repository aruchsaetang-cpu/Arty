<script>
      const tl = gsap.timeline({ paused: true });
      const type = (sel, t, cps = 24) => {
        const el = document.querySelector(sel);
        const txt = el.textContent;
        el.textContent = "";
        for (const c of txt) {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          el.appendChild(sp);
        }
        tl.fromTo(el.querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1 / cps, ease: "none" }, t);
      };
      const out = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.2 }, t);
      const draw = (sel, t, d = 0.4) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      const show = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
      const label = (sel, t) => tl.fromTo(sel, { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(2.5)" }, t);
      const flash = (t, o = 0.75) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      const push = (sel, t, dur, a = 1.0, b = 1.06) => tl.fromTo(sel, { scale: a }, { scale: b, duration: dur, ease: "none", immediateRender: false }, t);

      // ---------- HOOK (plain footage until the 0.93 hit) ----------
      const HIT = 0.93;
      flash(HIT, 0.95);
      tl.fromTo("#h1", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, HIT);
      // point at the baby first
      draw("#ring", 1.0, 0.3);
      tl.fromTo("#arrow", { opacity: 0, scale: 0.3, rotation: 225 }, { opacity: 1, scale: 1, rotation: 225, duration: 0.22, ease: "back.out(2.2)" }, 1.15);
      tl.to(["#ring", "#arrow"], { opacity: 0, duration: 0.01 }, 1.67);
      flash(1.68, 0.9);
      // then at the grandmother
      draw("#ring2", 1.72, 0.3);
      tl.fromTo("#arrow2", { opacity: 0, scale: 0.3, rotation: 315 }, { opacity: 1, scale: 1, rotation: 315, duration: 0.22, ease: "back.out(2.2)" }, 1.8);
      tl.to(["#ring2", "#arrow2"], { opacity: 0, duration: 0.12 }, 2.3);
      // ---------- CONTEXT ----------
      flash(2.43, 0.35); push("#w2", 2.43, 2.87);
      type("#m1", 2.55); type("#m2", 3.15); type("#m3", 3.35); type("#m4", 3.75);
      type("#k1", 5.4); type("#k2", 5.7); type("#k3", 6.25); type("#k4", 6.38); type("#k5", 6.55);
      flash(5.3, 0.35); push("#w2b", 5.3, 3);
      // ---------- BUT ----------
      flash(8.3, 0.7); push("#w3", 8.3, 3);
      type("#b1", 8.4); type("#b1b", 8.95); type("#b2", 9.25); type("#b2b", 9.4);
      flash(11.3, 0.35); push("#w4", 11.3, 2.7);
      flash(14, 0.35); push("#w5r", 14, 2.7);
      type("#b3", 13.9); type("#b3b", 14.22); type("#b4", 14.7);
      flash(16.7, 0.35); push("#w5s", 16.7, 2.6);
      out("#c4 .cap", 19.1);
      // ---------- REVEAL ----------
      flash(19.3, 0.4); push("#w5", 19.3, 3.5);
      flash(20.4, 0.95);
      tl.fromTo("#w5i", { scale: 1.0, filter: "blur(0px) brightness(1)" }, { scale: 1.45, filter: "blur(18px) brightness(2.1)", duration: 0.07, ease: "power4.out" }, 20.38);
      tl.to("#w5i", { scale: 1.0, filter: "blur(0px) brightness(1)", duration: 0.6, ease: "power3.out" }, 20.45);
      tl.fromTo("#leak", { opacity: 0, x: 0, scale: 1.3 }, { opacity: 1, x: 0, scale: 1.3, duration: 0.06 }, 20.38);
      tl.to("#leak", { opacity: 0, x: 300, duration: 0.7, ease: "power2.out" }, 20.48);
      tl.fromTo("#w5g", { opacity: 0, x: 0, scale: 1.0 }, { opacity: 0.5, x: 70, scale: 1.18, duration: 0.08, ease: "none" }, 20.4);
      tl.to("#w5g", { opacity: 0, x: 18, scale: 1.04, duration: 1.0, ease: "power2.out" }, 20.50);
      tl.fromTo("#w5", { x: 0, y: 0 }, { keyframes: [{ x: -26, y: 14, duration: 0.05 }, { x: 22, y: -12, duration: 0.05 }, { x: -14, y: 8, duration: 0.06 }, { x: 9, y: -5, duration: 0.07 }, { x: -4, y: 2, duration: 0.08 }, { x: 0, y: 0, duration: 0.09 }], ease: "none", immediateRender: false }, 20.42);

      tl.fromTo("#heart", { x: 0, y: 0 }, { keyframes: [{ x: -18, y: 10, duration: 0.05 }, { x: 15, y: -8, duration: 0.05 }, { x: -9, y: 5, duration: 0.06 }, { x: 5, y: -3, duration: 0.07 }, { x: 0, y: 0, duration: 0.08 }], ease: "none", immediateRender: false }, 20.62);
      tl.fromTo("#heart", { scale: 1 }, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut", transformOrigin: "50% 60%", immediateRender: false }, 21.20);
      type("#o5-d", 20.95); type("#o5-e", 21.22); type("#o5-f", 21.32);
