    const tl = gsap.timeline({ paused: true });

    // s1: the dashed route is revealed from open water to the beach; the kayak rides its head.

      const d = prog.p * len;
      const a = path.getPointAtLength(d);

      reveal.setAttribute("stroke-dasharray", `${d.toFixed(1)} ${len.toFixed(1)}`);
    };
    tl.fromTo(prog, { p: 0 }, { p: 1, duration: 1.3, ease: "power2.inOut", onUpdate: place, onStart: place }, 0.15);

    // s4: the ring closes around the island and keeps turning; it pulses outward.
