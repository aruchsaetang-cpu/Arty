  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap clip" data-start="0.15" data-duration="1.67"><span id="cap-0-in">In 1590,</span></div>
    <div id="cap-1" class="cap clip" data-start="1.82" data-duration="2.01"><span id="cap-1-in">an English governor came back</span></div>
    <div id="cap-2" class="cap clip" data-start="3.83" data-duration="1.67"><span id="cap-2-in">to his colony in America,</span></div>
    <div id="cap-3" class="cap clip" data-start="5.5" data-duration="1.27"><span id="cap-3-in">and found it empty.</span></div>
    <div id="cap-4" class="cap clip" data-start="6.77" data-duration="1.8"><span id="cap-4-in">More than a hundred people,</span></div>
    <div id="cap-5" class="cap clip" data-start="8.57" data-duration="0.34"><span id="cap-5-in">gone.</span></div>
    <div id="cap-6" class="cap clip" data-start="8.91" data-duration="1.33"><span id="cap-6-in">And one word carved</span></div>
    <div id="cap-7" class="cap clip" data-start="10.24" data-duration="0.85"><span id="cap-7-in">into a post.</span></div>
    <div id="cap-8" class="cap clip" data-start="12.17" data-duration="1.72"><span id="cap-8-in">In 1587,</span></div>
    <div id="cap-9" class="cap clip" data-start="13.89" data-duration="2.67"><span id="cap-9-in">about 115 settlers landed</span></div>
    <div id="cap-10" class="cap clip" data-start="16.56" data-duration="1.24"><span id="cap-10-in">on Roanoke Island,</span></div>
    <div id="cap-11" class="cap clip" data-start="17.8" data-duration="2.11"><span id="cap-11-in">in what is now North Carolina.</span></div>
    <div id="cap-12" class="cap clip" data-start="20.99" data-duration="0.93"><span id="cap-12-in">Among them was the</span></div>
    <div id="cap-13" class="cap clip" data-start="21.92" data-duration="1.67"><span id="cap-13-in">governor's newborn granddaughter,</span></div>
    <div id="cap-14" class="cap clip" data-start="24.0" data-duration="1.05"><span id="cap-14-in">Virginia Dare,</span></div>
    <div id="cap-15" class="cap clip" data-start="25.57" data-duration="1.51"><span id="cap-15-in">the first English child</span></div>
    <div id="cap-16" class="cap clip" data-start="27.08" data-duration="1.36"><span id="cap-16-in">born in the Americas.</span></div>
    <div id="cap-17" class="cap clip" data-start="29.52" data-duration="1.89"><span id="cap-17-in">And this was England's second try.</span></div>
    <div id="cap-18" class="cap clip" data-start="32.02" data-duration="1.69"><span id="cap-18-in">An earlier colony had already</span></div>
    <div id="cap-19" class="cap clip" data-start="33.71" data-duration="1.36"><span id="cap-19-in">given up and gone home,</span></div>
    <div id="cap-20" class="cap clip" data-start="35.53" data-duration="1.72"><span id="cap-20-in">and fifteen men left behind to</span></div>
    <div id="cap-21" class="cap clip" data-start="37.25" data-duration="1.65"><span id="cap-21-in">hold the island had vanished.</span></div>
    <div id="cap-22" class="cap clip" data-start="42.28" data-duration="2.08"><span id="cap-22-in">The colony was short on supplies,</span></div>
    <div id="cap-23" class="cap clip" data-start="44.36" data-duration="1.88"><span id="cap-23-in">so governor John White sailed</span></div>
    <div id="cap-24" class="cap clip" data-start="46.24" data-duration="1.62"><span id="cap-24-in">back to England for more.</span></div>
    <div id="cap-25" class="cap clip" data-start="48.94" data-duration="1.35"><span id="cap-25-in">White didn't want to go.</span></div>
    <div id="cap-26" class="cap clip" data-start="50.79" data-duration="1.54"><span id="cap-26-in">The colonists insisted.</span></div>
    <div id="cap-27" class="cap clip" data-start="52.74" data-duration="1.34"><span id="cap-27-in">He was the one person who</span></div>
    <div id="cap-28" class="cap clip" data-start="54.08" data-duration="1.9"><span id="cap-28-in">could convince England to send help.</span></div>
    <div id="cap-29" class="cap clip" data-start="57.05" data-duration="1.01"><span id="cap-29-in">But England went to</span></div>
    <div id="cap-30" class="cap clip" data-start="58.06" data-duration="0.8"><span id="cap-30-in">war with Spain.</span></div>
    <div id="cap-31" class="cap clip" data-start="59.31" data-duration="1.25"><span id="cap-31-in">Ships were held back to</span></div>
    <div id="cap-32" class="cap clip" data-start="60.56" data-duration="1.35"><span id="cap-32-in">fight the Spanish Armada.</span></div>
    <div id="cap-33" class="cap clip" data-start="62.3" data-duration="0.84"><span id="cap-33-in">White was stuck.</span></div>
    <div id="cap-34" class="cap clip" data-start="64.21" data-duration="0.84"><span id="cap-34-in">It took him three</span></div>
    <div id="cap-35" class="cap clip" data-start="65.05" data-duration="0.88"><span id="cap-35-in">years to get back.</span></div>
    <div id="cap-36" class="cap clip" data-start="69.31" data-duration="4.02"><span id="cap-36-in">He landed in August 1590,</span></div>
    <div id="cap-37" class="cap clip" data-start="73.89" data-duration="1.75"><span id="cap-37-in">on his granddaughter's third birthday.</span></div>
    <div id="cap-38" class="cap clip" data-start="76.23" data-duration="1.49"><span id="cap-38-in">The houses had been taken down.</span></div>
    <div id="cap-39" class="cap clip" data-start="77.82" data-duration="0.44"><span id="cap-39-in">There was no sign</span></div>
    <div id="cap-40" class="cap clip" data-start="78.26" data-duration="0.34"><span id="cap-40-in">of a battle,</span></div>
    <div id="cap-41" class="cap clip" data-start="78.69" data-duration="0.15"><span id="cap-41-in">and no bodies.</span></div>
    <div id="cap-42" class="cap clip" data-start="79.92" data-duration="1.48"><span id="cap-42-in">Carved into a post</span></div>
    <div id="cap-43" class="cap clip" data-start="81.4" data-duration="1.01"><span id="cap-43-in">was one word:</span></div>
    <div id="cap-44" class="cap clip" data-start="82.41" data-duration="0.7"><span id="cap-44-in">Croatoan.</span></div>
    <div id="cap-45" class="cap clip" data-start="83.11" data-duration="1.33"><span id="cap-45-in">On a tree nearby,</span></div>

    <div id="cap-47" class="cap clip" data-start="85.53" data-duration="0.15"><span id="cap-47-in">C,</span></div>
    <div id="cap-48" class="cap clip" data-start="85.68" data-duration="0.16"><span id="cap-48-in">R,</span></div>
    <div id="cap-49" class="cap clip" data-start="85.84" data-duration="0.2"><span id="cap-49-in">O.</span></div>
    <div id="cap-50" class="cap clip" data-start="87.12" data-duration="0.97"><span id="cap-50-in">Before he left,</span></div>
    <div id="cap-51" class="cap clip" data-start="88.09" data-duration="1.3"><span id="cap-51-in">White had told them:</span></div>
    <div id="cap-52" class="cap clip" data-start="89.39" data-duration="1.49"><span id="cap-52-in">if you leave in danger,</span></div>

    <div id="cap-54" class="cap clip" data-start="91.79" data-duration="1.28"><span id="cap-54-in">There was no cross.</span></div>
    <div id="cap-55" class="cap clip" data-start="94.14" data-duration="1.34"><span id="cap-55-in">His own chests had been</span></div>
    <div id="cap-56" class="cap clip" data-start="95.48" data-duration="1.34"><span id="cap-56-in">dug up and broken open.</span></div>
    <div id="cap-57" class="cap clip" data-start="97.38" data-duration="1.36"><span id="cap-57-in">His books and maps lay</span></div>
    <div id="cap-58" class="cap clip" data-start="98.74" data-duration="1.17"><span id="cap-58-in">ruined by the rain.</span></div>
    <div id="cap-59" class="cap clip" data-start="100.99" data-duration="1.89"><span id="cap-59-in">Croatoan was a nearby island,</span></div>
    <div id="cap-60" class="cap clip" data-start="102.88" data-duration="1.76"><span id="cap-60-in">and the name of its people.</span></div>
    <div id="cap-61" class="cap clip" data-start="104.64" data-duration="1.18"><span id="cap-61-in">But a storm drove</span></div>
    <div id="cap-62" class="cap clip" data-start="105.82" data-duration="1.24"><span id="cap-62-in">White's ships away.</span></div>
    <div id="cap-63" class="cap clip" data-start="107.06" data-duration="1.74"><span id="cap-63-in">He never got to search it.</span></div>
    <div id="cap-64" class="cap clip" data-start="112.17" data-duration="2.02"><span id="cap-64-in">Many historians think the settlers</span></div>
    <div id="cap-65" class="cap clip" data-start="114.19" data-duration="1.43"><span id="cap-65-in">went to Croatoan Island,</span></div>
    <div id="cap-66" class="cap clip" data-start="116.09" data-duration="1.29"><span id="cap-66-in">and joined the people there.</span></div>
    <div id="cap-67" class="cap clip" data-start="118.46" data-duration="2.28"><span id="cap-67-in">Archaeologists on Hatteras Island,</span></div>
    <div id="cap-68" class="cap clip" data-start="120.74" data-duration="1.14"><span id="cap-68-in">the old Croatoan,</span></div>
    <div id="cap-69" class="cap clip" data-start="121.88" data-duration="1.81"><span id="cap-69-in">have found English objects</span></div>
    <div id="cap-70" class="cap clip" data-start="123.69" data-duration="1.28"><span id="cap-70-in">from the right era.</span></div>
    <div id="cap-71" class="cap clip" data-start="124.97" data-duration="1.99"><span id="cap-71-in">Some think that's the answer.</span></div>
    <div id="cap-72" class="cap clip" data-start="128.04" data-duration="1.61"><span id="cap-72-in">Others think they moved inland.</span></div>
    <div id="cap-73" class="cap clip" data-start="129.74" data-duration="0.05"><span id="cap-73-in">Digs have turned up English artifacts,</span></div>
    <div id="cap-74" class="cap clip" data-start="130.29" data-duration="3.53"><span id="cap-74-in">but nothing that settles it.</span></div>
    <div id="cap-75" class="cap clip" data-start="134.9" data-duration="1.74"><span id="cap-75-in">Or they tried to sail home,</span></div>
    <div id="cap-76" class="cap clip" data-start="136.64" data-duration="1.1"><span id="cap-76-in">or were attacked,</span></div>
    <div id="cap-77" class="cap clip" data-start="137.74" data-duration="0.58"><span id="cap-77-in">and died.</span></div>
    <div id="cap-78" class="cap clip" data-start="138.32" data-duration="2.26"><span id="cap-78-in">More than four hundred years later,</span></div>
    <div id="cap-79" class="cap clip" data-start="140.58" data-duration="1.47"><span id="cap-79-in">no one knows for sure.</span></div>
