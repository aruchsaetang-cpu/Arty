  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap clip" data-start="0.15" data-duration="1.62"><span id="cap-0-in">In 1945,</span></div>
    <div id="cap-1" class="cap clip" data-start="1.77" data-duration="1.75"><span id="cap-1-in">five Navy bombers flew out</span></div>
    <div id="cap-2" class="cap clip" data-start="3.52" data-duration="1.29"><span id="cap-2-in">over the ocean on a</span></div>
    <div id="cap-3" class="cap clip" data-start="4.81" data-duration="1.55"><span id="cap-3-in">routine training flight.</span></div>
    <div id="cap-4" class="cap clip" data-start="6.36" data-duration="1.49"><span id="cap-4-in">None of them came back.</span></div>
    <div id="cap-5" class="cap clip" data-start="7.85" data-duration="1.49"><span id="cap-5-in">Then the plane sent to</span></div>
    <div id="cap-6" class="cap clip" data-start="9.34" data-duration="1.73"><span id="cap-6-in">find them disappeared too.</span></div>
    <div id="cap-7" class="cap clip" data-start="12.32" data-duration="1.05"><span id="cap-7-in">On December 5th,</span></div>
    <div id="cap-8" class="cap clip" data-start="13.37" data-duration="1.85"><span id="cap-8-in">Flight 19 took off</span></div>
    <div id="cap-9" class="cap clip" data-start="15.22" data-duration="1.38"><span id="cap-9-in">from Fort Lauderdale,</span></div>
    <div id="cap-10" class="cap clip" data-start="16.6" data-duration="0.53"><span id="cap-10-in">Florida,</span></div>
    <div id="cap-11" class="cap clip" data-start="17.13" data-duration="2.16"><span id="cap-11-in">just after two in the afternoon.</span></div>
    <div id="cap-12" class="cap clip" data-start="20.54" data-duration="2.96"><span id="cap-12-in">Five TBM Avenger torpedo bombers,</span></div>
    <div id="cap-13" class="cap clip" data-start="23.85" data-duration="0.86"><span id="cap-13-in">fourteen men,</span></div>
    <div id="cap-14" class="cap clip" data-start="25.18" data-duration="1.87"><span id="cap-14-in">led by an experienced pilot,</span></div>
    <div id="cap-15" class="cap clip" data-start="27.15" data-duration="1.3"><span id="cap-15-in">Lieutenant Charles Taylor.</span></div>
    <div id="cap-16" class="cap clip" data-start="29.7" data-duration="2.12"><span id="cap-16-in">It was a navigation exercise.</span></div>
    <div id="cap-17" class="cap clip" data-start="31.82" data-duration="0.65"><span id="cap-17-in">Fly east,</span></div>
    <div id="cap-18" class="cap clip" data-start="32.47" data-duration="1.46"><span id="cap-18-in">drop practice bombs,</span></div>
    <div id="cap-19" class="cap clip" data-start="33.93" data-duration="0.8"><span id="cap-19-in">turn north,</span></div>
    <div id="cap-20" class="cap clip" data-start="34.73" data-duration="1.02"><span id="cap-20-in">and come home.</span></div>
    <div id="cap-21" class="cap clip" data-start="35.75" data-duration="2.02"><span id="cap-21-in">About two hours in the air.</span></div>
    <div id="cap-22" class="cap clip" data-start="41.33" data-duration="0.91"><span id="cap-22-in">About an hour and</span></div>
    <div id="cap-23" class="cap clip" data-start="42.24" data-duration="0.55"><span id="cap-23-in">a half in,</span></div>
    <div id="cap-24" class="cap clip" data-start="43.29" data-duration="1.52"><span id="cap-24-in">Taylor radioed that both of</span></div>
    <div id="cap-25" class="cap clip" data-start="44.81" data-duration="1.29"><span id="cap-25-in">his compasses were out.</span></div>
    <div id="cap-26" class="cap clip" data-start="47.35" data-duration="1.36"><span id="cap-26-in">He believed they were</span></div>
    <div id="cap-27" class="cap clip" data-start="48.71" data-duration="1.36"><span id="cap-27-in">over the Florida Keys.</span></div>
    <div id="cap-28" class="cap clip" data-start="50.07" data-duration="2.27"><span id="cap-28-in">They were probably over the Bahamas.</span></div>
    <div id="cap-29" class="cap clip" data-start="53.59" data-duration="1.72"><span id="cap-29-in">Other pilots and the base could</span></div>
    <div id="cap-30" class="cap clip" data-start="55.31" data-duration="1.24"><span id="cap-30-in">hear him on the radio.</span></div>
    <div id="cap-31" class="cap clip" data-start="57.11" data-duration="1.74"><span id="cap-31-in">They urged him to fly west,</span></div>
    <div id="cap-32" class="cap clip" data-start="59.12" data-duration="1.14"><span id="cap-32-in">toward the setting sun.</span></div>
    <div id="cap-33" class="cap clip" data-start="61.52" data-duration="1.12"><span id="cap-33-in">Trying to get home,</span></div>
    <div id="cap-34" class="cap clip" data-start="62.64" data-duration="1.17"><span id="cap-34-in">the flight may have</span></div>
    <div id="cap-35" class="cap clip" data-start="63.81" data-duration="1.24"><span id="cap-35-in">turned the wrong way,</span></div>
    <div id="cap-36" class="cap clip" data-start="65.05" data-duration="1.76"><span id="cap-36-in">further out over the Atlantic.</span></div>
    <div id="cap-37" class="cap clip" data-start="66.81" data-duration="1.06"><span id="cap-37-in">Night was falling.</span></div>
    <div id="cap-38" class="cap clip" data-start="67.87" data-duration="1.81"><span id="cap-38-in">The weather was getting worse.</span></div>
    <div id="cap-39" class="cap clip" data-start="70.93" data-duration="1.74"><span id="cap-39-in">One of the last messages heard:</span></div>
    <div id="cap-40" class="cap clip" data-start="73.15" data-duration="1.21"><span id="cap-40-in">when the first plane</span></div>
    <div id="cap-41" class="cap clip" data-start="74.36" data-duration="1.44"><span id="cap-41-in">drops below ten gallons,</span></div>
    <div id="cap-42" class="cap clip" data-start="76.09" data-duration="1.33"><span id="cap-42-in">we all go down together.</span></div>
    <div id="cap-43" class="cap clip" data-start="80.97" data-duration="1.88"><span id="cap-43-in">A PBM Mariner flying boat took</span></div>
    <div id="cap-44" class="cap clip" data-start="82.85" data-duration="1.44"><span id="cap-44-in">off to search for them,</span></div>
    <div id="cap-45" class="cap clip" data-start="84.76" data-duration="1.35"><span id="cap-45-in">with thirteen men aboard.</span></div>
    <div id="cap-46" class="cap clip" data-start="87.37" data-duration="0.73"><span id="cap-46-in">Soon after,</span></div>
    <div id="cap-47" class="cap clip" data-start="88.28" data-duration="1.33"><span id="cap-47-in">a ship reported flames</span></div>
    <div id="cap-48" class="cap clip" data-start="89.61" data-duration="0.8"><span id="cap-48-in">on the water.</span></div>
    <div id="cap-49" class="cap clip" data-start="90.97" data-duration="1.11"><span id="cap-49-in">The Mariner was never</span></div>
    <div id="cap-50" class="cap clip" data-start="92.08" data-duration="0.91"><span id="cap-50-in">heard from again.</span></div>
    <div id="cap-51" class="cap clip" data-start="94.23" data-duration="0.83"><span id="cap-51-in">Six aircraft.</span></div>
    <div id="cap-52" class="cap clip" data-start="95.06" data-duration="1.08"><span id="cap-52-in">Twenty seven men.</span></div>
    <div id="cap-53" class="cap clip" data-start="96.14" data-duration="1.0"><span id="cap-53-in">In one evening.</span></div>
    <div id="cap-54" class="cap clip" data-start="98.4" data-duration="1.34"><span id="cap-54-in">A huge air and sea</span></div>
    <div id="cap-55" class="cap clip" data-start="99.74" data-duration="1.76"><span id="cap-55-in">search followed for days.</span></div>
    <div id="cap-56" class="cap clip" data-start="101.5" data-duration="1.19"><span id="cap-56-in">It found nothing.</span></div>
    <div id="cap-57" class="cap clip" data-start="102.69" data-duration="0.85"><span id="cap-57-in">No wreckage.</span></div>
    <div id="cap-58" class="cap clip" data-start="103.54" data-duration="0.75"><span id="cap-58-in">No bodies.</span></div>
    <div id="cap-59" class="cap clip" data-start="105.54" data-duration="2.13"><span id="cap-59-in">The Navy first blamed Lieutenant Taylor.</span></div>
    <div id="cap-60" class="cap clip" data-start="108.17" data-duration="2.42"><span id="cap-60-in">His family fought the ruling,</span></div>
    <div id="cap-61" class="cap clip" data-start="110.72" data-duration="0.11"><span id="cap-61-in">and it was changed.</span></div>
    <div id="cap-62" class="cap clip" data-start="114.38" data-duration="1.25"><span id="cap-62-in">The likeliest answer:</span></div>
    <div id="cap-63" class="cap clip" data-start="116.03" data-duration="1.35"><span id="cap-63-in">lost and out of fuel,</span></div>
    <div id="cap-64" class="cap clip" data-start="117.62" data-duration="1.12"><span id="cap-64-in">the planes ditched in</span></div>
    <div id="cap-65" class="cap clip" data-start="118.74" data-duration="1.08"><span id="cap-65-in">rough seas at night.</span></div>
    <div id="cap-66" class="cap clip" data-start="120.47" data-duration="1.65"><span id="cap-66-in">But the Navy's final report</span></div>
    <div id="cap-67" class="cap clip" data-start="122.12" data-duration="1.71"><span id="cap-67-in">listed the cause as unknown.</span></div>
    <div id="cap-68" class="cap clip" data-start="125.08" data-duration="1.28"><span id="cap-68-in">Divers have since found</span></div>
    <div id="cap-69" class="cap clip" data-start="126.36" data-duration="1.49"><span id="cap-69-in">Avenger wrecks off Florida.</span></div>
    <div id="cap-70" class="cap clip" data-start="128.42" data-duration="1.03"><span id="cap-70-in">None has ever been</span></div>
    <div id="cap-71" class="cap clip" data-start="129.45" data-duration="1.77"><span id="cap-71-in">confirmed as Flight 19.</span></div>
    <div id="cap-72" class="cap clip" data-start="132.47" data-duration="1.07"><span id="cap-72-in">And the story helped</span></div>
    <div id="cap-73" class="cap clip" data-start="133.54" data-duration="0.86"><span id="cap-73-in">create a legend:</span></div>
