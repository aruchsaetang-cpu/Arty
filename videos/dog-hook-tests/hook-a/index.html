<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Dog Hook Test</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kanit";
        src: url("assets/fonts/kanit-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Kanit";
        src: url("assets/fonts/kanit-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      :root {
        --green: #39ff14;
        --yellow: #ffe600;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Kanit", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ov {
        z-index: 3;
      }
      #fx {
        z-index: 5;
      }
      .vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.5) 100%);
      }

      /* Sunnah-Edit style caption */
      .cap {
        position: absolute;
        left: 30px;
        right: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        text-align: center;
      }
      .t {
        display: block;
        font-weight: 900;
        font-size: 84px;
        line-height: 1.08;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--white);
        transform: skewX(-7deg);
        white-space: nowrap;
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 8px 18px rgba(0, 0, 0, 0.7);
      }
      .t.g {
        color: var(--green);
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 0 26px rgba(57, 255, 20, 0.85), 0 0 50px rgba(57, 255, 20, 0.45);
      }
      .t.y {
        color: var(--yellow);
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 0 26px rgba(255, 230, 0, 0.8), 0 0 50px rgba(255, 230, 0, 0.4);
      }
      .t.xl {
        font-size: 120px;
      }
      .t.sm {
        font-size: 66px;
      }
      .label {
        position: absolute;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        transform: skewX(-8deg);
        white-space: nowrap;
        text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 0 20px currentColor;
      }
      .stamp {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 900;
        font-size: 104px;
        color: #fff;
        letter-spacing: 0.04em;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), -3px -3px 0 #000, 3px 3px 0 #000;
      }
      svg.draw {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .wm {
        position: absolute;
        left: 0;
        right: 0;
        top: 58px;
        text-align: center;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.45);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      #leak {
        position: absolute;
        left: -300px;
        top: 200px;
        width: 1700px;
        height: 1500px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 120, 200, 0.85) 30%, rgba(255, 150, 40, 0.55) 55%, rgba(255, 80, 160, 0) 72%);
        filter: blur(30px);
      }
      #heart {
        position: absolute;
        left: 600px;
        top: 560px;
        width: 340px;
        height: 339px;
        opacity: 0;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      }
      #loop {
        position: absolute;
        inset: 0;
        background: url(assets/img/loop-first-frame.jpg) center / cover;
        opacity: 0;
        transform: scale(1);
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
      .t.r, .t .r { color: #ff2e3b; text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 0 26px rgba(255, 46, 59, 0.85), 0 0 50px rgba(255, 46, 59, 0.45); }
      .t.b, .t .b { color: #2ec5ff; text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 0 26px rgba(46, 197, 255, 0.85), 0 0 50px rgba(46, 197, 255, 0.45); }
      .t .g { color: var(--green); text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000, 0 0 26px rgba(57, 255, 20, 0.85); }
          .row { display: flex; gap: 22px; justify-content: center; }
      .wait {
        position: absolute;
        left: 0;
        right: 0;
        top: 160px;
        text-align: center;
        font-weight: 700;
        font-size: 64px;
        letter-spacing: 0.02em;
        color: #f2f2f2;
        text-transform: uppercase;
        text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 6px 16px rgba(0, 0, 0, 0.7);
      }
      .sub {
        position: absolute;
        left: 150px;
        right: 150px;
        top: 1300px;
        text-align: center;
        font-weight: 700;
        font-size: 52px;
        line-height: 1.22;
        color: #fff;
        text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 4px 14px rgba(0, 0, 0, 0.7);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.1" data-width="1080" data-height="1920">
      <div class="shot" id="w0"><video id="v0" class="clip" src="assets/footage/f-close.mp4" data-start="0.00" data-duration="2.2" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w1"><video id="v1" class="clip" src="assets/footage/f-claw.mp4" data-start="2.20" data-duration="3.07" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w2"><video id="v2" class="clip" src="assets/footage/f-grab.mp4" data-start="5.27" data-duration="2.83" data-track-index="0" muted playsinline></video></div>
      <div id="grade" class="clip" data-start="0" data-duration="8.1" data-track-index="1"><div class="vig"></div></div>
      <div id="s0" class="clip ov" data-start="0.00" data-duration="2.2" data-track-index="2"><div class="sub">This dog was drowning in a canal.</div></div>
      <div id="s1" class="clip ov" data-start="2.20" data-duration="3.07" data-track-index="2"><div class="sub">One worker climbed into an excavator claw...</div></div>
      <div id="s2" class="clip ov" data-start="5.27" data-duration="2.83" data-track-index="2"><div class="sub">and went in after her.</div></div>
      <audio id="sfx-shutter1" src="assets/audio/camera-shutter.m4a" data-start="0.93" data-duration="0.36" data-track-index="4" data-volume="0.8"></audio>
      <div id="fx" class="clip" data-start="0" data-duration="8.1" data-track-index="3"><div class="wm">LIFE IN FRAME</div><div id="flash"></div></div>
    </div>
<script>
      const tl = gsap.timeline({ paused: true });
      const type = (sel, t, cps = 24) => {
        const el = document.querySelector(sel);
        const txt = el.textContent;
        el.textContent = "";
        for (const c of txt) {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          el.appendChild(sp);
        }
        tl.fromTo(el.querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1 / cps, ease: "none" }, t);
      };
      const out = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.2 }, t);
      const draw = (sel, t, d = 0.4) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      const show = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
      const label = (sel, t) => tl.fromTo(sel, { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(2.5)" }, t);
      const flash = (t, o = 0.75) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      const push = (sel, t, dur, a = 1.0, b = 1.06) => tl.fromTo(sel, { scale: a }, { scale: b, duration: dur, ease: "none", immediateRender: false }, t);

      
      push("#w0", 0.00, 2.2, 1.0, 1.05); tl.set("#s0 .sub", { opacity: 1 }, 0.00); tl.to("#s0 .sub", { opacity: 0, duration: 0.2 }, 2.00);
      push("#w1", 2.20, 3.07, 1.0, 1.05); tl.set("#s1 .sub", { opacity: 1 }, 2.20); tl.to("#s1 .sub", { opacity: 0, duration: 0.2 }, 5.07);
      push("#w2", 5.27, 2.83, 1.0, 1.05); tl.set("#s2 .sub", { opacity: 1 }, 5.27);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
