  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#y2018-year-in", { opacity: 0, x: -40, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 0.08);
    tl.fromTo("#y2018-sub-in", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.9);
    // A dashed wake from open water to the beach; the canoe rides its head.
    const path = document.querySelector("#y2018-path");
    const canoe = document.querySelector("#y2018-canoe");
    const len = path.getTotalLength() || 520;
    const prog = { p: 0 };
    const place = () => {
      const d = prog.p * len;
      const a = path.getPointAtLength(d);
      const b = path.getPointAtLength(Math.max(0, d - 4));
      const ang = (Math.atan2(a.y - b.y, a.x - b.x) * 180) / Math.PI + 180;
      canoe.setAttribute("transform", `translate(${a.x} ${a.y}) rotate(${ang})`);
      path.style.strokeDasharray = `${d} ${len}`;
    };
    tl.fromTo(prog, { p: 0 }, { p: 1, duration: 1.3, ease: "power2.inOut", onUpdate: place, onStart: place }, 0.9);
    tl.fromTo("#y2018-canoe", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0.9);
    // "He never came back": the wake fades, the canoe stays on the sand.
    tl.to("#y2018-path", { opacity: 0.25, duration: 0.5, ease: "power2.inOut" }, 2.6);
    tl.fromTo("#y2018-never-in", { opacity: 0, scale: 1.25, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "expo.out" }, 2.62);
    tl.to(["#y2018-year-in", "#y2018-sub-in", "#y2018-never-in", "#y2018-route"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 3.55);
    window.__timelines["y2018"] = tl;
