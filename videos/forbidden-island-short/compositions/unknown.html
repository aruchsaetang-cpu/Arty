  <script>
    const tl = gsap.timeline({ paused: true });
    const flick = (sel, at) => {
      [[0, 1], [0.05, 0.15], [0.09, 1], [0.17, 0.35], [0.22, 1]].forEach(([dt, o]) => tl.set(sel, { opacity: o }, at + dt));
    };
    tl.fromTo("#unknown-label-in", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.1);
    flick("#unknown-q-in", 0.2);
    // Last impact: the question to the viewer slams in and holds.
    tl.fromTo("#unknown-ask-in", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.14, ease: "power4.out" }, 0.62);
    // Channel mark types in letter by letter as the voice ends.
    const mark = document.querySelector("#unknown-mark-in");
    const word = mark.textContent;
    const typed = { n: 0 };
    tl.fromTo(typed, { n: 0 }, { n: word.length, duration: 0.4, ease: "none", onUpdate: () => { mark.textContent = word.slice(0, Math.round(typed.n)); } }, 0.7);
    window.__timelines["unknown"] = tl;
