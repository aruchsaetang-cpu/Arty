      <span id="years-kicker-in">NO OUTSIDE CONTACT</span>
    </div>
    <div id="years-num" class="clip" data-start="0" data-duration="4.45">

  <script>
    const tl = gsap.timeline({ paused: true });
    // "refused contact" → kicker; count lands on "sixty thousand".
    tl.fromTo("#years-kicker-in", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power4.out" }, 0.75);
    tl.fromTo("#years-num-in", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 1.4);
    const counter = { v: 0 };
    const num = document.querySelector("#years-num-in");
    tl.fromTo(
      counter,
      { v: 0 },
      {
        v: 60000,
        duration: 1.5,
        ease: "power3.out",
        onUpdate: () => {
          num.textContent = (Math.round(counter.v / 100) * 100).toLocaleString("en-US");
        },
      },
      1.42
    );
    tl.to("#years-num-in", { scale: 1.08, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 2.92);
    tl.fromTo("#years-unit-in", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 2.95);
    tl.to(["#years-kicker-in", "#years-num-in", "#years-unit-in"], { opacity: 0, duration: 0.2, ease: "power2.in" }, 4.1);
    window.__timelines["years"] = tl;
