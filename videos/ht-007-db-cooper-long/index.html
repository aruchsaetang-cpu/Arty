<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Accent (warning red)","default":"#e0352b"},
    {"id":"bone","type":"color","label":"Title ink","default":"#ddd3b4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --accent: #e0352b;
        --bone: #ddd3b4;
        --font-display: "League Gothic", sans-serif;
        --font-body: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #120d08;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #120d08;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="150"
      data-width="1920"
      data-height="1080"
    >
      <!-- The evidence wall: one corkboard the torch searches for the whole film -->
      <div
        id="wall"
        data-composition-id="wall"
        data-composition-src="compositions/wall.html"
        data-start="0"
        data-duration="150"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>

      <!-- Night mood: fog, vignette, grain, projector dips at each move -->
      <div
        id="mood"
        data-composition-id="mood"
        data-composition-src="compositions/mood.html"
        data-start="0"
        data-duration="150"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 2"
      ></div>

      <!-- Hook, chapter cards, running chapter label, closing card -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="12.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="chapter1"
        data-composition-id="chapter1"
        data-composition-src="compositions/chapter1.html"
        data-start="42.83"
        data-duration="2.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="chapter2"
        data-composition-id="chapter2"
        data-composition-src="compositions/chapter2.html"
        data-start="72.3"
        data-duration="2.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="chapter3"
        data-composition-id="chapter3"
        data-composition-src="compositions/chapter3.html"
        data-start="108.16"
        data-duration="2.1"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="labels"
        data-composition-id="labels"
        data-composition-src="compositions/labels.html"
        data-start="0"
        data-duration="150.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="compositions/end.html"
        data-start="139.27"
        data-duration="10.73"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 3"
      ></div>

      <!-- Burned-in captions -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="150"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1920"
        data-height="1080"
        style="z-index: 4"
      ></div>

      <audio id="voiceover" class="clip" src="assets/audio/voiceover.m4a" data-start="0" data-duration="150" data-track-index="4" data-volume="1"></audio>
      <audio id="bed" class="clip" src="assets/audio/bed.m4a" data-start="0" data-duration="150" data-track-index="5" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
