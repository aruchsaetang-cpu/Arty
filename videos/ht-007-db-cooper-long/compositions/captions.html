    <div id="cap-0" class="cap clip" data-start="0.15" data-duration="1.48"><span id="cap-0-in">In 1971,</span></div>
    <div id="cap-1" class="cap clip" data-start="2.03" data-duration="2.16"><span id="cap-1-in">a man hijacked a passenger jet,</span></div>
    <div id="cap-2" class="cap clip" data-start="4.6" data-duration="1.84"><span id="cap-2-in">collected a fortune in ransom,</span></div>
    <div id="cap-3" class="cap clip" data-start="6.71" data-duration="1.2"><span id="cap-3-in">and jumped out into a</span></div>
    <div id="cap-4" class="cap clip" data-start="7.91" data-duration="1.37"><span id="cap-4-in">freezing storm at night.</span></div>
    <div id="cap-5" class="cap clip" data-start="9.99" data-duration="1.46"><span id="cap-5-in">He has never been identified.</span></div>
    <div id="cap-6" class="cap clip" data-start="12.7" data-duration="2.34"><span id="cap-6-in">Northwest Orient Flight 305,</span></div>
    <div id="cap-7" class="cap clip" data-start="15.48" data-duration="1.43"><span id="cap-7-in">from Portland to Seattle,</span></div>
    <div id="cap-8" class="cap clip" data-start="17.26" data-duration="1.52"><span id="cap-8-in">the day before Thanksgiving.</span></div>
    <div id="cap-9" class="cap clip" data-start="20.03" data-duration="1.13"><span id="cap-9-in">A quiet man in a</span></div>
    <div id="cap-10" class="cap clip" data-start="21.16" data-duration="1.73"><span id="cap-10-in">dark suit handed a flight</span></div>
    <div id="cap-11" class="cap clip" data-start="22.89" data-duration="1.13"><span id="cap-11-in">attendant a note.</span></div>
    <div id="cap-12" class="cap clip" data-start="24.02" data-duration="1.13"><span id="cap-12-in">It said he had a</span></div>
    <div id="cap-13" class="cap clip" data-start="25.15" data-duration="1.52"><span id="cap-13-in">bomb in his briefcase.</span></div>
    <div id="cap-14" class="cap clip" data-start="27.92" data-duration="1.58"><span id="cap-14-in">His ticket said Dan Cooper.</span></div>
    <div id="cap-15" class="cap clip" data-start="29.9" data-duration="1.22"><span id="cap-15-in">A news mix-up later</span></div>
    <div id="cap-16" class="cap clip" data-start="31.12" data-duration="0.79"><span id="cap-16-in">made it D.B.</span></div>
    <div id="cap-17" class="cap clip" data-start="32.27" data-duration="0.43"><span id="cap-17-in">Cooper.</span></div>
    <div id="cap-18" class="cap clip" data-start="33.95" data-duration="1.69"><span id="cap-18-in">He ordered a bourbon and soda,</span></div>
    <div id="cap-19" class="cap clip" data-start="35.77" data-duration="0.67"><span id="cap-19-in">paid for it,</span></div>
    <div id="cap-20" class="cap clip" data-start="36.68" data-duration="0.74"><span id="cap-20-in">and tried to tip</span></div>
    <div id="cap-21" class="cap clip" data-start="37.42" data-duration="0.97"><span id="cap-21-in">the flight attendant.</span></div>
    <div id="cap-22" class="cap clip" data-start="39.02" data-duration="1.69"><span id="cap-22-in">Witnesses said he was calm,</span></div>
    <div id="cap-23" class="cap clip" data-start="40.79" data-duration="0.74"><span id="cap-23-in">even polite.</span></div>
    <div id="cap-24" class="cap clip" data-start="45.08" data-duration="2.42"><span id="cap-24-in">He wanted $200,000,</span></div>
    <div id="cap-25" class="cap clip" data-start="47.5" data-duration="1.2"><span id="cap-25-in">and four parachutes.</span></div>
    <div id="cap-26" class="cap clip" data-start="49.94" data-duration="0.78"><span id="cap-26-in">In Seattle,</span></div>
    <div id="cap-27" class="cap clip" data-start="50.9" data-duration="0.83"><span id="cap-27-in">he got the money</span></div>
    <div id="cap-28" class="cap clip" data-start="51.73" data-duration="0.97"><span id="cap-28-in">and the parachutes,</span></div>
    <div id="cap-29" class="cap clip" data-start="53.01" data-duration="1.6"><span id="cap-29-in">and let the passengers go.</span></div>

    <div id="cap-54" class="cap clip" data-start="105.27" data-duration="1.58"><span id="cap-54-in">None was ever confirmed.</span></div>
    <div id="cap-55" class="cap clip" data-start="110.41" data-duration="1.81"><span id="cap-55-in">The FBI believed he probably</span></div>
    <div id="cap-56" class="cap clip" data-start="112.22" data-duration="1.54"><span id="cap-56-in">didn't survive the jump.</span></div>
    <div id="cap-57" class="cap clip" data-start="115.01" data-duration="2.19"><span id="cap-57-in">One of the reserve parachutes he</span></div>

    <div id="cap-60" class="cap clip" data-start="119.91" data-duration="1.66"><span id="cap-60-in">Some think that means he</span></div>
    <div id="cap-61" class="cap clip" data-start="121.57" data-duration="1.44"><span id="cap-61-in">was no expert jumper.</span></div>
    <div id="cap-62" class="cap clip" data-start="124.25" data-duration="0.75"><span id="cap-62-in">But his body,</span></div>

    <div id="cap-64" class="cap clip" data-start="126.38" data-duration="1.12"><span id="cap-64-in">and nearly all of the</span></div>
    <div id="cap-65" class="cap clip" data-start="127.5" data-duration="1.21"><span id="cap-65-in">money were never found.</span></div>
    <div id="cap-66" class="cap clip" data-start="129.96" data-duration="1.01"><span id="cap-66-in">In 2016,</span></div>
    <div id="cap-67" class="cap clip" data-start="131.35" data-duration="2.7"><span id="cap-67-in">the FBI stopped actively investigating.</span></div>
