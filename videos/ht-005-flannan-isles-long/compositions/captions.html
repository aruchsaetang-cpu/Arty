  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <div id="cap-0" class="cap clip" data-start="0.15" data-duration="2.25"><span id="cap-0-in">In December 1900,</span></div>
    <div id="cap-1" class="cap clip" data-start="2.4" data-duration="1.72"><span id="cap-1-in">three men vanished from a</span></div>
    <div id="cap-2" class="cap clip" data-start="4.12" data-duration="1.66"><span id="cap-2-in">lighthouse on one of the</span></div>
    <div id="cap-3" class="cap clip" data-start="5.78" data-duration="1.92"><span id="cap-3-in">loneliest islands in Britain.</span></div>
    <div id="cap-4" class="cap clip" data-start="7.7" data-duration="0.66"><span id="cap-4-in">No bodies.</span></div>
    <div id="cap-5" class="cap clip" data-start="8.36" data-duration="0.8"><span id="cap-5-in">No struggle.</span></div>
    <div id="cap-6" class="cap clip" data-start="9.16" data-duration="1.04"><span id="cap-6-in">No explanation.</span></div>
    <div id="cap-7" class="cap clip" data-start="11.15" data-duration="1.76"><span id="cap-7-in">The Flannan Isles sit about</span></div>
    <div id="cap-8" class="cap clip" data-start="12.91" data-duration="1.64"><span id="cap-8-in">twenty miles off the west</span></div>
    <div id="cap-9" class="cap clip" data-start="14.55" data-duration="1.13"><span id="cap-9-in">coast of Scotland.</span></div>
    <div id="cap-10" class="cap clip" data-start="15.68" data-duration="1.82"><span id="cap-10-in">The lighthouse had only been</span></div>
    <div id="cap-11" class="cap clip" data-start="17.5" data-duration="1.25"><span id="cap-11-in">lit a year earlier.</span></div>
    <div id="cap-12" class="cap clip" data-start="19.7" data-duration="2.04"><span id="cap-12-in">The island is tiny and treeless,</span></div>
    <div id="cap-13" class="cap clip" data-start="22.05" data-duration="1.86"><span id="cap-13-in">with sheer cliffs on every side.</span></div>
    <div id="cap-14" class="cap clip" data-start="24.53" data-duration="1.66"><span id="cap-14-in">Getting on and off meant climbing</span></div>
    <div id="cap-15" class="cap clip" data-start="26.19" data-duration="1.22"><span id="cap-15-in">steps cut into the rock.</span></div>
    <div id="cap-16" class="cap clip" data-start="30.66" data-duration="1.33"><span id="cap-16-in">On the fifteenth of December,</span></div>
    <div id="cap-17" class="cap clip" data-start="32.11" data-duration="1.96"><span id="cap-17-in">a passing ship noticed something wrong.</span></div>
    <div id="cap-18" class="cap clip" data-start="34.6" data-duration="0.93"><span id="cap-18-in">The light was out.</span></div>
    <div id="cap-19" class="cap clip" data-start="36.48" data-duration="2.29"><span id="cap-19-in">Three keepers were stationed there.</span></div>
    <div id="cap-20" class="cap clip" data-start="38.77" data-duration="0.79"><span id="cap-20-in">James Ducat,</span></div>
    <div id="cap-21" class="cap clip" data-start="39.56" data-duration="1.05"><span id="cap-21-in">Thomas Marshall,</span></div>
    <div id="cap-22" class="cap clip" data-start="40.61" data-duration="1.43"><span id="cap-22-in">and Donald MacArthur.</span></div>
    <div id="cap-23" class="cap clip" data-start="42.99" data-duration="1.78"><span id="cap-23-in">A fourth keeper rotated in</span></div>
    <div id="cap-24" class="cap clip" data-start="44.77" data-duration="1.11"><span id="cap-24-in">and out by boat.</span></div>
    <div id="cap-25" class="cap clip" data-start="46.47" data-duration="1.37"><span id="cap-25-in">On the day the relief came,</span></div>
    <div id="cap-26" class="cap clip" data-start="48.13" data-duration="1.45"><span id="cap-26-in">it was his turn to return.</span></div>
    <div id="cap-27" class="cap clip" data-start="50.18" data-duration="1.75"><span id="cap-27-in">His name was Joseph Moore.</span></div>
    <div id="cap-28" class="cap clip" data-start="52.88" data-duration="1.75"><span id="cap-28-in">Storms kept the relief boat away</span></div>
    <div id="cap-29" class="cap clip" data-start="54.63" data-duration="1.9"><span id="cap-29-in">until the twenty sixth of December.</span></div>
    <div id="cap-30" class="cap clip" data-start="57.03" data-duration="1.39"><span id="cap-30-in">No flag was flying.</span></div>
    <div id="cap-31" class="cap clip" data-start="58.92" data-duration="0.91"><span id="cap-31-in">No one came down</span></div>
    <div id="cap-32" class="cap clip" data-start="59.83" data-duration="0.65"><span id="cap-32-in">to meet it.</span></div>
    <div id="cap-33" class="cap clip" data-start="63.73" data-duration="1.27"><span id="cap-33-in">The relief keeper climbed</span></div>
    <div id="cap-34" class="cap clip" data-start="65.0" data-duration="0.92"><span id="cap-34-in">up to the station.</span></div>
    <div id="cap-35" class="cap clip" data-start="66.46" data-duration="0.89"><span id="cap-35-in">The door and the</span></div>
    <div id="cap-36" class="cap clip" data-start="67.35" data-duration="0.93"><span id="cap-36-in">gate were closed.</span></div>
    <div id="cap-37" class="cap clip" data-start="68.69" data-duration="0.99"><span id="cap-37-in">The lamp had been</span></div>
    <div id="cap-38" class="cap clip" data-start="69.68" data-duration="1.09"><span id="cap-38-in">cleaned and filled,</span></div>
    <div id="cap-39" class="cap clip" data-start="71.02" data-duration="0.94"><span id="cap-39-in">ready for the night.</span></div>
    <div id="cap-40" class="cap clip" data-start="72.91" data-duration="2.67"><span id="cap-40-in">Moore searched every room,</span></div>
    <div id="cap-41" class="cap clip" data-start="75.65" data-duration="0.86"><span id="cap-41-in">and then the whole island,</span></div>
    <div id="cap-42" class="cap clip" data-start="76.58" data-duration="0.15"><span id="cap-42-in">calling their names.</span></div>
    <div id="cap-43" class="cap clip" data-start="77.19" data-duration="0.82"><span id="cap-43-in">There was no one.</span></div>
    <div id="cap-44" class="cap clip" data-start="78.96" data-duration="1.86"><span id="cap-44-in">Two sets of oilskins were gone.</span></div>
    <div id="cap-45" class="cap clip" data-start="81.31" data-duration="1.01"><span id="cap-45-in">The third was still</span></div>
    <div id="cap-46" class="cap clip" data-start="82.32" data-duration="0.66"><span id="cap-46-in">on its hook.</span></div>
    <div id="cap-47" class="cap clip" data-start="83.39" data-duration="0.88"><span id="cap-47-in">One man had gone</span></div>
    <div id="cap-48" class="cap clip" data-start="84.27" data-duration="1.14"><span id="cap-48-in">out without his coat.</span></div>
    <div id="cap-49" class="cap clip" data-start="86.36" data-duration="1.51"><span id="cap-49-in">The last entries on the keepers'</span></div>
    <div id="cap-50" class="cap clip" data-start="87.87" data-duration="1.42"><span id="cap-50-in">slate were from the fifteenth.</span></div>
    <div id="cap-51" class="cap clip" data-start="89.87" data-duration="0.64"><span id="cap-51-in">After that,</span></div>
    <div id="cap-52" class="cap clip" data-start="90.63" data-duration="0.57"><span id="cap-52-in">nothing.</span></div>
    <div id="cap-53" class="cap clip" data-start="92.15" data-duration="1.12"><span id="cap-53-in">At the west landing,</span></div>
    <div id="cap-54" class="cap clip" data-start="93.62" data-duration="1.2"><span id="cap-54-in">railings were twisted,</span></div>
    <div id="cap-55" class="cap clip" data-start="95.37" data-duration="1.01"><span id="cap-55-in">and a heavy box of</span></div>
    <div id="cap-56" class="cap clip" data-start="96.38" data-duration="1.32"><span id="cap-56-in">ropes had been torn from</span></div>
    <div id="cap-57" class="cap clip" data-start="97.7" data-duration="1.17"><span id="cap-57-in">a crevice more than a</span></div>
    <div id="cap-58" class="cap clip" data-start="98.87" data-duration="1.48"><span id="cap-58-in">hundred feet above the sea.</span></div>
    <div id="cap-59" class="cap clip" data-start="103.6" data-duration="1.29"><span id="cap-59-in">The official theory:</span></div>
    <div id="cap-60" class="cap clip" data-start="104.89" data-duration="1.36"><span id="cap-60-in">the men went down to</span></div>
    <div id="cap-61" class="cap clip" data-start="106.25" data-duration="1.82"><span id="cap-61-in">secure equipment in a storm,</span></div>
    <div id="cap-62" class="cap clip" data-start="108.07" data-duration="1.42"><span id="cap-62-in">and a huge wave swept</span></div>
    <div id="cap-63" class="cap clip" data-start="109.49" data-duration="1.28"><span id="cap-63-in">them off the rocks.</span></div>
    <div id="cap-64" class="cap clip" data-start="111.72" data-duration="1.2"><span id="cap-64-in">But why would one man</span></div>
    <div id="cap-65" class="cap clip" data-start="112.92" data-duration="1.42"><span id="cap-65-in">run out without his coat?</span></div>
    <div id="cap-66" class="cap clip" data-start="114.97" data-duration="0.81"><span id="cap-66-in">Maybe he saw the</span></div>
    <div id="cap-67" class="cap clip" data-start="115.78" data-duration="0.9"><span id="cap-67-in">others in trouble,</span></div>
    <div id="cap-68" class="cap clip" data-start="116.84" data-duration="0.96"><span id="cap-68-in">and ran to help.</span></div>
    <div id="cap-69" class="cap clip" data-start="118.76" data-duration="1.6"><span id="cap-69-in">Others have suggested a fight,</span></div>
    <div id="cap-70" class="cap clip" data-start="120.7" data-duration="1.84"><span id="cap-70-in">or madness from the isolation.</span></div>
    <div id="cap-71" class="cap clip" data-start="123.11" data-duration="0.87"><span id="cap-71-in">But there was no</span></div>
    <div id="cap-72" class="cap clip" data-start="123.98" data-duration="0.81"><span id="cap-72-in">sign of either.</span></div>
    <div id="cap-73" class="cap clip" data-start="125.73" data-duration="1.02"><span id="cap-73-in">Over the years,</span></div>
    <div id="cap-74" class="cap clip" data-start="126.75" data-duration="1.03"><span id="cap-74-in">the story grew.</span></div>
    <div id="cap-75" class="cap clip" data-start="127.78" data-duration="2.66"><span id="cap-75-in">A famous poem in 1912</span></div>
    <div id="cap-76" class="cap clip" data-start="130.44" data-duration="2.18"><span id="cap-76-in">added ghostly details that were</span></div>
    <div id="cap-77" class="cap clip" data-start="132.62" data-duration="1.82"><span id="cap-77-in">never in the real reports.</span></div>
    <div id="cap-78" class="cap clip" data-start="135.4" data-duration="2.0"><span id="cap-78-in">Their bodies were never found.</span></div>
    <div id="cap-79" class="cap clip" data-start="137.4" data-duration="2.34"><span id="cap-79-in">Today the light runs automatically.</span></div>
    <div id="cap-80" class="cap clip" data-start="139.74" data-duration="1.06"><span id="cap-80-in">No one lives on</span></div>
    <div id="cap-81" class="cap clip" data-start="140.8" data-duration="1.25"><span id="cap-81-in">the island at all.</span></div>
