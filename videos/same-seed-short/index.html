<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>same-seed</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "JetBrains Mono", monospace; font-weight: 700; color: #f1ede6; }
#stage { position: absolute; inset: 0; }
#shake { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.pn { position: absolute; left: 0; width: 1080px; height: 380px; overflow: hidden; }
.pn svg { position: absolute; left: 0; top: 0; width: 1080px; height: 380px; }
svg text { font-family: "JetBrains Mono"; font-weight: 700; }
.ol { fill: none; stroke: #0b0a09; stroke-width: 56; stroke-linecap: round; stroke-linejoin: round; }
.sh { fill: none; stroke: #a9a7a2; stroke-width: 42; stroke-linecap: round; stroke-linejoin: round; }
.hi { fill: none; stroke: #f6f4ef; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
.bk.sh { stroke: #77756f; } .bk.hi { stroke: #c4c2bc; }
.tor.ol { stroke-width: 84; } .tor.sh { stroke-width: 70; } .tor.hi { stroke-width: 50; }
#strip { position: absolute; left: 0; top: 900px; width: 1080px; height: 120px; text-align: center; }
#strip .a { display: block; margin-top: 12px; font-size: 34px; letter-spacing: 12px; color: #cfc8bb; white-space: nowrap; }
#strip .b { display: block; font-size: 50px; letter-spacing: 8px; line-height: 1.15; white-space: nowrap; }
#strip .b b { font-size: 64px; font-weight: 700; }
.tag { position: absolute; display: block; right: 30px; width: 340px; height: 210px; border-radius: 18px; border: 5px solid #5a4a36; background: rgba(0,0,0,.82); text-align: center; }
.tag .r { display: block; margin-top: 12px; font-size: 78px; line-height: 1; white-space: nowrap; }
.tag .m { display: block; font-size: 44px; line-height: 1.35; color: #e9c98a; white-space: nowrap; }
.tag .n { display: block; font-size: 22px; letter-spacing: 1px; color: #cfc8bb; white-space: nowrap; }
.tag.win { background: #f1ede6; border-color: #f1ede6; color: #0b0a09; }
.tag.win .m { color: #3f7a2c; } .tag.win .n { color: #3a3a43; }

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24.828" data-width="1080" data-height="1920" data-fps="30">
 <div id="stage" class="clip" data-start="0" data-duration="24.828" data-track-index="1">
  <div id="shake"><div id="panels"></div><div id="strip"><span class="a">SAME SEED</span><span class="b">DAY <b id="day">1</b></span></div></div>
  <div id="tags"></div>
  <div id="flash"></div>
 </div>
</div>
<script>
// ---- the story (edit these tables). Beats: 1.0 = one beat; the 60 days run from beat T0 to T1.
const T0 = 1.5, T1 = 30, ORDER = ["R", "C", "F", "G"];
const NAME = { R: "ALL AT ONCE", C: "THE CHECKER", F: "TWO WEEKS", G: "EVERY DAY" };
const CPX = 1.304; // centimetres per pixel of plant
const H = { // plant height in px over beats (C is built from its dig cycles below)
  R: [[0, 0], [2.6, 0], [6, 64, "power2.out"], [9, 64], [14, 4, "power1.in"], [36, 4]],
  F: [[0, 0], [T0, 0], [8, 90, "power1.out"], [36, 90]],
  G: [[0, 0], [T0, 0], [T1, 230, "none"], [36, 230]],
};
const WILT = { R: [[0, 0], [8, 0], [12, 1], [36, 1]], C: [[0, 0], [36, 0]], F: [[0, 0], [11, 0], [22, 1], [36, 1]], G: [[0, 0], [36, 0]] };
const PUDDLE = [[0, 0], [2.1, 0], [2.8, 1], [12, 0.75], [30, 0.25], [36, 0.25]];
const CYC = { start: 2, len: 4, grow: 2.4, dig: 1.2, last: 26 }; // the checker waters, then digs it up to look, every 4 beats
const MODES = {
  R: [[0, "stand"], [1.4, "bucket"], [3.2, "wait"], [9.6, "shock"], [14, "slump"]],
  C: [[0, "stand"]],
  F: [[0, "stand"], [T0, "can"], [8, "phone"]],
  G: [[0, "stand"], [T0, "can"], [T1, "cheer"]],
};
for (let s = CYC.start; s <= CYC.last; s += CYC.len) MODES.C.push([s, "can"], [s + CYC.grow, "dig"]);
MODES.C.push([CYC.last + CYC.len, "can"], [T1, "stand"]);
const RANK = [["4TH", "R", "drowned it on day 1"], ["3RD", "C", "kept digging it up"], ["2ND", "F", "stopped after two weeks"], ["1ST", "G", "a little, every day"]];

const PY = { R: 140, C: 520, F: 1020, G: 1400 }, FLOOR = 336, FX = 380, SX = 620, U = 0.56;
const limbs = (k) => ["aB", "lB", "to", "lF", "aF"].map((p) => { const c = (p === "to" ? " tor" : "") + (p[1] === "B" ? " bk" : ""); return `<polyline id="o-${p}-${k}" class="ol${c}"/><polyline id="s-${p}-${k}" class="sh${c}"/><polyline id="h-${p}-${k}" class="hi${c}" transform="translate(-5 -6)"/>`; }).join("");
const CAN = `<g><path d="M8 -26 L84 -26 L76 34 L16 34 Z" fill="#7aa7c7" stroke="#0b0a09" stroke-width="7" stroke-linejoin="round"/><path d="M80 -6 L148 -48" stroke="#0b0a09" stroke-width="20" stroke-linecap="round"/><path d="M80 -6 L148 -48" stroke="#7aa7c7" stroke-width="9" stroke-linecap="round"/><path d="M-4 -10 C -4 -46, 30 -46, 30 -26" fill="none" stroke="#0b0a09" stroke-width="9"/></g>`;
const BUCKET = `<g><path d="M-6 0 L84 0 L72 96 L6 96 Z" fill="#9aa0ad" stroke="#0b0a09" stroke-width="7" stroke-linejoin="round"/><rect x="-8" y="-6" width="94" height="14" rx="6" fill="#c8ccd6" stroke="#0b0a09" stroke-width="5"/><path d="M4 0 C 10 -54, 70 -54, 76 0" fill="none" stroke="#0b0a09" stroke-width="6"/></g>`;
const PHONE = `<g><rect x="-22" y="-60" width="44" height="76" rx="8" fill="#16161a" stroke="#0b0a09" stroke-width="5"/><rect x="-16" y="-52" width="32" height="58" rx="4" fill="#8fd3ff"/></g>`;
const LEAF = "M0 0 Q 15 -11 30 0 Q 15 11 0 0 Z";
const panel = (k) => `<div class="pn" style="top:${PY[k]}px"><svg viewBox="0 0 1080 380">
  <defs><linearGradient id="cone-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".34"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="flr-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2c1c"/><stop offset="1" stop-color="#000"/></linearGradient>
  <radialGradient id="glow-${k}"><stop offset="0" stop-color="#8fd3ff" stop-opacity=".5"/><stop offset="1" stop-color="#8fd3ff" stop-opacity="0"/></radialGradient></defs>
  ${[230, 900].map((x) => `<g transform="translate(${x} 0)"><polygon points="-26,64 26,64 190,${FLOOR} -190,${FLOOR}" fill="url(#cone-${k})"/><line x1="0" y1="0" x2="0" y2="40" stroke="#5a4a36" stroke-width="4"/><path d="M-32 64 L-18 40 L18 40 L32 64 Z" fill="#2a2118" stroke="#5a4a36" stroke-width="4"/><ellipse cx="0" cy="66" rx="26" ry="7" fill="#ffe6b8"/></g>`).join("")}
  <rect x="0" y="${FLOOR}" width="1080" height="${380 - FLOOR}" fill="url(#flr-${k})"/><line x1="0" y1="${FLOOR}" x2="1080" y2="${FLOOR}" stroke="#6a573f" stroke-width="5"/>
  <ellipse id="pud-${k}" cx="${SX}" cy="${FLOOR + 4}" rx="150" ry="16" fill="#3d6f9a" opacity="0"/>
  <g id="pt-${k}" transform="translate(${SX} ${FLOOR})">
    <g id="pl-${k}"><ellipse cx="0" cy="-4" rx="7" ry="9" fill="#c9a46a" stroke="#3a2c1c" stroke-width="3"/><path id="stem-${k}" fill="none" stroke-linecap="round"/>
      ${[0, 1, 2, 3, 4, 5].map((i) => `<path id="lf${i}-${k}" d="${LEAF}" stroke="#0b0a09" stroke-width="3"/>`).join("")}
      <g id="cn-${k}"><circle cx="0" cy="-30" r="70"/><circle cx="-56" cy="6" r="50"/><circle cx="56" cy="6" r="52"/><circle cx="0" cy="24" r="46"/></g>
      ${[[-30, -40], [28, -10], [-52, 18], [50, 30], [6, 22]].map((p, i) => `<circle id="fr${i}-${k}" cx="${p[0]}" cy="${p[1]}" r="11" fill="#e0283c" stroke="#0b0a09" stroke-width="3"/>`).join("")}</g>
  </g>
  <ellipse cx="${SX}" cy="${FLOOR + 2}" rx="48" ry="10" fill="#4a3826"/>
  <polyline id="wt-${k}" fill="none" stroke="#8fd3ff" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 16"/>
  <ellipse id="gl-${k}" rx="70" ry="60" fill="url(#glow-${k})"/>
  <g id="fg-${k}">${limbs(k)}<g id="pr-${k}">${k === "R" ? BUCKET : k === "F" ? `<g id="cn2-${k}">${CAN}</g><g id="ph-${k}">${PHONE}</g>` : CAN}</g><g id="hd-${k}"><circle r="46" fill="#a9a7a2" stroke="#0b0a09" stroke-width="8"/><circle cx="-5" cy="-6" r="36" fill="#f6f4ef"/></g></g>
  <g id="ex-${k}"><text id="q-${k}" x="-14" y="-64" font-size="54" fill="#f1ede6">?</text><text id="bang-${k}" x="-12" y="-64" font-size="64" fill="#e0283c">!</text></g>
  <text x="40" y="46" font-size="32" fill="#f1ede6" letter-spacing="8">${NAME[k]}</text>
  <text id="cm-${k}" x="1040" y="46" font-size="34" text-anchor="end" fill="#e9c98a" letter-spacing="3">0 CM</text>
</svg></div>`;
document.getElementById("panels").innerHTML = ORDER.map(panel).join("");
document.getElementById("tags").innerHTML = ORDER.map((k) => `<div class="dimr" id="dim-${k}" style="top:${PY[k]}px"></div>`).join("") + RANK.map((r, i) => `<div class="tag${i === 3 ? " win" : ""}" id="tag${i}" style="top:${PY[r[1]] + 90}px"><span class="r">${r[0]}</span><span class="m" id="tm${i}"></span><span class="n">${r[2]}</span></div>`).join("");

// ---- posable figure: joint angles in, limb points out
const D2R = Math.PI / 180, $ = (id) => document.getElementById(id);
const dir = (a) => [Math.sin(a * D2R), Math.cos(a * D2R)];
const POSE = {
  stand: () => ({ lean: 0, head: 0, aF: [10, 8], aB: [-8, 8], lF: [8, 0], lB: [-8, 0] }),
  can: (t) => ({ lean: 6, head: 14, aF: [74, 6], aB: [-10, 10], lF: [10, 0], lB: [-8, 0] }),
  bucket: () => ({ lean: -6, head: 10, aF: [128, -20], aB: [118, -14], lF: [16, 0], lB: [-12, 0] }),
  wait: (t) => ({ lean: 0, head: 10 + 4 * Math.sin(t * 2), aF: [42, 112], aB: [32, 116], lF: [12 + 8 * Math.max(0, Math.sin(t * Math.PI * 2)), 4], lB: [-8, 0] }),
  shock: (t) => ({ lean: -6, head: 8, aF: [160, 150], aB: [150, 150], lF: [14, 0], lB: [-14, 0], dy: -6 * Math.abs(Math.sin(t * 6)) }),
  slump: (t) => ({ lean: 24, head: 40, aF: [40, 50], aB: [30, 56], lF: [82, 128], lB: [72, 118] }),
  dig: (t) => ({ lean: 74, head: -10, aF: [20 + 10 * Math.sin(t * 12), 18], aB: [12 - 10 * Math.sin(t * 12), 20], lF: [46, 92], lB: [-12, 96], dx: 150 }),
  phone: (t) => ({ lean: 2, head: 34, aF: [38, 104], aB: [-8, 8], lF: [8, 0], lB: [-8, 0] }),
  cheer: (t) => ({ lean: -4, head: -12, aF: [158, 8], aB: [-158, -8], lF: [10, 0], lB: [-10, 0], dy: -24 * Math.abs(Math.sin(t * Math.PI)) }),
};
const NUM = ["lean", "head", "rot", "dx", "dy"], ARR = ["aF", "aB", "lF", "lB"];
const mix = (a, b, k) => { const o = {}; NUM.forEach((n) => { o[n] = (a[n] || 0) + ((b[n] || 0) - (a[n] || 0)) * k; }); ARR.forEach((n) => { o[n] = [a[n][0] + (b[n][0] - a[n][0]) * k, a[n][1] + (b[n][1] - a[n][1]) * k]; }); return o; };
const modeAt = (k, t) => { const m = MODES[k]; let i = 0; while (i + 1 < m.length && m[i + 1][0] <= t) i++; return i; };
const solve = (p) => {
  const S = [150 * Math.sin(p.lean * D2R), -150 * Math.cos(p.lean * D2R)], hd = (p.lean + p.head) * D2R, HC = [S[0] + 66 * Math.sin(hd), S[1] - 66 * Math.cos(hd)];
  const limb = (o, a, b, l) => { const d1 = dir(a), j = [o[0] + l * d1[0], o[1] + l * d1[1]], d2 = dir(b); return [o, j, [j[0] + l * d2[0], j[1] + l * d2[1]]]; };
  const pts = { to: [[0, 0], S], aF: limb(S, p.aF[0], p.aF[0] + p.aF[1], 82), aB: limb(S, p.aB[0], p.aB[0] + p.aB[1], 82), lF: limb([0, 0], p.lF[0], p.lF[0] - p.lF[1], 105), lB: limb([0, 0], p.lB[0], p.lB[0] - p.lB[1], 105), hc: [HC] };
  let maxY = -1e9; Object.keys(pts).forEach((n) => pts[n].forEach((q) => { maxY = Math.max(maxY, q[1] + (n === "hc" ? 46 : n === "to" ? 34 : 20)); }));
  const oy = -maxY + (p.dy || 0); Object.keys(pts).forEach((n) => { pts[n] = pts[n].map(([x, y]) => [x, y + oy]); });
  return pts;
};
const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
const lerpC = (a, b, k) => { const A = hex(a), B = hex(b); return "rgb(" + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(",") + ")"; };

document.fonts.ready.then(() => {
  // Played at 87 BPM. Fixed framing: no camera moves, no zoom.
  const BPM = 87, K = 60 / BPM, END = 36;
  const R = gsap.timeline({ paused: true }), M = gsap.timeline();
  const kf = (a, t) => { for (let i = 1; i < a.length; i++) if (t <= a[i][0]) { const [t0, v0] = a[i - 1], [t1, v1, e] = a[i], k = (t - t0) / (t1 - t0); return v0 + (v1 - v0) * (e ? gsap.parseEase(e)(k) : k); } return a[a.length - 1][1]; };
  const str = (a) => a.map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  const clamp = (v) => Math.max(0, Math.min(1, v));
  // the checker: grows a little, gets pulled up to be looked at, goes back in at zero
  const cState = (t) => {
    if (t < CYC.start) return { h: 0, lift: 0 };
    if (t >= CYC.last + CYC.len) return { h: Math.min(8, (t - CYC.last - CYC.len) * 3), lift: 0 };
    const c = (t - CYC.start) % CYC.len;
    if (c < CYC.grow) return { h: 14 * c / CYC.grow, lift: 0 };
    const d = (c - CYC.grow) / CYC.dig; return { h: 14, lift: d < 1 ? Math.sin(Math.min(1, d) * Math.PI) * 46 : 0 };
  };
  const plant = (k, t) => { if (k === "C") { const s = cState(t); return { h: s.h, w: 0, lift: s.lift }; } return { h: kf(H[k], t), w: kf(WILT[k], t), lift: 0 }; };
  const cmOf = (k, t) => { const p = plant(k, t); return Math.round(p.h * (1 - 0.45 * p.w) * CPX); };
  const poseAt = (k, t) => { const m = MODES[k], i = modeAt(k, t), cur = POSE[m[i][1]](t), B = 0.3;
    if (i > 0 && t < m[i][0] + B) return mix(POSE[m[i - 1][1]](t), cur, gsap.parseEase("power2.out")((t - m[i][0]) / B)); return mix(cur, cur, 1); };
  const drawPlant = (k, p, t) => {
    const h = p.h, a = p.w * 112 * D2R, sway = Math.sin(t * 1.7 + PY[k]) * 2 * D2R * (1 - p.w);
    const P2 = [Math.sin(a + sway) * h * 0.5, -h * 0.6 - Math.cos(a + sway) * h * 0.4], C = [0, -h * 0.6];
    const stemC = lerpC("#6fbf5a", "#7c5a32", p.w), leafC = lerpC("#8fd16a", "#a0783e", p.w);
    const st = $(`stem-${k}`); st.setAttribute("d", `M0 0 Q ${C[0]} ${C[1].toFixed(1)} ${P2[0].toFixed(1)} ${P2[1].toFixed(1)}`); st.setAttribute("stroke", stemC); st.setAttribute("stroke-width", (4 + h / 230 * 12).toFixed(1)); st.setAttribute("opacity", h > 1 ? 1 : 0);
    const B = (f) => [2 * (1 - f) * f * C[0] + f * f * P2[0], 2 * (1 - f) * f * C[1] + f * f * P2[1]], D = (f) => [2 * (1 - f) * C[0] + 2 * f * (P2[0] - C[0]), 2 * (1 - f) * C[1] + 2 * f * (P2[1] - C[1])];
    [0.3, 0.42, 0.56, 0.68, 0.82, 0.96].forEach((f, i) => {
      const q = B(f), d = D(f), th = Math.atan2(d[1], d[0]) / D2R, side = i % 2 ? 1 : -1, s = Math.min(1, h / 50) * (0.7 + 0.6 * (1 - f)) * (h > 130 ? 1.4 : 1);
      const ang = th + side * (60 + p.w * 70), el = $(`lf${i}-${k}`);
      el.setAttribute("transform", `translate(${q[0].toFixed(1)} ${q[1].toFixed(1)}) rotate(${ang.toFixed(1)}) scale(${s.toFixed(2)})`); el.setAttribute("fill", leafC); el.setAttribute("opacity", h * f > 8 ? 1 : 0);
    });
    const cs = 0.8 * clamp((h - 110) / 120), cn = $(`cn-${k}`); cn.setAttribute("transform", `translate(${P2[0].toFixed(1)} ${(P2[1] + 10).toFixed(1)}) scale(${cs.toFixed(2)})`); cn.setAttribute("fill", leafC); cn.setAttribute("stroke", "#0b0a09"); cn.setAttribute("stroke-width", 4); cn.setAttribute("opacity", cs > 0.02 ? 1 : 0);
    const fa = clamp((h - 190) / 36); [0, 1, 2, 3, 4].forEach((i) => { const el = $(`fr${i}-${k}`); el.setAttribute("opacity", clamp(fa * 5 - i)); el.setAttribute("transform", `translate(${P2[0].toFixed(1)} ${(P2[1] + 10).toFixed(1)}) scale(${cs.toFixed(2)})`); });
    $(`pl-${k}`).setAttribute("transform", `translate(${(p.lift * 0.3).toFixed(1)} ${(-p.lift).toFixed(1)}) rotate(${(p.lift * 0.4).toFixed(1)})`);
  };
  const apply = (t) => {
    $("day").textContent = Math.max(1, Math.min(60, 1 + Math.floor((t - T0) / (T1 - T0) * 59)));
    ORDER.forEach((k) => {
      const p = poseAt(k, t), pts = solve(p), mode = MODES[k][modeAt(k, t)][1], fx = FX + p.dx * U;
      ["aB", "lB", "to", "lF", "aF"].forEach((n) => { const s = str(pts[n]); ["o", "s", "h"].forEach((l) => $(`${l}-${n}-${k}`).setAttribute("points", s)); });
      $(`hd-${k}`).setAttribute("transform", `translate(${pts.hc[0][0].toFixed(1)} ${pts.hc[0][1].toFixed(1)}) rotate(${(p.lean + p.head).toFixed(1)})`);
      $(`fg-${k}`).setAttribute("transform", `translate(${fx.toFixed(1)} ${FLOOR}) scale(${U})`);
      // what is in the hand, and whether water comes out
      const hand = pts.aF[2], ph = (t - T0) % 1, beatPour = Math.max(0, Math.sin(ph * Math.PI));
      let tilt = 0, show = 1, pour = 0, spout = [148, -48];
      if (k === "R") { tilt = mode === "bucket" ? 20 + 110 * clamp((t - 1.9) / 0.4) : 0; show = mode === "bucket" ? 1 : 0; pour = mode === "bucket" && t > 2.1 ? 1 : 0; spout = [80, 0]; }
      else if (k === "F") { show = 1; $(`cn2-${k}`).setAttribute("opacity", mode === "can" ? 1 : 0); $(`ph-${k}`).setAttribute("opacity", mode === "phone" ? 1 : 0); if (mode === "can") { tilt = 10 + 44 * beatPour; pour = beatPour > 0.45 ? 1 : 0; } }
      else { show = mode === "can" ? 1 : 0; if (mode === "can") { tilt = 10 + 44 * beatPour; pour = beatPour > 0.45 ? 1 : 0; } }
      const pr = $(`pr-${k}`); pr.setAttribute("opacity", show); pr.setAttribute("transform", `translate(${hand[0].toFixed(1)} ${hand[1].toFixed(1)}) rotate(${tilt.toFixed(1)})`);
      const r = tilt * D2R, sx = hand[0] + spout[0] * Math.cos(r) - spout[1] * Math.sin(r), sy = hand[1] + spout[0] * Math.sin(r) + spout[1] * Math.cos(r);
      const wx = fx + sx * U, wy = FLOOR + sy * U, wt = $(`wt-${k}`);
      wt.setAttribute("points", `${wx.toFixed(1)},${wy.toFixed(1)} ${((wx + SX) / 2 + 10).toFixed(1)},${(wy + 20).toFixed(1)} ${(SX - 6).toFixed(1)},${FLOOR - 6}`);
      wt.setAttribute("opacity", pour); wt.setAttribute("stroke-width", k === "R" ? 26 : 7); wt.setAttribute("stroke-dashoffset", (-t * 120).toFixed(1));
      const gl = $(`gl-${k}`); gl.setAttribute("opacity", k === "F" && mode === "phone" ? 1 : 0); gl.setAttribute("cx", (fx + hand[0] * U).toFixed(1)); gl.setAttribute("cy", (FLOOR + hand[1] * U - 20).toFixed(1));
      if (k === "R") $(`pud-${k}`).setAttribute("opacity", 0.75 * kf(PUDDLE, t)), $(`pud-${k}`).setAttribute("rx", (60 + 120 * kf(PUDDLE, t)).toFixed(1));
      drawPlant(k, plant(k, t), t);
      const hx = fx + pts.hc[0][0] * U, hy = FLOOR + pts.hc[0][1] * U; $(`ex-${k}`).setAttribute("transform", `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
      $(`q-${k}`).setAttribute("opacity", (k === "C" && mode === "dig") || (k === "R" && mode === "wait" && t > 6) ? 1 : 0);
      $(`bang-${k}`).setAttribute("opacity", k === "R" && mode === "shock" ? 1 : 0);
      $(`cm-${k}`).textContent = cmOf(k, t) + " CM";
    });
  };
  RANK.forEach((r, i) => { $(`tm${i}`).textContent = cmOf(r[1], END) + " CM"; });
  const clk = { v: 0 };
  M.fromTo(clk, { v: 0 }, { v: 1, duration: END, ease: "none", onUpdate: () => apply(M.time()) }, 0);
  apply(0);

  const flash = (t, a = 0.3) => M.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
  const bump = (t, a = 14) => M.fromTo("#shake", { y: a }, { y: 0, duration: 0.4, ease: "elastic.out(1.4,0.3)", immediateRender: false }, t);
  gsap.set(".tag, .dimr, #flash", { opacity: 0 });
  bump(2.2, 12);                       // the whole bucket hits the soil
  flash(T1, 0.45); bump(T1, 14);
  M.fromTo("#strip .b", { scale: 1 }, { scale: 1.18, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T1);
  // ---- individual results, last place first
  RANK.forEach((r, i) => { const t = 31.0 + i, last = i === 3;
    M.fromTo(`#tag${i}`, { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
    if (!last) M.to(`#dim-${r[1]}`, { opacity: 0.45, duration: 0.4 }, t + 0.2);
    else { flash(t + 0.2, 0.5); bump(t + 0.2, 16); M.fromTo(`#tag${i}`, { scale: 1 }, { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t + 0.25); } });
  M.set({}, {}, END);
  M.timeScale(1 / K); R.add(M, 0);
  window.__timelines["main"] = R;
});
