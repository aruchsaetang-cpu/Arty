<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05080f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
      }
      #film-wrap {
        position: absolute;
        inset: 0;
        transform-origin: 50% 40%;
      }
      #film {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.0" data-width="1080" data-height="1920">
      <!-- The original film, retimed scene by scene to the new voiceover; its sound bed rides along -->
      <div id="film-wrap" data-layout-allow-overflow data-layout-ignore>
        <video id="film" class="clip" src="assets/footage/retimed.mp4" data-start="0" data-duration="10.0" data-track-index="1" data-has-audio="true" data-volume="1" playsinline></video>
      </div>
      <!-- Big 2-3 word captions -->
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="10.0" data-track-index="3" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index: 4"></div>
      <audio id="voiceover" class="clip" src="assets/audio/voiceover.m4a" data-start="0" data-duration="10.0" data-track-index="4" data-volume="1"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Frame 0 punches in, so the first thing the feed shows is motion.
      tl.fromTo("#film-wrap", { scale: 1.14 }, { scale: 1, duration: 0.6, ease: "expo.out" }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
