<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>titanic-sketch-gfx</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Itim"; src: url("assets/fonts/itim-thai-400-normal.woff2") format("woff2"); unicode-range: U+0E01-0E5B, U+200C-200D, U+25CC; }
      @font-face { font-family: "Itim"; src: url("assets/fonts/itim-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #efe6d2; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: "Itim", sans-serif; color: #2a2622;
        background: radial-gradient(ellipse at 50% 45%, #f6eedc 0%, #e9dec6 70%, #d9ccb0 100%); }
      #grain { position: absolute; inset: 0; opacity: 0.35; mix-blend-mode: multiply; }
      .scene { position: absolute; inset: 0; opacity: 0; }
      svg.draw { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
      .ink { fill: none; stroke: #2a2622; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .ink.thin { stroke-width: 4; opacity: 0.75; }
      .red { fill: none; stroke: #c4161c; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; }
      .big { position: absolute; left: 0; width: 1920px; text-align: center; white-space: nowrap; }
      .wipe { clip-path: inset(0 100% 0 0); }
      #pencil { position: absolute; left: 0; top: 0; width: 260px; height: 60px; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.2" data-width="1920" data-height="1080" data-fps="30">
      <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0.55 0"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>

      <!-- A: who drew it? (0-3.6) -->
      <div id="A" class="scene clip" data-start="0" data-duration="3.6" data-track-index="1">
        <svg class="draw">
          <path class="ink a1" d="M560 210 C760 196 1160 204 1362 214 C1368 420 1362 660 1356 870 C1150 880 760 876 566 866 C556 650 562 420 560 210" />
          <path class="ink thin a2" d="M582 236 C780 226 1150 230 1336 238" />
          <path class="ink a3" d="M860 380 C860 300 960 270 1010 300 C1070 335 1050 410 990 450 C950 478 945 520 948 560" />
          <path class="ink a4" d="M948 640 L950 650" />
        </svg>
        <div class="big" id="aq" style="top: 700px; font-size: 96px; opacity: 0;">ใครวาด?</div>
      </div>

      <!-- B: Jack Dawson, the artist (3.6-8.0) -->
      <div id="B" class="scene clip" data-start="3.6" data-duration="4.4" data-track-index="2">
        <svg class="draw">
          <path class="ink b1" d="M600 300 L900 280 L910 760 L610 780 Z" />
          <path class="ink b2" d="M910 280 L1220 300 L1210 780 L910 760" />
          <path class="ink thin b3" d="M660 380 C720 360 800 370 850 390 M660 450 C730 430 800 440 850 460 M660 520 C730 500 800 510 850 530" />
          <path class="ink thin b4" d="M990 420 C1010 360 1100 350 1130 410 C1150 460 1120 540 1060 560 C1000 575 970 520 990 420 M1000 600 C1030 640 1100 640 1130 600" />
        </svg>
        <div class="big wipe" id="bt" style="top: 120px; font-size: 120px;">Jack Dawson</div>
        <div class="big" id="bs" style="top: 830px; font-size: 76px; opacity: 0;">ศิลปินไส้แห้ง ในหนัง</div>
      </div>

      <!-- C: but it was James Cameron's hand (8.0-12.2) -->
      <div id="C" class="scene clip" data-start="8.0" data-duration="4.2" data-track-index="3">
        <div class="big" id="cj" style="top: 170px; font-size: 130px;">มือของ Jack</div>
        <svg class="draw">
          <path class="red c1" d="M560 300 C800 270 1100 330 1380 280" />
          <path class="red c2" d="M590 340 C820 300 1120 360 1360 320" />
          <path class="red c3" d="M960 500 C700 495 430 560 440 650 C450 750 700 800 970 798 C1250 796 1490 740 1480 645 C1470 560 1220 505 960 500" />
        </svg>
        <div class="big wipe" id="cc" style="top: 560px; font-size: 128px;">James Cameron</div>
        <div class="big" id="cd" style="top: 860px; font-size: 76px; opacity: 0;">ผู้กำกับ</div>
      </div>

      <!-- pencil that follows the drawing -->
      <svg id="pencil" class="clip" data-start="0" data-duration="12.2" data-track-index="4" viewBox="0 0 260 60">
        <polygon points="0,30 40,14 40,46" fill="#e8c9a0" />
        <polygon points="0,30 14,25 14,35" fill="#2a2622" />
        <rect x="40" y="14" width="190" height="32" fill="#d9a524" />
        <rect x="40" y="14" width="190" height="8" fill="#e8bb3c" />
        <rect x="230" y="14" width="30" height="32" rx="6" fill="#d98a8a" />
      </svg>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      function prep(sel) {
        document.querySelectorAll(sel).forEach((p) => {
          const L = p.getTotalLength();
          p.style.strokeDasharray = L;
          p.style.strokeDashoffset = L;
        });
      }
      prep(".ink, .red");
      const draw = (sel, at, d) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at);
      const show = (id, at) => tl.set(id, { opacity: 1 }, at);
      const hide = (id, at) => tl.set(id, { opacity: 0 }, at);
      const pop = (sel, at) => tl.fromTo(sel, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, at);
      const wipe = (sel, at, d) => tl.fromTo(sel, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: d, ease: "none" }, at);
      // pencil tip goes to (x, y)
      const pen = (x, y, at, d) => tl.to("#pencil", { x: x, y: y - 30, rotation: -32, duration: d, ease: "power1.inOut" }, at);
      tl.set("#pencil", { x: 560, y: 180, rotation: -32 }, 0);

      // A
      show("#A", 0);
      draw(".a1", 0.0, 1.1); pen(1360, 860, 0.0, 1.1);
      draw(".a2", 0.9, 0.4);
      draw(".a3", 1.3, 0.8); pen(948, 560, 1.3, 0.8);
      draw(".a4", 2.1, 0.1); pen(950, 650, 2.1, 0.15);
      pop("#aq", 2.3);
      hide("#A", 3.6);

      // B
      show("#B", 3.6);
      wipe("#bt", 3.6, 0.7); pen(1540, 200, 3.6, 0.7);
      draw(".b1", 4.2, 0.6); pen(610, 780, 4.2, 0.6);
      draw(".b2", 4.7, 0.6); pen(1210, 780, 4.7, 0.6);
      draw(".b3", 5.3, 0.7); pen(850, 530, 5.3, 0.7);
      draw(".b4", 6.0, 0.9); pen(1130, 600, 6.0, 0.9);
      pop("#bs", 6.6);
      hide("#B", 8.0);

      // C
      show("#C", 8.0);
      pop("#cj", 8.0);
      draw(".c1", 8.5, 0.3); pen(1380, 280, 8.5, 0.3);
      draw(".c2", 8.8, 0.3); pen(1360, 320, 8.8, 0.3);
      wipe("#cc", 9.3, 0.8); pen(1620, 620, 9.3, 0.8);
      draw(".c3", 10.2, 0.8); pen(1480, 645, 10.2, 0.8);
      pop("#cd", 10.6);
      tl.to("#pencil", { opacity: 0, duration: 0.3 }, 11.6);
      hide("#C", 12.2);
    </script>
  </body>
</html>
