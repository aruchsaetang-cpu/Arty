<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>His Last Wish Was Cheese</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Kanit";
        src: url("assets/fonts/kanit-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "Kanit";
        src: url("assets/fonts/kanit-latin-900-normal.woff2") format("woff2");
        font-weight: 900;
      }
      :root {
        --green: #39ff14;
        --yellow: #ffe600;
        --white: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Kanit", sans-serif;
      }
      .clip {
        position: absolute;
        inset: 0;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ov {
        z-index: 3;
      }
      #fx {
        z-index: 5;
      }
      .vig {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.5) 100%);
      }

      /* Sunnah-Edit style caption */
      .cap {
        position: absolute;
        left: 30px;
        right: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        text-align: center;
      }
      .t {
        display: block;
        font-weight: 900;
        font-size: 84px;
        line-height: 1.08;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: var(--white);
        transform: skewX(-7deg);
        white-space: nowrap;
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 8px 18px rgba(0, 0, 0, 0.7);
      }
      .t.g {
        color: var(--green);
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 0 26px rgba(57, 255, 20, 0.85), 0 0 50px rgba(57, 255, 20, 0.45);
      }
      .t.y {
        color: var(--yellow);
        text-shadow:
          -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000,
          0 -4px 0 #000, 0 4px 0 #000, -4px 0 0 #000, 4px 0 0 #000,
          0 0 26px rgba(255, 230, 0, 0.8), 0 0 50px rgba(255, 230, 0, 0.4);
      }
      .t.xl {
        font-size: 120px;
      }
      .t.sm {
        font-size: 66px;
      }
      .label {
        position: absolute;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        transform: skewX(-8deg);
        white-space: nowrap;
        text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000, 0 0 20px currentColor;
      }
      .stamp {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 900;
        font-size: 104px;
        color: #fff;
        letter-spacing: 0.04em;
        text-shadow: 0 6px 24px rgba(0, 0, 0, 0.8), -3px -3px 0 #000, 3px 3px 0 #000;
      }
      svg.draw {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        overflow: visible;
      }
      .wm {
        position: absolute;
        left: 0;
        right: 0;
        top: 1530px;
        text-align: center;
        font-weight: 700;
        font-size: 40px;
        letter-spacing: 0.12em;
        color: rgba(255, 255, 255, 0.45);
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
      }
      #leak {
        position: absolute;
        left: -300px;
        top: 200px;
        width: 1700px;
        height: 1500px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(255, 120, 200, 0.85) 30%, rgba(255, 150, 40, 0.55) 55%, rgba(255, 80, 160, 0) 72%);
        filter: blur(30px);
      }
      #heart {
        position: absolute;
        left: 600px;
        top: 560px;
        width: 340px;
        height: 339px;
        opacity: 0;
        filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55));
      }
      #loop {
        position: absolute;
        inset: 0;
        background: url(assets/img/loop-first-frame.jpg) center / cover;
        opacity: 0;
        transform: scale(1.12);
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #000;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1080" data-height="1920">
      <!-- ===== real footage (Molly Burke, "Gallop passed away…") ===== -->
      <div class="shot" id="w1"><video id="v1" class="clip" src="assets/footage/s3-cheese.mp4" data-start="0" data-duration="6.5" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w2"><video id="v2" class="clip" src="assets/footage/s4-hug.mp4" data-start="6.5" data-duration="6" data-track-index="0" muted playsinline></video></div>
      <div class="shot" id="w3"><div class="shot" id="w3i"><video id="v3" class="clip" src="assets/footage/s5-tears.mp4" data-start="12.5" data-duration="7.5" data-track-index="0" muted playsinline></video></div></div>
      <!-- ghost echo for the impact -->
      <div class="shot" id="w3g" style="opacity: 0"><video id="v3g" class="clip" src="assets/footage/s5-tears.mp4" data-start="16.4" data-duration="1.4" data-media-start="3.9" data-track-index="0" muted playsinline></video></div>

      <div id="grade" class="clip" data-start="0" data-duration="20" data-track-index="1"><div class="vig"></div></div>

      <!-- ===== 0–6.5 hook: 1 day left → his last wish: cheese ===== -->
      <div id="o1" class="clip ov" data-start="0" data-duration="6.5" data-track-index="2">
        <div class="cap" style="top: 200px" id="o1-cap1">
          <span class="t" id="o1-a">*HE HAD 1 DAY LEFT…*</span>
        </div>
        <div class="cap" style="top: 200px" id="o1-cap2">
          <span class="t" id="o1-b">*HIS LAST WISH*</span>
          <span class="t g xl" id="o1-c">CHEESE</span>
        </div>
        <svg class="draw" viewBox="0 0 1080 1920">
          <circle id="o1-ring" cx="560" cy="860" r="250" fill="none" stroke="#ffe600" stroke-width="10" stroke-dasharray="1571" stroke-dashoffset="1571" />
          <path id="o1-arrow" d="M700 1640 Q680 1400 600 1140" fill="none" stroke="#39ff14" stroke-width="12" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="620" />
          <path id="o1-head" d="M576 1186 L598 1134 L640 1172" fill="none" stroke="#39ff14" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
        </svg>
        <div class="label" id="o1-lab" style="left: 560px; top: 1630px; color: var(--green)">GOOD BOY</div>
      </div>

      <!-- ===== 6.5–12.5 the last goodbye ===== -->
      <div id="o2" class="clip ov" data-start="6.5" data-duration="6" data-track-index="2">
        <div class="cap" style="top: 1415px">
          <span class="t y" id="o2-a">*THE LAST GOODBYE*</span>
        </div>
        <svg class="draw" viewBox="0 0 1080 1920">
          <circle id="o2-ring" cx="885" cy="1300" r="190" fill="none" stroke="#ffe600" stroke-width="10" stroke-dasharray="1194" stroke-dashoffset="1194" />
          <path id="o2-arrow" d="M820 380 Q930 760 885 1080" fill="none" stroke="#ffe600" stroke-width="12" stroke-linecap="round" stroke-dasharray="760" stroke-dashoffset="760" />
          <path id="o2-head" d="M857 1050 L885 1102 L917 1054" fill="none" stroke="#ffe600" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0" />
        </svg>
        <div class="label" id="o2-lab" style="left: 640px; top: 300px; color: var(--yellow)">HIS LAST DAY</div>
      </div>

      <!-- ===== 12.5–20 asleep in her arms → impact → verdict → loop ===== -->
      <div id="o3" class="clip ov" data-start="12.5" data-duration="7.5" data-track-index="2">
        <div class="cap" style="top: 1060px" id="o3-cap1">
          <span class="t" id="o3-a">*HE FELL ASLEEP*</span>
          <span class="t g" id="o3-b">IN HER ARMS</span>
        </div>
        <div class="cap" style="top: 1060px" id="o3-cap2">
          <span class="t g" id="o3-c">*SALUTE</span>
          <span class="t g" id="o3-d">TO THIS BOND!*</span>
        </div>
        <img id="heart" src="assets/img/mending-heart.png" alt="" />
      </div>

      <!-- ===== sound: only on attention moments ===== -->
      <audio id="sfx-shutter-open" src="assets/audio/shutter.m4a" data-start="0" data-duration="0.36" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-type-hook" src="assets/audio/keyboard-typing.m4a" data-start="0.05" data-duration="0.84" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-pop" src="assets/audio/pop.m4a" data-start="0.9" data-duration="0.16" data-track-index="6" data-volume="0.8"></audio>
      <audio id="sfx-shutter-impact" src="assets/audio/shutter.m4a" data-start="16.5" data-duration="0.36" data-track-index="4" data-volume="1"></audio>
      <audio id="sfx-bell" src="assets/audio/bell-ding.m4a" data-start="16.8" data-duration="1.13" data-track-index="6" data-volume="0.6"></audio>
      <audio id="sfx-type-verdict" src="assets/audio/keyboard-typing.m4a" data-start="17.1" data-duration="0.84" data-track-index="5" data-volume="0.7"></audio>

      <!-- ===== watermark + transitions ===== -->
      <div id="fx" class="clip" data-start="0" data-duration="20" data-track-index="3">
        <div class="wm">MOVIE FACTS</div>
        <div id="flash"></div>
        <div id="leak"></div>
        <div id="fade"></div>
        <div id="loop"></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      const type = (sel, t, cps = 24) => {
        const el = document.querySelector(sel);
        const txt = el.textContent;
        el.textContent = "";
        for (const c of txt) {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          el.appendChild(sp);
        }
        tl.fromTo(el.querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1 / cps, ease: "none" }, t);
      };
      const draw = (sel, t, d = 0.45) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      const show = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
      const label = (sel, t) => tl.fromTo(sel, { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(2.5)" }, t);
      const flash = (t, o = 0.75) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      const punch = (sel, t, dur) => {
        tl.fromTo(sel, { scale: 1.12 }, { scale: 1.0, duration: 0.35, ease: "power3.out" }, t);
        tl.fromTo(sel, { scale: 1.0 }, { scale: 1.06, duration: dur - 0.35, ease: "none", immediateRender: false }, t + 0.35);
      };

      // ---------- 0–6.5 hook ----------
      flash(0.0, 0.9);
      punch("#w1", 0, 6.5);
      type("#o1-a", 0.05);
      draw("#o1-ring", 0.6);
      draw("#o1-arrow", 0.8, 0.35);
      show("#o1-head", 1.1);
      label("#o1-lab", 0.9);
      tl.to(["#o1-ring", "#o1-arrow", "#o1-head", "#o1-lab"], { opacity: 0, duration: 0.3 }, 3.4);
      tl.to("#o1-cap1", { opacity: 0, duration: 0.25 }, 2.6);
      type("#o1-b", 2.95);
      type("#o1-c", 3.65);
      tl.fromTo("#o1-c", { scale: 1 }, { scale: 1.08, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, 4.0);

      // ---------- 6.5–12.5 goodbye ----------
      flash(6.5, 0.45);
      punch("#w2", 6.5, 6);
      type("#o2-a", 7.0);
      draw("#o2-ring", 8.6);
      label("#o2-lab", 8.6);
      draw("#o2-arrow", 8.8, 0.4);
      show("#o2-head", 9.15);
      tl.to(["#o2-ring", "#o2-arrow", "#o2-head", "#o2-lab"], { opacity: 0, duration: 0.3 }, 11.4);

      // ---------- 12.5–20 asleep → impact → verdict → loop ----------
      flash(12.5, 0.45);
      punch("#w3", 12.5, 7.5);
      type("#o3-a", 12.9);
      type("#o3-b", 13.7);
      tl.to("#o3-cap1", { opacity: 0, duration: 0.25 }, 16.2);
      // IMPACT: blow-out + punch-in blur, ghost echo, decaying shake, settle
      flash(16.5, 0.95);
      tl.fromTo("#w3i", { scale: 1.0, filter: "blur(0px) brightness(1)" }, { scale: 1.45, filter: "blur(18px) brightness(2.1)", duration: 0.07, ease: "power4.out" }, 16.48);
      tl.to("#w3i", { scale: 1.0, filter: "blur(0px) brightness(1)", duration: 0.6, ease: "power3.out" }, 16.55);
      tl.fromTo("#leak", { opacity: 0, x: 0, scale: 1.3 }, { opacity: 1, x: 0, scale: 1.3, duration: 0.06 }, 16.48);
      tl.to("#leak", { opacity: 0, x: 300, duration: 0.7, ease: "power2.out" }, 16.58);
      tl.fromTo("#w3g", { opacity: 0, x: 0, scale: 1.0 }, { opacity: 0.5, x: 70, scale: 1.18, duration: 0.08, ease: "none" }, 16.5);
      tl.to("#w3g", { opacity: 0, x: 18, scale: 1.04, duration: 1.0, ease: "power2.out" }, 16.6);
      tl.fromTo("#w3", { x: 0, y: 0 }, { keyframes: [{ x: -26, y: 14, duration: 0.05 }, { x: 22, y: -12, duration: 0.05 }, { x: -14, y: 8, duration: 0.06 }, { x: 9, y: -5, duration: 0.07 }, { x: -4, y: 2, duration: 0.08 }, { x: 0, y: 0, duration: 0.09 }], ease: "none", immediateRender: false }, 16.52);
      tl.fromTo("#heart", { scale: 0, rotation: -25, opacity: 0, transformOrigin: "50% 60%" }, { scale: 1, rotation: 0, opacity: 1, transformOrigin: "50% 60%", duration: 0.45, ease: "back.out(2.6)" }, 16.8);
      tl.fromTo("#heart", { scale: 1 }, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", transformOrigin: "50% 60%", immediateRender: false }, 17.3);
      type("#o3-c", 17.1);
      type("#o3-d", 17.45);
      // zoom-blur out, black, then the first frame so the Short loops
      tl.to("#w3i", { scale: 1.35, filter: "blur(16px) brightness(0.8)", duration: 0.7, ease: "power2.in" }, 18.7);
      tl.to(["#o3-cap2", "#heart"], { opacity: 0, scale: 1.3, duration: 0.5, ease: "power2.in" }, 18.8);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.in" }, 19.15);
      tl.fromTo("#loop", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 19.55);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
