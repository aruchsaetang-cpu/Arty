  <script>
    const tl = gsap.timeline({ paused: true });
    const flick = (sel, at) => {
      [[0, 1], [0.05, 0.15], [0.09, 1], [0.17, 0.35], [0.22, 1]].forEach(([dt, o]) => tl.set(sel, { opacity: o }, at + dt));

    // The Mansi name types in, then is struck through and translated.
    const nm = document.querySelector("#mtn-name-in");
    const word = nm.textContent;
    const typed = { n: 0 };
    tl.set("#mtn-name-in", { opacity: 1 }, 0.15);
    tl.fromTo(typed, { n: 0 }, { n: word.length, duration: 0.6, ease: "none", onUpdate: () => { nm.textContent = word.slice(0, Math.round(typed.n)); } }, 0.15);

    flick("#mtn-ask-in", 1.72);
    tl.fromTo("#mtn-mark-in", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.72);
    window.__timelines["mountain"] = tl;
