<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"accent","type":"color","label":"Accent (warning red)","default":"#e0352b"},
    {"id":"bone","type":"color","label":"Title ink","default":"#ddd3b4"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --accent: #e0352b;
        --bone: #ddd3b4;
        --font-display: "League Gothic", sans-serif;
        --font-body: "Oswald", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05080f;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05080f;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <!-- The slope at night: one world the torch searches for the whole film -->
      <div
        id="slope"
        data-composition-id="slope"
        data-composition-src="compositions/slope.html"
        data-start="0"
        data-duration="20"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 1"
      ></div>

      <!-- Night mood: fog, vignette, grain, projector dips at each beat -->
      <div
        id="mood"
        data-composition-id="mood"
        data-composition-src="compositions/mood.html"
        data-start="0"
        data-duration="20"
        data-track-index="6"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>

      <!-- Beat titles, one scene per voiceover line -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="5.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="run"
        data-composition-id="run"
        data-composition-src="compositions/run.html"
        data-start="5.0"
        data-duration="3.75"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="wounds"
        data-composition-id="wounds"
        data-composition-src="compositions/wounds.html"
        data-start="8.75"
        data-duration="3.45"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="tongue"
        data-composition-id="tongue"
        data-composition-src="compositions/tongue.html"
        data-start="12.2"
        data-duration="1.55"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="radiation"
        data-composition-id="radiation"
        data-composition-src="compositions/radiation.html"
        data-start="13.75"
        data-duration="2.25"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>
      <div
        id="mountain"
        data-composition-id="mountain"
        data-composition-src="compositions/mountain.html"
        data-start="16.0"
        data-duration="4.0"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 3"
      ></div>

      <!-- Burned-in captions for muted viewers -->
      <div
        id="captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="20"
        data-track-index="3"
        data-track-kind="captions"
        data-width="1080"
        data-height="1920"
        style="z-index: 4"
      ></div>

      <audio
        id="voiceover"
        class="clip"
        src="assets/audio/voiceover.m4a"
        data-start="0"
        data-duration="20"
        data-track-index="4"
        data-volume="1"
      ></audio>
      <audio
        id="bed"
        class="clip"
        src="assets/audio/bed.m4a"
        data-start="0"
        data-duration="20"
        data-track-index="5"
        data-volume="1"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
