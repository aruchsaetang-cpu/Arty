<!doctype html>
<html lang="en">

<style>
@font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070914; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Space Grotesk", sans-serif; font-weight: 700; color: #f4f1ea; }
#stage { position: absolute; inset: 0; }
#cam { position: absolute; left: 0; top: 0; width: 2160px; height: 3840px; }
#world { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; display: block; }
#wall { left: 0; top: 0; width: 2160px; height: 2500px; background: linear-gradient(#141a3a 0%, #1c2450 55%, #151b3e 100%); }
#wains { left: 0; top: 2040px; width: 2160px; height: 460px; background: linear-gradient(#131836, #0e122b); border-top: 14px solid #2c3566; }
#floor { left: 0; top: 2500px; width: 2160px; height: 1340px; background: linear-gradient(#211a27 0%, #17121d 40%, #0b0910 100%); }
#floorl { left: 0; top: 2500px; width: 2160px; height: 1340px; opacity: .16; background-image: repeating-linear-gradient(90deg, transparent 0 176px, #000 176px 182px); }
#base { left: 0; top: 2486px; width: 2160px; height: 28px; background: #141936; }
.win { top: 470px; width: 430px; height: 640px; border: 22px solid #cfd6f2; border-radius: 14px; overflow: hidden; background: #0b1638; box-shadow: 0 0 0 10px #1a2148, 0 30px 60px rgba(0,0,0,.4); }
.sky { inset: 0; background: #0b1638; }
.wheel { left: -120px; top: 60px; width: 626px; height: 1000px; }
.moon { left: 268px; top: 0; width: 90px; height: 90px; border-radius: 50%; background: #f3f0d8; box-shadow: 0 0 50px #f3f0d8aa; }
.sun { left: 253px; top: 880px; width: 120px; height: 120px; border-radius: 50%; background: #ffe27a; box-shadow: 0 0 90px #ffd84a; }
.mull { background: #cfd6f2; }
.beam { top: 1132px; width: 430px; height: 1500px; background: linear-gradient(rgba(255,236,170,.34), rgba(255,236,170,0)); transform-origin: 50% 0; }
#board { left: 690px; top: 500px; width: 780px; height: 470px; border-radius: 16px; background: linear-gradient(#17402a, #123322); border: 24px solid #7a5a36; box-shadow: 0 26px 50px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; }
#board .b1 { display: block; font-family: "Anton"; font-size: 96px; letter-spacing: 6px; color: #e4f1e7; line-height: 1.1; }
#board .b2 { display: block; font-family: "Anton"; font-size: 190px; letter-spacing: 6px; color: #ffd84a; line-height: 1.05; white-space: nowrap; }
#tray { left: 720px; top: 978px; width: 720px; height: 22px; background: #5d4428; border-radius: 6px; }
#clock { left: 1010px; top: 250px; width: 180px; height: 180px; border-radius: 50%; background: #f4f1ea; border: 14px solid #141936; box-shadow: 0 14px 30px rgba(0,0,0,.4); }
#clock i { position: absolute; display: block; left: 71px; width: 10px; background: #141936; border-radius: 5px; transform-origin: 50% 100%; }
#clock .hh { top: 36px; height: 40px; } #clock .mh { top: 16px; height: 60px; }
.poster { border-radius: 10px; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.pool { border-radius: 50%; background: radial-gradient(ellipse, rgba(255,240,200,.16), rgba(255,240,200,0) 68%); }
svg.fig { position: absolute; overflow: visible; filter: drop-shadow(0 18px 20px rgba(0,0,0,.45)); }
svg.fig .ln { fill: none; stroke: #f4f1ea; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
svg.fig text { font-family: "Anton"; }
#night { inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(4,6,22,.5), rgba(2,3,12,.9)); }
#aglow { left: 780px; top: 1900px; width: 1600px; height: 1600px; border-radius: 50%; background: radial-gradient(circle, rgba(84,224,138,.5) 0%, rgba(84,224,138,.14) 40%, rgba(84,224,138,0) 68%); }
#focus { inset: 0; background: rgba(5,7,20,.93); }
#dim { inset: 0; background: radial-gradient(circle at 1580px 2540px, rgba(4,6,18,0) 0, rgba(4,6,18,0) 430px, rgba(4,6,18,.86) 900px); }
#ui { position: absolute; inset: 0; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,0,0,.62) 100%); }
#bars i { position: absolute; display: block; left: 0; width: 1080px; height: 96px; background: #05060d; }
#flash { position: absolute; inset: 0; background: #fff; }
.A { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 3px; }
.blk { display: block; position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
.nm { top: 150px; font-size: 200px; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
.qt { top: 1560px; font-size: 62px; text-shadow: 0 4px 0 #05060d, 0 8px 30px rgba(0,0,0,.8); }
#e0 { top: 1640px; font-size: 96px; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
#e1 { top: 150px; font-size: 118px; }
#e2 { top: 1585px; font-size: 118px; color: #54e08a; text-shadow: 0 8px 40px rgba(84,224,138,.5); }
#e3 { top: 1742px; font-size: 52px; }
</style>

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20.8" data-width="1080" data-height="1920" data-fps="30">
 <div id="stage" class="clip" data-start="0" data-duration="20.8" data-track-index="1">
  <div id="cam"><div id="world">
    <div id="wall" class="abs"></div>
    <div class="abs poster" style="left:1500px;top:1240px;width:150px;height:200px;background:#39d0ff33;border:8px solid #cfd6f2"></div>
    <div class="abs poster" style="left:520px;top:1240px;width:150px;height:200px;background:#ff4d5e33;border:8px solid #cfd6f2"></div>
    <div class="abs win" style="left:130px"><div class="abs sky"></div><div class="abs wheel"><span class="abs moon"></span><span class="abs sun"></span></div><span class="abs mull" style="left:186px;top:0;width:14px;height:600px"></span><span class="abs mull" style="left:0;top:290px;width:400px;height:14px"></span></div>
    <div class="abs win" style="left:1600px"><div class="abs sky"></div><div class="abs wheel"><span class="abs moon"></span><span class="abs sun"></span></div><span class="abs mull" style="left:186px;top:0;width:14px;height:600px"></span><span class="abs mull" style="left:0;top:290px;width:400px;height:14px"></span></div>
    <div id="clock" class="abs"><i class="hh"></i><i class="mh"></i></div>
    <div id="board" class="abs"><span class="b1" id="b1">TEST 1</span><span class="b2" id="b2">RESULTS</span></div>
    <div id="tray" class="abs"></div>
    <div id="wains" class="abs"></div><div id="base" class="abs"></div>
    <div id="floor" class="abs"></div><div id="floorl" class="abs"></div>
    <div class="abs beam" style="left:130px"></div><div class="abs beam" style="left:1600px"></div>
    <div class="abs pool" style="left:330px;top:2090px;width:740px;height:240px"></div>
    <div class="abs pool" style="left:1090px;top:2090px;width:740px;height:240px"></div>
    <div class="abs pool" style="left:120px;top:3050px;width:920px;height:300px"></div>
    <div class="abs pool" style="left:1120px;top:3050px;width:920px;height:300px"></div>
    <div id="night" class="abs"></div>
    <div id="backrow"></div>
    <div id="focus" class="abs"></div>
    <div id="aglow" class="abs"></div>
    <div id="frontrow"></div>
    <div id="dim" class="abs"></div>
  </div></div>
  <div id="ui">
    <div id="vig"></div>
    <div id="caps"></div>
    <span id="e0" class="A blk">first test.</span>
    <span id="e1" class="A blk">talent starts.</span>
    <span id="e2" class="A blk">discipline finishes.</span>
    <span id="e3" class="blk">1 hour. Every day. That's it.</span>
    <div id="bars"><i style="top:0"></i><i style="top:1824px"></i></div>
    <div id="flash"></div>
  </div>
 </div>
</div>
<script>
const C = { TALENT: "#39d0ff", EGO: "#ffd84a", OBSESSION: "#ff4d5e", DISCIPLINE: "#54e08a" };
const P = { TALENT: [700, 1950, 440], EGO: [1460, 1950, 440], OBSESSION: [580, 2860, 600], DISCIPLINE: [1580, 2860, 600] }; // cx, deskY, width
const G = { TALENT: "A+", EGO: "B+", OBSESSION: "A", DISCIPLINE: "A+" };
const G0 = { TALENT: "A+", EGO: "B+", OBSESSION: "D+", DISCIPLINE: "F" };
const paper = (cls, g, good, r) => `<g class="${cls}"><g transform="translate(0 -46)"><rect x="85" y="-290" width="230" height="290" rx="12" fill="#f7f4ec" transform="rotate(${r} 200 -145)"/><text x="200" y="-70" font-size="${g.length > 3 ? 112 : g.length > 1 ? 180 : 210}" text-anchor="middle" fill="${good ? "#17a355" : "#e0283c"}" transform="rotate(${r} 200 -145)">${g}</text></g></g>`;
function fig(k) {
  const c = C[k], [cx, dy, w] = P[k], sc = w / 400;
  const acc = {
    TALENT: `<path class="ln" d="M150 62 A52 52 0 0 1 250 62" style="stroke:${c};stroke-width:14"/><rect x="134" y="52" width="26" height="50" rx="10" fill="${c}"/><rect x="240" y="52" width="26" height="50" rx="10" fill="${c}"/><path d="M180 78 L196 78 M206 78 L222 78" stroke="#0b0e1d" stroke-width="6" stroke-linecap="round"/>`,
    EGO: `<path d="M158 34 L158 -14 L181 12 L200 -22 L219 12 L242 -14 L242 34 Z" fill="${c}"/><path d="M182 84 Q204 96 224 74" stroke="#0b0e1d" stroke-width="7" fill="none" stroke-linecap="round"/>`,
    OBSESSION: `<circle cx="184" cy="72" r="8" fill="${c}"/><circle cx="216" cy="72" r="8" fill="${c}"/><path d="M172 56 L194 62 M228 56 L206 62" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`,
    DISCIPLINE: `<path d="M184 88 L216 88 M172 58 L193 66 M228 58 L207 66" stroke="#0b0e1d" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="150" y="30" width="100" height="16" rx="8" fill="${c}"/>`,
  }[k];
  const prop = {
    TALENT: `<text class="nt nt1" x="300" y="40" font-size="70" fill="${c}">♪</text><text class="nt nt2" x="60" y="20" font-size="56" fill="${c}">♫</text><text class="nt nt3" x="330" y="-40" font-size="48" fill="${c}">♪</text>`,
    EGO: `<g class="trophy" transform="translate(-246 0)"><rect x="296" y="282" width="44" height="12" rx="3" fill="${c}"/><rect x="312" y="262" width="12" height="22" fill="${c}"/><path d="M294 214 H342 V236 A24 24 0 0 1 294 236 Z" fill="${c}"/></g><text class="sp sp1" x="40" y="40" font-size="64" fill="${c}">✦</text><text class="sp sp2" x="345" y="110" font-size="80" fill="${c}">✦</text>`,
    OBSESSION: [0,1,2,3,4,5].map(i => `<rect class="bk bk${i}" x="${286 + (i % 2) * 6}" y="${270 - i * 26}" width="74" height="22" rx="4" fill="${["#ff4d5e","#c93a4a","#ff7d6b","#a52a3a","#ff4d5e","#ff9a8a"][i]}"/>`).join("") + `<text class="zz" x="250" y="150" font-size="60" fill="#f4f1ea">z z z</text><g class="burn"><rect x="60" y="-150" width="280" height="84" rx="14" fill="${c}"/><text x="200" y="-88" font-size="62" text-anchor="middle" fill="#0b0e1d" letter-spacing="3">BURNOUT</text></g>`,
    DISCIPLINE: [0,1,2,3,4,5,6].map(i => i < 3
      ? `<g class="ck ck${i}"><rect x="${67 + i * 39}" y="-112" width="32" height="32" rx="7" fill="#ff4d5e"/><path d="M${75 + i * 39} -104 l16 16 m0 -16 l-16 16" stroke="#f7f4ec" stroke-width="5" fill="none" stroke-linecap="round"/></g>`
      : `<g class="ck ck${i}"><rect x="${67 + i * 39}" y="-112" width="32" height="32" rx="7" fill="${c}"/><path d="M${74 + i * 39} -96 l7 8 l12 -15" stroke="#0b0e1d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`).join("")
      + `<circle class="sw sw0" cx="262" cy="70" r="8" fill="#9fdcff"/><circle class="sw sw1" cx="138" cy="92" r="7" fill="#9fdcff"/><circle class="sw sw2" cx="250" cy="110" r="6" fill="#9fdcff"/>`
      + [0,1,2].map(i => `<circle class="pb pb${i}" cx="252" cy="276" r="14" fill="#f7f4ec" stroke="#b9b6ad" stroke-width="3"/>`).join("") + `<g class="lamp"><path d="M70 294 L70 240 L100 220" class="ln" style="stroke:#8892c8;stroke-width:8"/><path d="M92 206 L126 222 L110 246 Z" fill="#ffe27a"/><ellipse cx="150" cy="292" rx="70" ry="10" fill="#ffe27a" opacity=".35"/></g>`,
  }[k];
  return `<svg class="fig f-${k}" viewBox="0 0 400 520" style="left:${cx - w / 2}px;top:${dy - 296 * sc}px;width:${w}px;height:${w * 1.3}px">
${k === "DISCIPLINE" ? `<g class="aura"><g style="filter:blur(9px)"><g class="au1"><path d="M200 300 C 50 300, 30 110, 128 30 C 118 110, 168 80, 200 -110 C 232 80, 282 110, 272 30 C 370 110, 350 300, 200 300 Z" fill="#54e08a" opacity=".42"/></g><g class="au2"><path d="M200 300 C 50 300, 30 110, 128 30 C 118 110, 168 80, 200 -110 C 232 80, 282 110, 272 30 C 370 110, 350 300, 200 300 Z" fill="#b8ffd2" opacity=".5" transform="translate(200 300) scale(.66 .7) translate(-200 -300)"/></g></g>${[0,1,2,3,4,5,6,7].map(i => `<circle class="pt pt${i}" cx="${70 + i * 37}" cy="${280 - (i % 3) * 30}" r="${5 + (i % 3) * 2}" fill="#d6ffe4"/>`).join("")}<path class="bolt" d="M92 150 l26 -44 l-8 34 l30 -8 l-40 60 l10 -40 z" fill="#eafff1"/><path class="bolt" d="M318 90 l-22 -40 l4 30 l-28 -6 l38 56 l-8 -36 z" fill="#eafff1"/></g>` : ""}
    ${k === "EGO" ? `<rect x="104" y="96" width="192" height="270" rx="26" fill="#3a2a6e" stroke="${c}" stroke-width="8"/><circle cx="112" cy="100" r="16" fill="${c}"/><circle cx="288" cy="100" r="16" fill="${c}"/>` : `<rect x="120" y="210" width="160" height="150" rx="14" fill="#1b2147"/>`}
    <g class="bd">
      <line class="ln ext" x1="200" y1="200" x2="200" y2="330"/>
      <line class="ln" x1="200" y1="120" x2="200" y2="290"/>
      ${k === "EGO" ? `<g class="aL"><polyline class="ln" points="200,160 128,128 158,62"/></g><g class="aR"><polyline class="ln" points="200,160 272,128 242,62"/></g>` : `<g class="aL"><polyline class="ln" points="200,160 138,232 176,292"/></g><g class="aR"><polyline class="ln" points="200,160 262,232 224,292"/></g>`}
      <polyline class="ln upL" points="200,165 124,104 96,18"/><polyline class="ln upR" points="200,165 276,104 304,18"/>
      <g class="hdg"><circle cx="200" cy="72" r="50" fill="#f4f1ea"/>${acc}</g>
    </g>
    <rect x="30" y="296" width="340" height="30" rx="10" fill="#566099"/>
    <rect x="46" y="326" width="308" height="104" rx="6" fill="#2b3364"/>
    <rect x="60" y="430" width="22" height="86" fill="#222950"/><rect x="318" y="430" width="22" height="86" fill="#222950"/>
    <text x="200" y="398" font-size="${k.length > 8 ? 46 : 54}" text-anchor="middle" fill="${c}" letter-spacing="3">${k}</text>
    <rect x="156" y="278" width="88" height="16" rx="3" fill="#f7f4ec" stroke="${c}" stroke-width="4"/>
    ${k === "EGO" ? `<g class="feet"><polyline class="ln" points="214,286 300,262 352,270 362,238"/><polyline class="ln" points="214,286 292,284 338,254 356,226"/></g>` : ""}
    ${prop}
    <g class="meter"><rect x="90" y="-52" width="220" height="26" rx="13" fill="#0b0e1d" stroke="#f4f1ea" stroke-width="5"/><rect class="mf" x="96" y="-46" width="0" height="14" rx="7" fill="${c}"/></g>
    ${paper("paper", G[k], true, k === "DISCIPLINE" || k === "EGO" ? -4 : 4)}${paper("paper0", G0[k], k === "TALENT" || k === "EGO", k === "TALENT" || k === "OBSESSION" ? -4 : 4)}
  </svg>`;
}
const order = ["TALENT", "EGO", "OBSESSION", "DISCIPLINE"];
document.getElementById("backrow").innerHTML = fig("TALENT") + fig("EGO");
document.getElementById("frontrow").innerHTML = fig("OBSESSION") + fig("DISCIPLINE");
const Q = { TALENT: "“I don't need to study.”", EGO: "“I'm already the best.”", OBSESSION: "20 hours a day. No sleep.", DISCIPLINE: "1 hour. Every single day." };
document.getElementById("caps").innerHTML = [].map((k) => `<span class="A blk nm nm-${k}" style="color:${C[k]};font-size:${k.length > 8 ? 168 : 210}px">${k}</span><span class="blk qt qt-${k}">${Q[k]}</span>`).join("");

document.fonts.ready.then(() => {
  const M = gsap.timeline({ paused: true });
  const END = 20.8, TL = 4.0, D = 7.2, H = D / 15, EX = 11.2, BO = TL + 3.6, ST = EX + 5.2, UP = TL + 2.2;
  const camTo = (cx, cy, s) => ({ x: 540 - cx * s, y: 960 - cy * s, scale: s });
  const WIDE = camTo(1080, 1850, 0.56);
  const mid = (k) => { const [cx, dy, w] = P[k]; const s = w > 500 ? 0.92 : 1.2; return camTo(cx, dy - 330 * (w / 400), s); };
  const cam = (t, c, d = 0.36, ease = "power4.inOut") => M.to("#cam", { ...c, duration: d, ease }, t);
  const flash = (t, a = 0.4) => M.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
  gsap.set("#cam", { transformOrigin: "0 0", ...camTo(1080, 1850, 0.5) });
  gsap.set("#aglow, .aura, .bolt, #e0, .paper0, #focus, #flash, #e1, #e2, #e3, #dim, .meter, .paper, .zz, .burn, .ext, .upL, .upR, .bk, .ck, .sw, .pb, .beam", { opacity: 0 });
  gsap.set("#clock .hh", { rotation: 100 }); gsap.set("#clock .mh", { rotation: 40 });
  gsap.set(".sky", { backgroundColor: "#0b1638" });
  gsap.set(".aura", { scale: 0.05, svgOrigin: "200 300" });
  gsap.set(".f-TALENT .mf", { attr: { width: 200 } }); gsap.set(".f-EGO .mf", { attr: { width: 150 } });
  gsap.set(".f-OBSESSION .mf", { attr: { width: 40 } }); gsap.set(".f-DISCIPLINE .mf", { attr: { width: 8 } });
  gsap.set(".f-TALENT .aL", { rotation: 62, svgOrigin: "200 160" }); gsap.set(".f-TALENT .aR", { rotation: -62, svgOrigin: "200 160" });

  // board text: one source of truth, driven by film time
  const b2 = document.getElementById("b2"), b1 = document.getElementById("b1");
  const clk = { v: 0 }; let last = "";
  M.fromTo(clk, { v: 0 }, { v: 1, duration: END, ease: "none", onUpdate: () => {
    const t = M.time(); let a, b;
    if (t < 2.9) { a = "TEST 1"; b = "RESULTS"; }
    else if (t < TL) { a = "FINALS IN"; b = "30 DAYS"; }
    else if (t < TL + D) { const n = Math.max(1, Math.round(30 * (1 - (t - TL) / D))); a = "FINALS IN"; b = n + (n === 1 ? " DAY" : " DAYS"); }
    else { a = "TODAY:"; b = "FINALS"; }
    if (a + b !== last) { b1.textContent = a; b2.textContent = b; last = a + b; }
  } }, 0);

  // ---- continuous life: everyone is always in the room
  M.fromTo(".f-TALENT .hdg", { rotation: -7, svgOrigin: "200 120" }, { rotation: 7, svgOrigin: "200 120", duration: 0.2, yoyo: true, repeat: 103, ease: "sine.inOut" }, 0);
  ["nt1", "nt2", "nt3"].forEach((n, i) => M.fromTo(`.${n}`, { y: 50, opacity: 0.9 }, { y: -70, opacity: 0, duration: 1.2, ease: "power1.out", repeat: 15 }, 0.2 + i * 0.3));
  M.fromTo(".f-EGO .bd", { rotation: -15, svgOrigin: "200 290" }, { rotation: -10, svgOrigin: "200 290", duration: 0.8, yoyo: true, repeat: 25, ease: "sine.inOut" }, 0);
  M.fromTo(".sp", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 360, transformOrigin: "50% 50%", duration: END, ease: "none" }, 0);
  M.fromTo(".f-OBSESSION .bd", { x: -4 }, { x: 4, duration: 0.05, yoyo: true, repeat: 151, ease: "none" }, 0);
  M.fromTo(".f-OBSESSION .bd", { x: -4 }, { x: 4, duration: 0.05, yoyo: true, repeat: 221, ease: "none", immediateRender: false }, BO + 1.9);
  M.fromTo(".f-DISCIPLINE .aR", { rotation: -4, svgOrigin: "200 160" }, { rotation: 6, svgOrigin: "200 160", duration: 0.4, yoyo: true, repeat: 39, ease: "sine.inOut" }, 0);

  // ---- 1. first test comes back (0 - 3.6)
  M.to("#cam", { ...WIDE, duration: 3.5, ease: "power1.out" }, 0);
  M.fromTo("#bars i", { scaleY: 2.2 }, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 0);
  M.fromTo("#e0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25 }, 0.05);
  M.to("#e0", { opacity: 0, duration: 0.2 }, 2.6);
  order.forEach((k, i) => {
    M.fromTo(`.f-${k} .paper0`, { scale: 0, opacity: 0, rotation: -30, svgOrigin: "200 280" }, { scale: 1, opacity: 1, rotation: 0, svgOrigin: "200 280", duration: 0.22, ease: "back.out(2)" }, 0.3 + i * 0.4);
    M.to(`.f-${k} .paper0`, { y: 120, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.6 + i * 0.05);
  });
  M.to(".f-OBSESSION .hdg", { y: 22, duration: 0.3, yoyo: true, repeat: 1, repeatDelay: 0.7, ease: "power2.out" }, 1.3);
  // Discipline takes the F hard: head drops and stays down
  M.to(".f-DISCIPLINE .hdg", { y: 40, rotation: 16, svgOrigin: "200 120", duration: 0.35, ease: "power2.in" }, 1.6);
  flash(2.9, 0.5);
  M.fromTo("#board", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 2.9);

  // ---- 2. thirty days in the same room (4.0 - 11.2)
  cam(TL - 0.45, camTo(1580, 2520, 0.98), 0.5);
  M.to("#cam", { scale: "+=0.04", x: "-=63", y: "-=101", duration: 2.6, ease: "none" }, TL + 0.05);
  cam(TL + 2.7, camTo(1080, 1850, 0.58), 0.6, "power3.inOut");
  M.to("#cam", { ...camTo(1080, 1850, 0.62), duration: EX - TL - 3.3, ease: "none" }, TL + 3.3);
  M.to(".meter", { opacity: 1, duration: 0.25 }, TL - 0.2);
  M.fromTo("#night", { opacity: 1 }, { opacity: 0.45, duration: H, yoyo: true, repeat: 14, ease: "sine.inOut" }, TL);
  M.fromTo(".sky", { backgroundColor: "#0b1638" }, { backgroundColor: "#3f78ad", duration: H, yoyo: true, repeat: 14, ease: "sine.inOut" }, TL);
  M.fromTo(".beam", { opacity: 0 }, { opacity: 0.5, duration: H, yoyo: true, repeat: 14, ease: "sine.inOut" }, TL);
  M.fromTo(".wheel", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 180 * 15, transformOrigin: "50% 50%", duration: D, ease: "none" }, TL);
  M.to("#clock .mh", { rotation: 40 + 360 * 14, duration: D, ease: "none" }, TL);
  M.to("#clock .hh", { rotation: 100 + 360 * 2, duration: D, ease: "none" }, TL);
  // Obsession: sprints, crashes, claws back
  [0, 1, 2, 3, 4, 5].forEach((i) => M.fromTo(`.bk${i}`, { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power2.in" }, TL + 0.2 + i * 0.22));
  M.to(".f-OBSESSION .mf", { attr: { width: 170 }, duration: 2.8, ease: "power2.out" }, TL);
  M.to(".f-OBSESSION .mf", { attr: { width: 70 }, fill: "#7a3d48", duration: 0.5, ease: "bounce.out" }, BO);
  M.to(".f-OBSESSION .hdg", { y: 150, rotation: 24, svgOrigin: "200 120", duration: 0.35, ease: "power3.in" }, BO);
  M.fromTo(".burn", { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.5)" }, BO + 0.1);
  M.to(".burn", { opacity: 0, duration: 0.25 }, BO + 1.5);
  M.fromTo(".zz", { opacity: 0, y: 20 }, { opacity: 0.9, y: -20, duration: 0.6, yoyo: true, repeat: 1, ease: "sine.inOut" }, BO + 0.5);
  flash(BO, 0.25);
  M.to(".f-OBSESSION .hdg", { y: 0, rotation: 0, svgOrigin: "200 120", duration: 0.3, ease: "back.out(2)" }, BO + 1.7);
  M.to(".f-OBSESSION .mf", { attr: { width: 184 }, fill: "#ff4d5e", duration: 1.4, ease: "power1.inOut" }, BO + 1.8);
  // Discipline: fails, fails, fails... keeps showing up
  const mt = [0.35, 0.9, 1.45, 2.2, 3.3, 4.5, 5.7];
  mt.forEach((m, i) => {
    M.fromTo(`.ck${i}`, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(3)" }, TL + m);
    if (i < 3) {
      M.fromTo(`.pb${i}`, { x: 0, y: 0, opacity: 1 }, { x: [70, 150, 108][i], opacity: 1, duration: 0.45, ease: "none" }, TL + m);
      M.fromTo(`.pb${i}`, { y: 0 }, { y: [228, 242, 220][i], duration: 0.45, ease: "bounce.out" }, TL + m);
      M.to(".f-DISCIPLINE .hdg", { y: 58, duration: 0.09, yoyo: true, repeat: 1, ease: "power2.in" }, TL + m);
    }
  });
  ["sw0", "sw1", "sw2"].forEach((n, i) => M.fromTo(`.${n}`, { y: 0, opacity: 1 }, { y: 90, opacity: 0, duration: 0.5, repeat: 5, ease: "power1.in" }, 1.9 + i * 0.17));
  M.to(".f-DISCIPLINE .mf", { attr: { width: 30 }, duration: 2.2, ease: "none" }, TL);
  M.to(".f-DISCIPLINE .mf", { attr: { width: 208 }, duration: D - 2.2, ease: "power1.in" }, UP);
  M.to(".f-DISCIPLINE .hdg", { y: 0, rotation: 0, svgOrigin: "200 120", duration: 1.0, ease: "power2.out" }, UP);
  // aura: lights on the first day it finally works, then grows every day
  M.to(".aura", { scale: 0.3, opacity: 0.85, duration: 0.5, ease: "power2.out" }, UP);
  M.fromTo(".au1", { scaleY: 0.9, scaleX: 1.05, svgOrigin: "200 300" }, { scaleY: 1.1, scaleX: 0.95, svgOrigin: "200 300", duration: 0.12, yoyo: true, repeat: 121, ease: "sine.inOut" }, UP);
  M.fromTo(".au2", { scaleY: 1.08, scaleX: 0.94, svgOrigin: "200 300" }, { scaleY: 0.9, scaleX: 1.06, svgOrigin: "200 300", duration: 0.09, yoyo: true, repeat: 161, ease: "sine.inOut" }, UP);
  [0, 1, 2, 3, 4, 5, 6, 7].forEach((i) => M.fromTo(`.pt${i}`, { y: 0, opacity: 0.95 }, { y: -430, opacity: 0, duration: 0.7 + (i % 3) * 0.2, repeat: 14, ease: "power1.out" }, UP + 0.2 + i * 0.11));
  M.to(".aura", { scale: 1.0, opacity: 1, duration: D - 2.8, ease: "power1.in" }, UP + 0.6);
  M.to("#aglow", { opacity: 0.75, duration: D - 2.8, ease: "power1.in" }, UP + 0.6);

  // ---- 3. finals: papers come back (11.2 - 16.4)
  flash(EX, 0.55);
  M.to("#night", { opacity: 0.5, duration: 0.2 }, EX);
  M.to(".meter, .ck, .zz", { opacity: 0, duration: 0.25 }, EX + 0.3);
  ["EGO", "TALENT", "OBSESSION", "DISCIPLINE"].forEach((k, i) => {
    const t = EX + 0.8 + i * 0.8;
    cam(t - 0.3, mid(k), 0.3);
    M.fromTo(`.f-${k} .paper`, { scale: 0, opacity: 0, rotation: -30, svgOrigin: "200 280" }, { scale: 1, opacity: 1, rotation: 0, svgOrigin: "200 280", duration: 0.22, ease: "back.out(2)" }, t);
    if (k === "DISCIPLINE") { flash(t + 0.1, 0.7); M.to(".aura", { scale: 1.35, duration: 0.3, ease: "back.out(3)" }, t + 0.1); }
  });
  cam(EX + 3.9, camTo(1080, 1850, 0.6), 0.45);
  M.to("#dim", { opacity: 1, duration: 0.5 }, EX + 4.2);

  // ---- 4. he stands (16.4 - end)
  cam(ST, camTo(1580, 2600, 1.15), 0.5);
  M.to("#backrow", { opacity: 0, duration: 0.4 }, ST);
  M.to(".pb", { opacity: 0, duration: 0.3 }, ST);
  M.to(".f-DISCIPLINE .paper", { y: -120, opacity: 0, duration: 0.3 }, ST + 0.2);
  M.to(".f-DISCIPLINE .aL, .f-DISCIPLINE .aR", { opacity: 0, duration: 0.1 }, ST + 0.4);
  M.to(".f-DISCIPLINE .upL, .f-DISCIPLINE .upR, .f-DISCIPLINE .ext", { opacity: 1, duration: 0.1 }, ST + 0.4);
  M.to(".f-DISCIPLINE .bd", { y: -110, duration: 0.3, ease: "back.out(2.5)" }, ST + 0.4);
  flash(ST + 0.5, 0.5);
  M.to(".aura", { scale: 1.75, duration: 0.35, ease: "back.out(2.5)" }, ST + 0.4);
  M.to("#aglow", { opacity: 1, scale: 1.25, duration: 0.35 }, ST + 0.4);
  M.fromTo(".bolt", { opacity: 0 }, { opacity: 1, duration: 0.05, yoyo: true, repeat: 41, repeatDelay: 0.04, ease: "steps(1)" }, ST + 0.4);
  M.fromTo("#world", { x: -10 }, { x: 10, duration: 0.04, yoyo: true, repeat: 11, ease: "none", immediateRender: false }, ST + 0.4);
  M.set("#world", { x: 0 }, ST + 0.9);
  M.fromTo("#e1", { opacity: 0, y: -30 }, { opacity: 0.85, y: 0, duration: 0.3 }, ST + 0.7);
  M.fromTo("#e2", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, ST + 1.4);
  flash(ST + 1.62, 0.45);
  M.fromTo("#e3", { opacity: 0, y: 20 }, { opacity: 0.85, y: 0, duration: 0.3 }, ST + 2.2);
  M.to("#cam", { scale: "+=0.05", x: "-=79", y: "-=130", duration: END - ST - 0.6, ease: "none" }, ST + 0.6);
  M.set({}, {}, END);
  window.__timelines["main"] = M;
});
</script>
</body>
</html>
