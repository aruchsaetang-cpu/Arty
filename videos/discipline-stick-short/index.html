<!doctype html>
<html lang="en">
<head>

<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face { font-family: "Anton"; src: url("assets/fonts/anton-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Space Grotesk"; font-weight: 700; src: url("assets/fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #070914; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Space Grotesk", sans-serif; font-weight: 700; color: #f4f1ea; }
#stage { position: absolute; inset: 0; }
#cam { position: absolute; left: 0; top: 0; width: 2160px; height: 3840px; }
#world { position: absolute; inset: 0; overflow: hidden; }
.abs { position: absolute; display: block; }
#wall { left: 0; top: 0; width: 2160px; height: 2500px; background: linear-gradient(#2a3468 0%, #343f7c 55%, #2b3569 100%); }
#wains { left: 0; top: 2040px; width: 2160px; height: 460px; background: linear-gradient(#232b57, #1c234a); border-top: 14px solid #46528f; }
#floor { left: 0; top: 2500px; width: 2160px; height: 1340px; background: linear-gradient(#3b2f3f 0%, #2a2233 40%, #17131f 100%); }
#floorl { left: 0; top: 2500px; width: 2160px; height: 1340px; opacity: .16; background-image: repeating-linear-gradient(90deg, transparent 0 176px, #000 176px 182px); }
#base { left: 0; top: 2486px; width: 2160px; height: 28px; background: #141936; }
.win { top: 470px; width: 430px; height: 640px; border: 22px solid #cfd6f2; border-radius: 14px; overflow: hidden; background: #0b1638; box-shadow: 0 0 0 10px #1a2148, 0 30px 60px rgba(0,0,0,.4); }
.sky { inset: 0; background: #0b1638; }
.wheel { left: -120px; top: 60px; width: 626px; height: 1000px; }
.moon { left: 268px; top: 0; width: 90px; height: 90px; border-radius: 50%; background: #f3f0d8; box-shadow: 0 0 50px #f3f0d8aa; }
.sun { left: 253px; top: 880px; width: 120px; height: 120px; border-radius: 50%; background: #ffe27a; box-shadow: 0 0 90px #ffd84a; }
.mull { background: #cfd6f2; }
.beam { top: 1132px; width: 430px; height: 1500px; background: linear-gradient(rgba(255,236,170,.34), rgba(255,236,170,0)); transform-origin: 50% 0; }
#board { left: 690px; top: 500px; width: 780px; height: 470px; border-radius: 16px; background: linear-gradient(#17402a, #123322); border: 24px solid #7a5a36; box-shadow: 0 26px 50px rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; }
#board .b1 { display: block; font-family: "Anton"; font-size: 96px; letter-spacing: 6px; color: #e4f1e7; line-height: 1.1; }
#board .b2 { display: block; font-family: "Anton"; font-size: 190px; letter-spacing: 6px; color: #ffd84a; line-height: 1.05; white-space: nowrap; }
#tray { left: 720px; top: 978px; width: 720px; height: 22px; background: #5d4428; border-radius: 6px; }
#clock { left: 1010px; top: 250px; width: 180px; height: 180px; border-radius: 50%; background: #f4f1ea; border: 14px solid #141936; box-shadow: 0 14px 30px rgba(0,0,0,.4); }
#clock i { position: absolute; display: block; left: 71px; width: 10px; background: #141936; border-radius: 5px; transform-origin: 50% 100%; }
#clock .hh { top: 36px; height: 40px; } #clock .mh { top: 16px; height: 60px; }
.poster { border-radius: 10px; box-shadow: 0 14px 30px rgba(0,0,0,.35); }
.pool { border-radius: 50%; background: radial-gradient(ellipse, rgba(255,240,200,.16), rgba(255,240,200,0) 68%); }
svg.fig { position: absolute; overflow: visible; filter: drop-shadow(0 18px 20px rgba(0,0,0,.45)); }
svg.fig .ln { fill: none; stroke: #f4f1ea; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
svg.fig text { font-family: "Anton"; }
#night { inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(6,9,30,.38), rgba(3,4,16,.8)); }
#focus { inset: 0; background: rgba(5,7,20,.93); }
#dim { inset: 0; background: radial-gradient(circle at 1580px 2540px, rgba(4,6,18,0) 0, rgba(4,6,18,0) 430px, rgba(4,6,18,.86) 900px); }
#ui { position: absolute; inset: 0; }
#vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0,0,0,.62) 100%); }
#bars i { position: absolute; display: block; left: 0; width: 1080px; height: 96px; background: #05060d; }
#flash { position: absolute; inset: 0; background: #fff; }
.A { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 3px; }
.blk { display: block; position: absolute; left: 0; width: 1080px; text-align: center; white-space: nowrap; }
.nm { top: 150px; font-size: 200px; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,.6); }
.qt { top: 1560px; font-size: 62px; text-shadow: 0 4px 0 #05060d, 0 8px 30px rgba(0,0,0,.8); }
#e0 { top: 1640px; font-size: 96px; text-shadow: 0 6px 30px rgba(0,0,0,.8); }
#e1 { top: 150px; font-size: 118px; }
#e2 { top: 1585px; font-size: 118px; color: #54e08a; text-shadow: 0 8px 40px rgba(84,224,138,.5); }
#e3 { top: 1742px; font-size: 52px; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="26.8" data-width="1080" data-height="1920" data-fps="30">
 <div id="stage" class="clip" data-start="0" data-duration="26.8" data-track-index="1">
  <div id="cam"><div id="world">
    <div id="wall" class="abs"></div>
    <div class="abs poster" style="left:1500px;top:1240px;width:150px;height:200px;background:#39d0ff33;border:8px solid #cfd6f2"></div>
    <div class="abs poster" style="left:520px;top:1240px;width:150px;height:200px;background:#ff4d5e33;border:8px solid #cfd6f2"></div>
    <div class="abs win" style="left:130px"><div class="abs sky"></div><div class="abs wheel"><span class="abs moon"></span><span class="abs sun"></span></div><span class="abs mull" style="left:186px;top:0;width:14px;height:600px"></span><span class="abs mull" style="left:0;top:290px;width:400px;height:14px"></span></div>
    <div class="abs win" style="left:1600px"><div class="abs sky"></div><div class="abs wheel"><span class="abs moon"></span><span class="abs sun"></span></div><span class="abs mull" style="left:186px;top:0;width:14px;height:600px"></span><span class="abs mull" style="left:0;top:290px;width:400px;height:14px"></span></div>
    <div id="clock" class="abs"><i class="hh"></i><i class="mh"></i></div>
    <div id="board" class="abs"><span class="b1" id="b1">TEST 1</span><span class="b2" id="b2">RESULTS</span></div>
    <div id="tray" class="abs"></div>
    <div id="wains" class="abs"></div><div id="base" class="abs"></div>
    <div id="floor" class="abs"></div><div id="floorl" class="abs"></div>
    <div class="abs beam" style="left:130px"></div><div class="abs beam" style="left:1600px"></div>
    <div class="abs pool" style="left:330px;top:2090px;width:740px;height:240px"></div>
    <div class="abs pool" style="left:1090px;top:2090px;width:740px;height:240px"></div>
    <div class="abs pool" style="left:120px;top:3050px;width:920px;height:300px"></div>
    <div class="abs pool" style="left:1120px;top:3050px;width:920px;height:300px"></div>
    <div id="night" class="abs"></div>
    <div id="backrow"></div>
    <div id="focus" class="abs"></div>
    <div id="frontrow"></div>
    <div id="dim" class="abs"></div>
  </div></div>
  <div id="ui">
    <div id="vig"></div>
    <div id="caps"></div>
    <span id="e0" class="A blk">first test.</span>
    <span id="e1" class="A blk">talent starts.</span>
    <span id="e2" class="A blk">discipline finishes.</span>
    <span id="e3" class="blk">1 hour. Every day. That's it.</span>
    <div id="bars"><i style="top:0"></i><i style="top:1824px"></i></div>
    <div id="flash"></div>
  </div>
 </div>
</div>
<script>
const C = { TALENT: "#39d0ff", EGO: "#ffd84a", OBSESSION: "#ff4d5e", DISCIPLINE: "#54e08a" };
const P = { TALENT: [700, 1950, 440], EGO: [1460, 1950, 440], OBSESSION: [580, 2860, 600], DISCIPLINE: [1580, 2860, 600] }; // cx, deskY, width
const G = { TALENT: "B-", EGO: "D", OBSESSION: "C", DISCIPLINE: "A+" };
const G0 = { TALENT: "A", EGO: "B", OBSESSION: "D", DISCIPLINE: "F" };
const paper = (cls, g, good, r) => `<g class="${cls}"><g transform="translate(0 -46)"><rect x="85" y="-290" width="230" height="290" rx="12" fill="#f7f4ec" transform="rotate(${r} 200 -145)"/><text x="200" y="-70" font-size="${g.length > 1 ? 180 : 210}" text-anchor="middle" fill="${good ? "#17a355" : "#e0283c"}" transform="rotate(${r} 200 -145)">${g}</text></g></g>`;
function fig(k) {
  const c = C[k], [cx, dy, w] = P[k], sc = w / 400;
  const acc = {
    TALENT: `<path class="ln" d="M150 62 A52 52 0 0 1 250 62" style="stroke:${c};stroke-width:14"/><rect x="134" y="52" width="26" height="50" rx="10" fill="${c}"/><rect x="240" y="52" width="26" height="50" rx="10" fill="${c}"/><path d="M180 78 L196 78 M206 78 L222 78" stroke="#0b0e1d" stroke-width="6" stroke-linecap="round"/>`,
    EGO: `<path d="M158 34 L158 -14 L181 12 L200 -22 L219 12 L242 -14 L242 34 Z" fill="${c}"/><path d="M182 84 Q204 96 224 74" stroke="#0b0e1d" stroke-width="7" fill="none" stroke-linecap="round"/>`,
    OBSESSION: `<circle cx="184" cy="72" r="8" fill="${c}"/><circle cx="216" cy="72" r="8" fill="${c}"/><path d="M172 56 L194 62 M228 56 L206 62" stroke="${c}" stroke-width="6" stroke-linecap="round"/>`,
    DISCIPLINE: `<path d="M180 80 Q200 96 220 80" stroke="#0b0e1d" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="150" y="30" width="100" height="16" rx="8" fill="${c}"/>`,
  }[k];
  const prop = {
    TALENT: `<text class="nt nt1" x="300" y="40" font-size="70" fill="${c}">♪</text><text class="nt nt2" x="60" y="20" font-size="56" fill="${c}">♫</text><text class="nt nt3" x="330" y="-40" font-size="48" fill="${c}">♪</text>`,
    EGO: `<g class="trophy" transform="translate(-246 0)"><rect x="296" y="282" width="44" height="12" rx="3" fill="${c}"/><rect x="312" y="262" width="12" height="22" fill="${c}"/><path d="M294 214 H342 V236 A24 24 0 0 1 294 236 Z" fill="${c}"/></g><text class="sp sp1" x="40" y="40" font-size="64" fill="${c}">✦</text><text class="sp sp2" x="345" y="110" font-size="80" fill="${c}">✦</text>`,
    OBSESSION: [0,1,2,3,4,5].map(i => `<rect class="bk bk${i}" x="${286 + (i % 2) * 6}" y="${270 - i * 26}" width="74" height="22" rx="4" fill="${["#ff4d5e","#c93a4a","#ff7d6b","#a52a3a","#ff4d5e","#ff9a8a"][i]}"/>`).join("") + `<text class="zz" x="250" y="150" font-size="60" fill="#f4f1ea">z z z</text><g class="burn"><rect x="60" y="-150" width="280" height="84" rx="14" fill="${c}"/><text x="200" y="-88" font-size="62" text-anchor="middle" fill="#0b0e1d" letter-spacing="3">BURNOUT</text></g>`,
    DISCIPLINE: [0,1,2,3,4,5,6].map(i => `<g class="ck ck${i}"><rect x="${67 + i * 39}" y="-112" width="32" height="32" rx="7" fill="${c}"/><path d="M${74 + i * 39} -96 l7 8 l12 -15" stroke="#0b0e1d" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`).join("") + `<g class="lamp"><path d="M70 294 L70 240 L100 220" class="ln" style="stroke:#8892c8;stroke-width:8"/><path d="M92 206 L126 222 L110 246 Z" fill="#ffe27a"/><ellipse cx="150" cy="292" rx="70" ry="10" fill="#ffe27a" opacity=".35"/></g>`,
  }[k];
  return `<svg class="fig f-${k}" viewBox="0 0 400 520" style="left:${cx - w / 2}px;top:${dy - 296 * sc}px;width:${w}px;height:${w * 1.3}px">
    ${k === "EGO" ? `<rect x="104" y="96" width="192" height="270" rx="26" fill="#3a2a6e" stroke="${c}" stroke-width="8"/><circle cx="112" cy="100" r="16" fill="${c}"/><circle cx="288" cy="100" r="16" fill="${c}"/>` : `<rect x="120" y="210" width="160" height="150" rx="14" fill="#1b2147"/>`}
    <g class="bd">
      <line class="ln ext" x1="200" y1="200" x2="200" y2="330"/>
      <line class="ln" x1="200" y1="120" x2="200" y2="290"/>
      ${k === "EGO" ? `<g class="aL"><polyline class="ln" points="200,160 128,128 158,62"/></g><g class="aR"><polyline class="ln" points="200,160 272,128 242,62"/></g>` : `<g class="aL"><polyline class="ln" points="200,160 138,232 176,292"/></g><g class="aR"><polyline class="ln" points="200,160 262,232 224,292"/></g>`}
      <polyline class="ln upL" points="200,165 124,104 96,18"/><polyline class="ln upR" points="200,165 276,104 304,18"/>
      <g class="hdg"><circle cx="200" cy="72" r="50" fill="#f4f1ea"/>${acc}</g>
    </g>
    <rect x="30" y="296" width="340" height="30" rx="10" fill="#566099"/>
    <rect x="46" y="326" width="308" height="104" rx="6" fill="#2b3364"/>
    <rect x="60" y="430" width="22" height="86" fill="#222950"/><rect x="318" y="430" width="22" height="86" fill="#222950"/>
    <text x="200" y="398" font-size="${k.length > 8 ? 46 : 54}" text-anchor="middle" fill="${c}" letter-spacing="3">${k}</text>
    <rect x="156" y="278" width="88" height="16" rx="3" fill="#f7f4ec" stroke="${c}" stroke-width="4"/>
    ${k === "EGO" ? `<g class="feet"><polyline class="ln" points="214,286 300,262 352,270 362,238"/><polyline class="ln" points="214,286 292,284 338,254 356,226"/></g>` : ""}
    ${prop}
    <g class="meter"><rect x="90" y="-52" width="220" height="26" rx="13" fill="#0b0e1d" stroke="#f4f1ea" stroke-width="5"/><rect class="mf" x="96" y="-46" width="0" height="14" rx="7" fill="${c}"/></g>
    ${paper("paper", G[k], k === "DISCIPLINE", k === "DISCIPLINE" || k === "EGO" ? -4 : 4)}${paper("paper0", G0[k], k === "TALENT" || k === "EGO", k === "TALENT" || k === "OBSESSION" ? -4 : 4)}
  </svg>`;
}
const order = ["TALENT", "EGO", "OBSESSION", "DISCIPLINE"];
document.getElementById("backrow").innerHTML = fig("TALENT") + fig("EGO");
document.getElementById("frontrow").innerHTML = fig("OBSESSION") + fig("DISCIPLINE");
const Q = { TALENT: "“I don't need to study.”", EGO: "“I'm already the best.”", OBSESSION: "20 hours a day. No sleep.", DISCIPLINE: "1 hour. Every single day." };
document.getElementById("caps").innerHTML = order.map((k) => `<span class="A blk nm nm-${k}" style="color:${C[k]};font-size:${k.length > 8 ? 168 : 210}px">${k}</span><span class="blk qt qt-${k}">${Q[k]}</span>`).join("");

document.fonts.ready.then(() => {
  const M = gsap.timeline({ paused: true });
  const tl = gsap.timeline();
  const S = 1.2, END = 25.6;
  const camTo = (cx, cy, s) => ({ x: 540 - cx * s, y: 960 - cy * s, scale: s });
  const WIDE = camTo(1080, 1850, 0.56);
  const close = (k) => { const [cx, dy, w] = P[k]; const s = w > 500 ? 1.12 : 1.5; return camTo(cx, dy - 150 * (w / 400), s); };
  const mid = (k) => { const [cx, dy, w] = P[k]; const s = w > 500 ? 0.92 : 1.2; return camTo(cx, dy - 330 * (w / 400), s); };
  const cam = (t, c, d = 0.36, ease = "power4.inOut") => tl.to("#cam", { ...c, duration: d, ease }, t);
  const flash = (t, a = 0.4) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);
  gsap.set("#cam", { transformOrigin: "0 0", ...camTo(1080, 1850, 0.5) });
  gsap.set("#e0, .paper0, #focus, #flash, .nm, .qt, #e1, #e2, #e3, #dim, .meter, .paper, .zz, .burn, .ext, .upL, .upR, .nt, .sp, .bk, .ck, .beam", { opacity: 0 });
  gsap.set("#clock .hh", { rotation: 100 }); gsap.set("#clock .mh", { rotation: 40 });
  gsap.set(".sky", { backgroundColor: "#0b1638" });

  // ---- continuous life (one scene, everyone always in the room)
  tl.fromTo(".f-TALENT .hdg", { rotation: -7, svgOrigin: "200 120" }, { rotation: 7, svgOrigin: "200 120", duration: 0.2, yoyo: true, repeat: 71, ease: "sine.inOut" }, 0);
  tl.fromTo(".f-TALENT .aL", { rotation: 0, svgOrigin: "200 160" }, { rotation: 62, svgOrigin: "200 160", duration: 0.3 }, 0.4);
  tl.fromTo(".f-TALENT .aR", { rotation: 0, svgOrigin: "200 160" }, { rotation: -62, svgOrigin: "200 160", duration: 0.3 }, 0.4);
  tl.fromTo(".f-EGO .bd", { rotation: -15, svgOrigin: "200 290" }, { rotation: -10, svgOrigin: "200 290", duration: 0.8, yoyo: true, repeat: 31, ease: "sine.inOut" }, 0);
  tl.fromTo(".f-OBSESSION .bd", { x: -4 }, { x: 4, duration: 0.05, yoyo: true, repeat: 263, ease: "none" }, 0);
  tl.fromTo(".f-OBSESSION .aR", { rotation: -8, svgOrigin: "200 160" }, { rotation: 10, svgOrigin: "200 160", duration: 0.08, yoyo: true, repeat: 163, ease: "none" }, 0);
  tl.fromTo(".f-DISCIPLINE .aR", { rotation: -4, svgOrigin: "200 160" }, { rotation: 6, svgOrigin: "200 160", duration: 0.4, yoyo: true, repeat: 51, ease: "sine.inOut" }, 0);

  // ---- 1. establishing shot (0 - 2.4)
  tl.to("#cam", { ...WIDE, duration: 2.4, ease: "power1.out" }, 0);
  tl.fromTo("#bars i", { scaleY: 2.2 }, { scaleY: 1, duration: 0.8, ease: "power2.out" }, 0);

  // ---- 2. meet each student, camera whips desk to desk (2.4 - 10.4)
  order.forEach((k, i) => {
    const t = 2.4 + i * 2.0;
    cam(t, close(k)); flash(t + 0.14, 0.18);
    tl.fromTo(`.nm-${k}`, { opacity: 0, y: -50, scale: 1.3 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "power4.out" }, t + 0.26);
    tl.fromTo(`.qt-${k}`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.2 }, t + 0.36);
    tl.to(`.nm-${k}, .qt-${k}`, { opacity: 0, duration: 0.12 }, t + 1.9);
    tl.to("#cam", { scale: "+=0.05", duration: 1.6, ease: "none" }, t + 0.38);
    if (i > 1) { tl.to("#focus", { opacity: 1, duration: 0.3 }, t + 0.1); }
  });
  ["nt1", "nt2", "nt3"].forEach((n, i) => tl.fromTo(`.${n}`, { y: 50, opacity: 0 }, { y: -70, opacity: 1, duration: 1.2, ease: "power1.out", repeat: 2 }, 2.7 + i * 0.25));
  tl.to(".nt", { opacity: 0, duration: 0.3 }, 10.6);
  tl.fromTo(".trophy", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.25, ease: "bounce.out" }, 4.8);
  ["sp1", "sp2"].forEach((n, i) => { tl.fromTo(`.${n}`, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(3)" }, 5.0 + i * 0.4); tl.to(`.${n}`, { rotation: 180, transformOrigin: "50% 50%", duration: 5, ease: "none" }, 5.3 + i * 0.4); });
  [0, 1, 2, 3, 4, 5].forEach((i) => tl.fromTo(`.bk${i}`, { y: -420, opacity: 0 }, { y: 0, opacity: 1, duration: 0.18, ease: "power2.in" }, 6.8 + i * 0.2));
  [0, 1, 2, 3, 4, 5, 6].forEach((i) => tl.fromTo(`.ck${i}`, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(3)" }, 8.9 + i * 0.18));

  // ---- 3. time-lapse: 30 days pass in the same room (10.4 - 16.0)
  const T = 10.8, D = 5.2, H = D / 11;
  cam(10.4, WIDE, 0.5);
  tl.to("#focus", { opacity: 0, duration: 0.3 }, 10.4);
  tl.to(".meter", { opacity: 1, duration: 0.25 }, 10.5);
  const b2 = document.getElementById("b2"), b1 = document.getElementById("b1");
  tl.fromTo("#night", { opacity: 1 }, { opacity: 0.12, duration: H, yoyo: true, repeat: 10, ease: "sine.inOut" }, T);
  tl.fromTo(".sky", { backgroundColor: "#0b1638" }, { backgroundColor: "#6fc3ff", duration: H, yoyo: true, repeat: 10, ease: "sine.inOut" }, T);
  tl.fromTo(".beam", { opacity: 0 }, { opacity: 1, duration: H, yoyo: true, repeat: 10, ease: "sine.inOut" }, T);
  tl.fromTo(".wheel", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 180 * 11, transformOrigin: "50% 50%", duration: D, ease: "none" }, T);
  tl.to("#clock .mh", { rotation: 40 + 360 * 12, duration: D, ease: "none" }, T);
  tl.to("#clock .hh", { rotation: 100 + 360 * 2, duration: D, ease: "none" }, T);
  tl.to("#cam", { ...camTo(1080, 1850, 0.6), duration: D, ease: "none" }, T);
  // progress meters (full = 208)
  tl.to(".f-DISCIPLINE .mf", { attr: { width: 208 }, duration: D, ease: "none" }, T);
  tl.to(".f-EGO .mf", { attr: { width: 30 }, duration: D, ease: "power1.out" }, T);
  tl.to(".f-TALENT .mf", { attr: { width: 24 }, duration: 4.2, ease: "none" }, T);
  tl.to(".f-TALENT .mf", { attr: { width: 128 }, duration: 0.9, ease: "power3.in" }, T + 4.2);
  tl.fromTo(".f-TALENT .bd", { x: -5 }, { x: 5, duration: 0.05, yoyo: true, repeat: 17, ease: "none", immediateRender: false }, T + 4.2);
  tl.to(".f-OBSESSION .mf", { attr: { width: 180 }, duration: 1.8, ease: "power2.out" }, T);
  // burnout
  const BO = T + 2.4;
  tl.to(".f-OBSESSION .mf", { attr: { width: 70 }, fill: "#7a3d48", duration: 0.5, ease: "bounce.out" }, BO);
  tl.to(".f-OBSESSION .hdg", { y: 150, rotation: 24, svgOrigin: "200 120", duration: 0.35, ease: "power3.in" }, BO);
  tl.fromTo(".burn", { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.25, ease: "back.out(2.5)" }, BO + 0.1);
  tl.to(".burn", { opacity: 0, duration: 0.25 }, BO + 1.6);
  tl.fromTo(".zz", { opacity: 0, y: 20 }, { opacity: 0.9, y: -20, duration: 0.8, yoyo: true, repeat: 5, ease: "sine.inOut" }, BO + 0.5);
  flash(BO, 0.25);

  // ---- 4. exam day: papers come back (16.0 - 21.2)
  flash(16.0, 0.55);
  tl.to("#night", { opacity: 0.1, duration: 0.2 }, 16.0);
  tl.to(".meter, .ck, .zz", { opacity: 0, duration: 0.25 }, 16.3);
  ["EGO", "TALENT", "OBSESSION", "DISCIPLINE"].forEach((k, i) => {
    const t = 16.8 + i * 0.8;
    cam(t - 0.3, mid(k), 0.3);
    tl.fromTo(`.f-${k} .paper`, { scale: 0, opacity: 0, rotation: -30, svgOrigin: "200 280" }, { scale: 1, opacity: 1, rotation: 0, svgOrigin: "200 280", duration: 0.22, ease: "back.out(2)" }, t);
    if (k === "DISCIPLINE") flash(t + 0.1, 0.7);
  });
  cam(19.9, camTo(1080, 1850, 0.6), 0.45);
  tl.to("#dim", { opacity: 1, duration: 0.5 }, 20.2);

  // ---- 5. the winner stands (21.2 - end)
  cam(21.2, camTo(1580, 2600, 1.15), 0.5);
  tl.to("#backrow", { opacity: 0, duration: 0.4 }, 21.2);
  tl.to(".f-DISCIPLINE .paper", { y: -120, opacity: 0, duration: 0.3 }, 21.4);
  tl.to(".f-DISCIPLINE .aL, .f-DISCIPLINE .aR", { opacity: 0, duration: 0.1 }, 21.6);
  tl.to(".f-DISCIPLINE .upL, .f-DISCIPLINE .upR, .f-DISCIPLINE .ext", { opacity: 1, duration: 0.1 }, 21.6);
  tl.to(".f-DISCIPLINE .bd", { y: -110, duration: 0.3, ease: "back.out(2.5)" }, 21.6);
  tl.fromTo(".f-DISCIPLINE .bd", { y: -110 }, { y: -128, duration: 0.2, yoyo: true, repeat: 17, ease: "sine.inOut", immediateRender: false }, 21.9);
  flash(21.7, 0.5);
  tl.fromTo("#e1", { opacity: 0, y: -30 }, { opacity: 0.85, y: 0, duration: 0.3 }, 21.9);
  tl.fromTo("#e2", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.22, ease: "power4.in" }, 22.6);
  flash(22.82, 0.45);
  tl.fromTo("#e3", { opacity: 0, y: 20 }, { opacity: 0.85, y: 0, duration: 0.3 }, 23.4);
  tl.to("#cam", { scale: "+=0.05", x: "-=79", y: "-=130", duration: 3.6, ease: "none" }, 21.8);
  tl.set({}, {}, END);
  M.add(tl, S);
  const clk = { v: 0 }; let last = "";
  M.fromTo(clk, { v: 0 }, { v: 1, duration: S + END, ease: "none", onUpdate: () => {
    const t = M.time(); let a, b;
    if (t < 2.9) { a = "TEST 1"; b = "RESULTS"; }
    else if (t < S + T) { a = "FINALS IN"; b = "30 DAYS"; }
    else if (t < S + T + D) { const n = Math.max(1, Math.round(30 * (1 - (t - S - T) / D))); a = "FINALS IN"; b = n + (n === 1 ? " DAY" : " DAYS"); }
    else { a = "TODAY:"; b = "FINALS"; }
    if (a + b !== last) { b1.textContent = a; b2.textContent = b; last = a + b; }
  } }, 0);
  // ---- 0. first test comes back: the "gifted" ones win round one
  M.fromTo("#e0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25 }, 0.05);
  M.to("#e0", { opacity: 0, duration: 0.2 }, 2.6);
  order.forEach((k, i) => {
    const t = 0.3 + i * 0.4;
    M.fromTo(`.f-${k} .paper0`, { scale: 0, opacity: 0, rotation: -30, svgOrigin: "200 280" }, { scale: 1, opacity: 1, rotation: 0, svgOrigin: "200 280", duration: 0.22, ease: "back.out(2)" }, t);
    M.to(`.f-${k} .paper0`, { y: 120, opacity: 0, duration: 0.25, ease: "power2.in" }, 2.6 + i * 0.05);
  });
  M.fromTo(".f-OBSESSION .hdg, .f-DISCIPLINE .hdg", { y: 0 }, { y: 26, duration: 0.3, yoyo: true, repeat: 1, repeatDelay: 0.7, ease: "power2.out" }, 1.3);
  M.fromTo("#flash", { opacity: 0.5 }, { opacity: 0, duration: 0.25, immediateRender: false }, 2.9);
  M.fromTo("#board", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "back.out(3)", immediateRender: false }, 2.9);
  window.__timelines["main"] = M;
});
</script>
