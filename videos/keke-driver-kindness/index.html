<script>
      const tl = gsap.timeline({ paused: true });
      const type = (sel, t, cps = 24) => {
        const el = document.querySelector(sel);
        const txt = el.textContent;
        el.textContent = "";
        for (const c of txt) {
          const sp = document.createElement("span");
          sp.className = "ch";
          sp.textContent = c;
          el.appendChild(sp);
        }
        tl.fromTo(el.querySelectorAll(".ch"), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 1 / cps, ease: "none" }, t);
      };
      const out = (sel, t) => tl.to(sel, { opacity: 0, duration: 0.2 }, t);
      const draw = (sel, t, d = 0.4) => tl.to(sel, { strokeDashoffset: 0, duration: d, ease: "power2.out" }, t);
      const show = (sel, t) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12 }, t);
      const label = (sel, t) => tl.fromTo(sel, { scale: 0.4, opacity: 0, transformOrigin: "0% 50%" }, { scale: 1, opacity: 1, transformOrigin: "0% 50%", duration: 0.3, ease: "back.out(2.5)" }, t);
      const flash = (t, o = 0.75) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
      const push = (sel, t, dur, a = 1.0, b = 1.06) => tl.fromTo(sel, { scale: a }, { scale: b, duration: dur, ease: "none", immediateRender: false }, t);

      // ---------- HOOK ----------
      const HIT = 0.93;
      flash(HIT, 0.95);
      tl.fromTo("#h1", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, HIT);
      draw("#ring", 1.15);
      tl.fromTo("#arrow", { opacity: 0, scale: 0.3, transformOrigin: "5% 95%" }, { opacity: 1, scale: 1, transformOrigin: "5% 95%", duration: 0.25, ease: "back.out(2.2)" }, 1.3);
      tl.fromTo("#frz-img", { scale: 1.0, transformOrigin: "32% 55%" }, { scale: 1.2, transformOrigin: "32% 55%", duration: 1.5, ease: "power2.out" }, HIT);
      tl.to(["#ring", "#arrow"], { opacity: 0, duration: 0.15 }, 2.3);
      // ---------- STORY ----------
      flash(2.43, 0.35); push("#w2", 2.43, 2.6);
      type("#w2a", 2.55); type("#w2b", 3.0); type("#w2c", 3.4);
      flash(5.03, 0.7); push("#w3", 5.03, 3.3);
      type("#a1", 5.15); type("#a1b", 5.45); type("#a2", 5.85); type("#a2b", 6.2); type("#a3", 6.6);
      flash(8.33, 0.5); push("#w4", 8.33, 3.1);
      type("#b1", 8.45); type("#b2", 9.0); type("#b2b", 9.35); type("#b3", 9.85); type("#b3b", 10.2);
      flash(11.43, 0.4); push("#w6", 11.43, 2.8);
      type("#d1", 11.55); type("#d2", 12.15); type("#d2b", 12.4); type("#d2c", 12.6); type("#d3", 13.1); type("#d3b", 13.4);
      // ---------- REVEAL: he paid him back ----------
      flash(14.23, 0.5); push("#w5", 14.23, 3.6);
      type("#p1", 14.35); type("#p2", 14.95); type("#p2b", 15.2); type("#p3", 15.75); type("#p3b", 15.85); type("#p4", 16.25);
      // ---------- ENDING: RESPECT THE KINDNESS ----------
      tl.fromTo("#end-img", { scale: 1.0, transformOrigin: "55% 40%" }, { scale: 1.12, transformOrigin: "55% 40%", duration: 2.17, ease: "none" }, 17.83);
      flash(17.88, 0.95);
      tl.fromTo("#wendi", { scale: 1.0, filter: "blur(0px) brightness(1)" }, { scale: 1.45, filter: "blur(18px) brightness(2.1)", duration: 0.07, ease: "power4.out" }, 17.86);
      tl.to("#wendi", { scale: 1.0, filter: "blur(0px) brightness(1)", duration: 0.6, ease: "power3.out" }, 17.93);
      tl.fromTo("#leak", { opacity: 0, x: 0, scale: 1.3 }, { opacity: 1, x: 0, scale: 1.3, duration: 0.06 }, 17.86);
      tl.to("#leak", { opacity: 0, x: 300, duration: 0.7, ease: "power2.out" }, 17.96);
      tl.fromTo("#wendg", { opacity: 0, x: 0, scale: 1.0 }, { opacity: 0.5, x: 70, scale: 1.18, duration: 0.08, ease: "none" }, 17.88);
      tl.to("#wendg", { opacity: 0, x: 18, scale: 1.04, duration: 1.0, ease: "power2.out" }, 17.98);
      tl.fromTo("#wend", { x: 0, y: 0 }, { keyframes: [{ x: -26, y: 14, duration: 0.05 }, { x: 22, y: -12, duration: 0.05 }, { x: -14, y: 8, duration: 0.06 }, { x: 9, y: -5, duration: 0.07 }, { x: -4, y: 2, duration: 0.08 }, { x: 0, y: 0, duration: 0.09 }], ease: "none", immediateRender: false }, 17.90);
      tl.fromTo("#o5-c", { scale: 2.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "expo.out" }, 17.88);

      tl.fromTo("#heart", { x: 0, y: 0 }, { keyframes: [{ x: -18, y: 10, duration: 0.05 }, { x: 15, y: -8, duration: 0.05 }, { x: -9, y: 5, duration: 0.06 }, { x: 5, y: -3, duration: 0.07 }, { x: 0, y: 0, duration: 0.08 }], ease: "none", immediateRender: false }, 18.10);

      window.__timelines["main"] = tl;
