  <script>
    (function () {
      const NS = "http://www.w3.org/2000/svg";
      let seed = 1872;
      const rnd = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      const swells = document.querySelector("#sea-swells");
      const rows = [];
      for (let i = 0; i < 14; i++) {
        const p = document.createElementNS(NS, "path");
        const y = 1090 + i * i * 9 + i * 18;
        p.setAttribute("stroke-opacity", (0.25 + i * 0.04).toFixed(2));
        swells.appendChild(p);
        rows.push({ el: p, y, amp: 3 + i * 1.6, len: 160 + i * 30, ph: rnd() * 6.28, v: 0.4 + i * 0.05 });
      }
      const glints = document.querySelector("#sea-glints");
      const gl = [];
      for (let i = 0; i < 36; i++) {
        const l = document.createElementNS(NS, "line");
        const y = 1075 + rnd() * 700;
        const w = 10 + (y - 1060) * 0.12 * rnd();
        l.setAttribute("stroke-width", 2 + (y - 1060) * 0.006);
        glints.appendChild(l);
        gl.push({ el: l, x: 850 + (rnd() - 0.5) * (60 + (y - 1060) * 0.35), y, w, ph: rnd() * 6.28 });
      }
      const ship = document.querySelector("#sea-ship");
      const front = document.querySelector("#sea-front");
      const fallA = document.querySelector("#sea-fall-a");
      const fallB = document.querySelector("#sea-fall-b");
      window.__seaAt = (t) => {
        for (const r of rows) {
          let d = `M -3000 ${r.y}`;
          for (let x = -3000; x <= 4080; x += 60) {
            const y = r.y + r.amp * Math.sin((x / r.len) * 6.283 + r.ph + t * r.v * 2);
            d += ` L ${x} ${y.toFixed(1)}`;
          }
          r.el.setAttribute("d", d);
        }
        for (const g of gl) {
          const o = 0.15 + 0.5 * Math.max(0, Math.sin(g.ph + t * 2.1));
          g.el.setAttribute("x1", g.x - g.w / 2); g.el.setAttribute("x2", g.x + g.w / 2);
          g.el.setAttribute("y1", g.y); g.el.setAttribute("y2", g.y);
          g.el.setAttribute("stroke-opacity", o.toFixed(2));
        }
        // The ship rolls and drifts with no one steering.
        const rot = 1.8 * Math.sin((t / 5.5) * 6.283);
        const bob = 6 * Math.sin((t / 5.5) * 6.283 + 1.1);
        const drift = -2.2 * t;
        ship.setAttribute("transform", `translate(${(540 + drift).toFixed(1)} ${(1100 + bob).toFixed(1)}) rotate(${rot.toFixed(2)})`);
        // Empty falls swing from the davits.
        const sw = 9 * Math.sin((t / 5.5) * 6.283 + 0.6);
        fallA.setAttribute("d", `M 330 -196 Q ${330 + sw * 0.4} -160 ${330 + sw} -128`);
        fallB.setAttribute("d", `M 392 -196 Q ${392 + sw * 0.4} -160 ${392 + sw} -128`);
        // Foreground swell hides the hull's waterline.
        let f = `M -3000 3000 L -3000 1112`;
        for (let x = -3000; x <= 4080; x += 40) {
          const y = 1112 + 10 * Math.sin((x / 240) * 6.283 + t * 1.4) + 5 * Math.sin((x / 90) * 6.283 - t * 2.2);
          f += ` L ${x} ${y.toFixed(1)}`;
        }
        front.setAttribute("d", f + " L 4080 3000 Z");
      };
      window.__seaAt(0);
    })();

    const tl = gsap.timeline({ paused: true });
    const cam = (px, py, s) => ({ x: -s * (px - 540), y: -s * (py - 960), scale: s });
    const clock = { t: 0 };
    tl.fromTo(clock, { t: 0 }, { t: 20, duration: 20, ease: "none", onUpdate: () => window.__seaAt(clock.t) }, 0);

    // The hull panel lifts away to show the cabin, table still laid.
    tl.fromTo("#sea-panel", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 7.6);

    // Camera: the ship in the fog → the empty deck → the cabin → the davits → empty sea → the ship drifting on.
    tl.fromTo("#sea-world", cam(540, 760, 1.0), { ...cam(540, 780, 1.08), duration: 4.15, ease: "none" }, 0);
    tl.to("#sea-world", { ...cam(520, 900, 1.8), duration: 0.7, ease: "power3.inOut" }, 4.15);
    tl.to("#sea-world", { ...cam(500, 900, 1.88), duration: 2.5, ease: "none" }, 4.85);
    tl.to("#sea-world", { ...cam(800, 1050, 3.0), duration: 0.7, ease: "power3.inOut" }, 7.35);
    tl.to("#sea-world", { ...cam(795, 1050, 3.15), duration: 3.05, ease: "none" }, 8.05);
    tl.to("#sea-world", { ...cam(880, 960, 2.4), duration: 0.6, ease: "power3.inOut" }, 11.1);
    tl.to("#sea-world", { ...cam(875, 962, 2.5), duration: 1.25, ease: "none" }, 11.7);
    tl.to("#sea-world", { ...cam(120, 880, 0.7), duration: 0.8, ease: "power3.inOut" }, 12.95);
    tl.to("#sea-world", { ...cam(100, 880, 0.7), duration: 0.9, ease: "none" }, 13.75);
    tl.to("#sea-world", { ...cam(520, 800, 0.85), duration: 0.9, ease: "power3.inOut" }, 14.65);
    tl.to("#sea-world", { ...cam(510, 800, 0.8), duration: 4.45, ease: "none" }, 15.55);

    window.__timelines["sea"] = tl;
  </script>
