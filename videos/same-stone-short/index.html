<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<title>same-stone</title>
<script src="assets/vendor/gsap.min.js"></script>
<style>
@font-face { font-family: "JetBrains Mono"; font-weight: 700; src: url("assets/fonts/JetBrainsMono-700.woff2") format("woff2"); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "JetBrains Mono", monospace; font-weight: 700; color: #f1ede6; }
#stage { position: absolute; inset: 0; }
#punch { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 960px; }
.pn { position: absolute; left: 0; width: 1080px; height: 380px; overflow: hidden; }
.pn svg { position: absolute; left: 0; top: 0; width: 1080px; height: 380px; }
svg text { font-family: "JetBrains Mono"; font-weight: 700; }
.ol { fill: none; stroke: #0b0a09; stroke-width: 56; stroke-linecap: round; stroke-linejoin: round; }
.sh { fill: none; stroke: #a9a7a2; stroke-width: 42; stroke-linecap: round; stroke-linejoin: round; }
.hi { fill: none; stroke: #f6f4ef; stroke-width: 26; stroke-linecap: round; stroke-linejoin: round; }
.bk.sh { stroke: #77756f; } .bk.hi { stroke: #c4c2bc; }
.tor.ol { stroke-width: 84; } .tor.sh { stroke-width: 70; } .tor.hi { stroke-width: 50; }
#strip { position: absolute; left: 0; top: 900px; width: 1080px; height: 120px; text-align: center; }
#strip .a { display: block; margin-top: 12px; font-size: 34px; letter-spacing: 12px; color: #cfc8bb; white-space: nowrap; }
#strip .b { display: block; font-size: 50px; letter-spacing: 8px; line-height: 1.15; white-space: nowrap; }
#strip .b b { font-size: 64px; font-weight: 700; }
.tag { position: absolute; display: block; right: 34px; width: 330px; height: 190px; border-radius: 18px; border: 5px solid #5a4a36; background: rgba(0,0,0,.78); text-align: center; }
.tag .r { display: block; margin-top: 14px; font-size: 84px; line-height: 1; white-space: nowrap; }
.tag .m { display: block; font-size: 46px; line-height: 1.5; color: #e9c98a; white-space: nowrap; }
.tag.win { background: #f1ede6; border-color: #f1ede6; color: #0b0a09; }
.tag.win .m { color: #7a4f12; }
.dimr { position: absolute; left: 0; width: 1080px; height: 380px; background: #000; }
#flash { position: absolute; inset: 0; background: #fff; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="24.828" data-width="1080" data-height="1920" data-fps="30">
 <div id="stage" class="clip" data-start="0" data-duration="24.828" data-track-index="1">
  <div id="punch"><div id="panels"></div><div id="strip"><span class="a">SAME STONE</span><span class="b">DAY <b id="day">1</b></span></div></div>
  <div id="tags"></div>
  <div id="flash"></div>
 </div>
</div>
<script>
// ---- who does what with the stone (edit these tables to change the story or the winner)
const ORDER = ["T", "E", "O", "D"], DAYS = 60, MPF = 2; // metres per flip of the stone
const NAME = { T: "TALENT", E: "EGO", O: "OBSESSION", D: "DISCIPLINE" };
const FLIPS = { // [beat, total flips so far]
  T: [[0, 0], [2, 0], [5, 6, "power1.out"], [36, 6]],
  E: [[0, 0], [36, 0]],
  O: [[0, 0], [2, 0], [10, 32, "none"], [24, 32], [30, 41, "none"], [36, 41]],
  D: [[0, 0], [2, 0], [30, 50, "none"], [36, 50]],
};
const MODES = {
  T: [[0, "stand"], [2, "run"], [5, "sit"]],
  E: [[0, "stand"], [2.2, "flex"], [8.6, "kick"], [9.2, "hop"], [13, "flex"]],
  O: [[0, "stand"], [2, "pushfast"], [10, "tired"], [13, "down"], [23.4, "tired"], [24, "push"], [30, "tired"]],
  D: [[0, "stand"], [2, "push"], [30, "cheer"]],
};
const RANK = [["4TH", "E"], ["3RD", "T"], ["2ND", "O"], ["1ST", "D"]];

const PY = { T: 140, E: 520, O: 1020, D: 1400 }, FLOOR = 336, FX = 360, SX = 592, A = 95, U = 0.56;
const ACC = {
  T: `<path d="M-50 -6 A50 50 0 0 1 50 -6" fill="none" stroke="#6f6c66" stroke-width="13" stroke-linecap="round"/><circle cx="-2" cy="2" r="22" fill="#6f6c66" stroke="#0b0a09" stroke-width="5"/>`,
  E: `<rect x="4" y="-16" width="46" height="22" rx="8" fill="#0b0a09"/>`,
  O: `<rect x="-48" y="-34" width="96" height="18" rx="9" fill="#b0563f"/><path d="M-46 -26 L-84 -40 L-78 -10 Z" fill="#b0563f"/>`,
  D: ``,
};
const limbs = (k) => ["aB", "lB", "to", "lF", "aF"].map((p) => { const c = (p === "to" ? " tor" : "") + (p[1] === "B" ? " bk" : ""); return `<polyline id="o-${p}-${k}" class="ol${c}"/><polyline id="s-${p}-${k}" class="sh${c}"/><polyline id="h-${p}-${k}" class="hi${c}" transform="translate(-5 -6)"/>`; }).join("");
const panel = (k) => `<div class="pn" style="top:${PY[k]}px"><svg viewBox="0 0 1080 380">
  <defs><linearGradient id="cone-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".34"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0.03"/></linearGradient>
  <linearGradient id="flr-${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2c1c"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="stn-${k}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9bba0"/><stop offset="1" stop-color="#8a7a62"/></linearGradient></defs>
  ${[0, 1].map((i) => `<g id="lamp${i}-${k}"><polygon points="-26,64 26,64 190,${FLOOR} -190,${FLOOR}" fill="url(#cone-${k})"/><line x1="0" y1="0" x2="0" y2="40" stroke="#5a4a36" stroke-width="4"/><path d="M-32 64 L-18 40 L18 40 L32 64 Z" fill="#2a2118" stroke="#5a4a36" stroke-width="4"/><ellipse cx="0" cy="66" rx="26" ry="7" fill="#ffe6b8"/></g>`).join("")}
  <rect x="0" y="${FLOOR}" width="1080" height="${380 - FLOOR}" fill="url(#flr-${k})"/><line x1="0" y1="${FLOOR}" x2="1080" y2="${FLOOR}" stroke="#6a573f" stroke-width="5"/>
  ${Array.from({ length: 26 }, (_, i) => `<rect id="ch${i}-${k}" x="-5" y="${FLOOR - 10 - (i % 3) * 2}" width="${8 + (i % 3) * 4}" height="${8 + (i % 2) * 4}" fill="#b8a98e" transform="rotate(${(i * 37) % 60})"/>`).join("")}
  <g id="st-${k}"><rect id="sr-${k}" x="${-A}" y="${-A}" width="${2 * A}" height="${2 * A}" rx="10" fill="url(#stn-${k})" stroke="#1d1810" stroke-width="7"/><rect id="si-${k}" x="${-A + 9}" y="${-A + 9}" width="${2 * A - 18}" height="${2 * A - 18}" rx="6" fill="none" stroke="#efe4cc" stroke-opacity=".35" stroke-width="4"/>
    <path d="M-38 -30 L-10 -8 L-22 22 M10 -44 L20 -16 L44 2 M-6 30 L26 40" fill="none" stroke="#5e5140" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>${[[-30, 40], [34, -34], [-44, -6], [8, 8], [40, 30], [-14, -46]].map((p) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#6d5f4b"/>`).join("")}</g>
  <g id="fg-${k}">${limbs(k)}<g id="hd-${k}"><circle r="46" fill="#a9a7a2" stroke="#0b0a09" stroke-width="8"/><circle cx="-5" cy="-6" r="36" fill="#f6f4ef"/>${ACC[k]}</g></g>
  <g id="ex-${k}"><text id="zz-${k}" x="96" y="-60" font-size="40" fill="#f1ede6">z z z</text>
    ${[0, 1, 2].map((i) => `<path id="sm${i}-${k}" d="M${-34 + i * 30} -60 q-10 -12 0 -24 q10 -12 0 -24 q-10 -12 0 -24" fill="none" stroke="#cfc8bb" stroke-width="6" stroke-linecap="round"/>`).join("")}
    <circle id="sw0-${k}" cx="50" r="7" fill="#cfe6ff"/><circle id="sw1-${k}" cx="-48" r="6" fill="#cfe6ff"/></g>
  <text x="40" y="46" font-size="34" fill="#f1ede6" letter-spacing="10">${NAME[k]}</text>
  <text id="mt-${k}" x="1040" y="46" font-size="34" text-anchor="end" fill="#e9c98a" letter-spacing="3">0 M</text>
</svg></div>`;
document.getElementById("panels").innerHTML = ORDER.map(panel).join("");
document.getElementById("tags").innerHTML = ORDER.map((k) => `<div class="dimr" id="dim-${k}" style="top:${PY[k]}px"></div>`).join("") + RANK.map((r, i) => `<div class="tag${i === 3 ? " win" : ""}" id="tag${i}" style="top:${PY[r[1]] + 110}px"><span class="r">${r[0]}</span><span class="m" id="tm${i}"></span></div>`).join("");

// ---- posable figure: joint angles in, limb points out
const D2R = Math.PI / 180, $ = (id) => document.getElementById(id);
const dir = (a) => [Math.sin(a * D2R), Math.cos(a * D2R)];
const walkLeg = (ph, base, amp, bend) => [base + amp * Math.sin(ph), 18 + bend * Math.max(0, Math.cos(ph))];
const pushPose = (ph, amp, lean) => ({ lean: lean + 3 * Math.sin(2 * ph), head: -12, aF: [60, 10], aB: [50, 18], lF: walkLeg(ph, -14, amp, 42), lB: walkLeg(ph + Math.PI, -14, amp, 42) });
const POSE = {
  stand: () => ({ lean: 0, head: 0, aF: [10, 8], aB: [-8, 8], lF: [8, 0], lB: [-8, 0] }),
  run: (t, ph) => pushPose(ph, 46, 30),
  pushfast: (t, ph) => pushPose(ph, 42, 46),
  push: (t, ph) => pushPose(ph, 32, 40),
  flex: (t) => ({ lean: -8, head: -8, aF: [92, 112 + 12 * Math.sin(t * 9)], aB: [-25, 95], lF: [10, 0], lB: [-10, 0], dy: -14 * Math.abs(Math.sin(t * Math.PI * 2)) }),
  kick: () => ({ lean: -16, head: 0, aF: [-34, 20], aB: [44, 30], lF: [74, 6], lB: [-8, 8], dx: 70 }),
  hop: (t) => ({ lean: -4, head: -16, aF: [44, 62], aB: [34, 70], lF: [56, 98], lB: [0, 8], dx: 20, dy: -30 * Math.abs(Math.sin(t * Math.PI * 2)) }),
  sit: (t) => ({ face: -1, lean: -22, head: -14 + 4 * Math.sin(t * 1.5), aF: [15, 75], aB: [5, 85], lF: [80, 5], lB: [62, 70], dx: 196 }),
  tired: (t) => ({ lean: 66 + 3 * Math.sin(t * 3), head: 18, aF: [-30, -10], aB: [-40, -6], lF: [14, 24], lB: [-10, 22] }),
  down: (t) => ({ lean: 0, rot: -88, head: 8, aF: [-160, -10], aB: [-100, -24], lF: [18 + 4 * Math.sin(t * 3), 14], lB: [-4, 6], dx: -40 }),
  cheer: (t) => ({ lean: -4, head: -12, aF: [158, 8], aB: [-158, -8], lF: [10, 0], lB: [-10, 0], dy: -22 * Math.abs(Math.sin(t * Math.PI)), dx: 40 }),
};
const NUM = ["lean", "head", "rot", "dx", "dy"], ARR = ["aF", "aB", "lF", "lB"];
const mix = (a, b, k) => { const o = { face: b.face || 1 }; NUM.forEach((n) => { o[n] = (a[n] || 0) + ((b[n] || 0) - (a[n] || 0)) * k; }); ARR.forEach((n) => { o[n] = [a[n][0] + (b[n][0] - a[n][0]) * k, a[n][1] + (b[n][1] - a[n][1]) * k]; }); return o; };
const modeAt = (k, t) => { const m = MODES[k]; let i = 0; while (i + 1 < m.length && m[i + 1][0] <= t) i++; return i; };
const solve = (p) => {
  const S = [150 * Math.sin(p.lean * D2R), -150 * Math.cos(p.lean * D2R)], hd = (p.lean + p.head) * D2R, HC = [S[0] + 66 * Math.sin(hd), S[1] - 66 * Math.cos(hd)];
  const limb = (o, a, b, l) => { const d1 = dir(a), j = [o[0] + l * d1[0], o[1] + l * d1[1]], d2 = dir(b); return [o, j, [j[0] + l * d2[0], j[1] + l * d2[1]]]; };
  const pts = { to: [[0, 0], S], aF: limb(S, p.aF[0], p.aF[0] + p.aF[1], 82), aB: limb(S, p.aB[0], p.aB[0] + p.aB[1], 82), lF: limb([0, 0], p.lF[0], p.lF[0] - p.lF[1], 105), lB: limb([0, 0], p.lB[0], p.lB[0] - p.lB[1], 105), hc: [HC] };
  const r = p.rot * D2R, c = Math.cos(r), s = Math.sin(r); let maxY = -1e9;
  Object.keys(pts).forEach((n) => { pts[n] = pts[n].map(([x, y]) => [x * c - y * s, x * s + y * c]); pts[n].forEach((q) => { maxY = Math.max(maxY, q[1] + (n === "hc" ? 46 : n === "to" ? 34 : 20)); }); });
  const oy = -maxY + p.dy; Object.keys(pts).forEach((n) => { pts[n] = pts[n].map(([x, y]) => [x, y + oy]); });
  return pts;
};

document.fonts.ready.then(() => {
  // Authored in beats (1.0 = one beat) and played at 87 BPM.
  const BPM = 87, K = 60 / BPM, END = 36;
  const R = gsap.timeline({ paused: true }), M = gsap.timeline();
  const kf = (a, t) => { for (let i = 1; i < a.length; i++) if (t <= a[i][0]) { const [t0, v0] = a[i - 1], [t1, v1, e] = a[i], k = (t - t0) / (t1 - t0); return v0 + (v1 - v0) * (e ? gsap.parseEase(e)(k) : k); } return a[a.length - 1][1]; };
  const mod = (v, m) => ((v % m) + m) % m, str = (a) => a.map((q) => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  const poseAt = (k, t, ph) => { const m = MODES[k], i = modeAt(k, t), cur = POSE[m[i][1]](t, ph), B = 0.35;
    if (i > 0 && t < m[i][0] + B) return mix(POSE[m[i - 1][1]](t, ph), cur, gsap.parseEase("power2.out")((t - m[i][0]) / B)); return mix(cur, cur, 1); };
  const apply = (t) => {
    $("day").textContent = Math.max(1, Math.min(DAYS, 1 + Math.floor((t - 2) / 28 * (DAYS - 1))));
    ORDER.forEach((k) => {
      const fl = kf(FLIPS[k], t), q = Math.pow(Math.min(1, fl / 50), 1.3), r = 10 + q * (A - 10), th = fl * 90, tr = th * D2R;
      const h = r + (A - r) * (Math.abs(Math.cos(tr)) + Math.abs(Math.sin(tr))), scroll = fl * 150;
      $(`st-${k}`).setAttribute("transform", `translate(${SX} ${(FLOOR - h).toFixed(1)}) rotate(${th.toFixed(1)})`);
      $(`sr-${k}`).setAttribute("rx", r.toFixed(1)); $(`si-${k}`).setAttribute("rx", Math.max(4, r - 8).toFixed(1));
      [0, 1].forEach((i) => $(`lamp${i}-${k}`).setAttribute("transform", `translate(${(mod([250, 900][i] - scroll * 0.7, 1300) - 110).toFixed(1)} 0)`));
      for (let i = 0; i < 26; i++) { const el = $(`ch${i}-${k}`); el.setAttribute("x", (mod(((i * 211) % 1300) - scroll, 1300) - 110).toFixed(1)); el.setAttribute("opacity", fl > 0.5 && i < 3 + q * 23 ? 0.9 : 0); }
      const p = poseAt(k, t, Math.PI * fl), pts = solve(p), mode = MODES[k][modeAt(k, t)][1], fx = FX + p.dx * U;
      ["aB", "lB", "to", "lF", "aF"].forEach((n) => { const s = str(pts[n]); $(`o-${n}-${k}`).setAttribute("points", s); $(`s-${n}-${k}`).setAttribute("points", s); $(`h-${n}-${k}`).setAttribute("points", s); });
      $(`hd-${k}`).setAttribute("transform", `translate(${pts.hc[0][0].toFixed(1)} ${pts.hc[0][1].toFixed(1)}) rotate(${(p.lean + p.head + p.rot).toFixed(1)})`);
      $(`fg-${k}`).setAttribute("transform", `translate(${fx.toFixed(1)} ${FLOOR}) scale(${U * p.face} ${U})`);
      const hx = fx + pts.hc[0][0] * U * p.face, hy = FLOOR + pts.hc[0][1] * U;
      $(`ex-${k}`).setAttribute("transform", `translate(${hx.toFixed(1)} ${hy.toFixed(1)})`);
      $(`mt-${k}`).textContent = Math.round(fl * MPF) + " M";
      $(`zz-${k}`).setAttribute("opacity", mode === "sit" && t > MODES[k][modeAt(k, t)][0] + 0.5 ? 0.6 + 0.4 * Math.sin(t * 3) : 0);
      const hot = mode === "tired" || mode === "down";
      [0, 1, 2].forEach((i) => { const f = (t * 0.7 + i / 3) % 1, el = $(`sm${i}-${k}`); el.setAttribute("opacity", hot ? 1 - f : 0); el.setAttribute("transform", `translate(0 ${(-f * 44).toFixed(1)})`); });
      const wet = mode === "pushfast" ? 1 : mode === "push" || mode === "tired" || mode === "hop" ? 0.7 : 0;
      [0, 1].forEach((i) => { const f = (t * 1.6 + i * 0.5) % 1, el = $(`sw${i}-${k}`); el.setAttribute("opacity", wet * (1 - f)); el.setAttribute("cy", (4 + f * 80).toFixed(1)); });
    });
  };
  RANK.forEach((r, i) => { $(`tm${i}`).textContent = Math.round(kf(FLIPS[r[1]], END) * MPF) + " M"; });
  const clk = { v: 0 };
  M.fromTo(clk, { v: 0 }, { v: 1, duration: END, ease: "none", onUpdate: () => apply(M.time()) }, 0);
  apply(0);

  const flash = (t, a = 0.3) => M.fromTo("#flash", { opacity: a }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
  const bump = (t, a = 14) => M.fromTo("#punch", { y: a }, { y: 0, duration: 0.4, ease: "elastic.out(1.4,0.3)", immediateRender: false }, t);
  gsap.set(".tag, .dimr, #flash", { opacity: 0 });
  M.fromTo("#punch", { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out" }, 0);
  flash(2.0, 0.25);                 // day 1: go
  bump(8.9, 16);                    // Ego kicks the stone. The stone wins.
  bump(13.3, 14);                   // Obsession goes down
  flash(30.0, 0.45); bump(30.0, 14); // day 60
  M.fromTo("#strip .b", { scale: 1 }, { scale: 1.18, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 30.0);
  // ---- individual results, last place first
  [31.0, 32.0, 33.0, 34.0].forEach((t, i) => {
    M.fromTo(`#tag${i}`, { opacity: 0, x: 140 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, t);
    if (i < 3) M.to(`#dim-${RANK[i][1]}`, { opacity: 0.45, duration: 0.4 }, t + 0.2);
    else { flash(t + 0.2, 0.5); bump(t + 0.2, 16); M.fromTo("#tag3", { scale: 1 }, { scale: 1.1, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, t + 0.25); }
  });
  M.set({}, {}, END);
  M.timeScale(1 / K); R.add(M, 0);
  window.__timelines["main"] = R;
});
</script>
</body>
</html>
