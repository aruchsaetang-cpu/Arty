<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combat Clip Preview</title>
<style>
  :root { --bg:#1b1c20; --panel:#25262c; --ink:#e8e8ea; --dim:#9a9ba3; --hit:#ff4a4a; --plant:#3fd17a; --cut:#f2f2f2; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#eceef1; --panel:#ffffff; --ink:#1d1e22; --dim:#5c5e66; } }
  :root[data-theme="dark"] { --bg:#1b1c20; --panel:#25262c; --ink:#e8e8ea; --dim:#9a9ba3; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.3 system-ui, sans-serif; overflow:hidden; }
  #view { position:absolute; inset:0 0 92px 0; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:92px; background:var(--panel); padding:6px 16px; box-sizing:border-box; }
  #row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, button { font:inherit; background:var(--bg); color:var(--ink); border:1px solid #555; border-radius:4px; padding:3px 8px; }
  #scrub { width:100%; margin:4px 0 0 0; }
  #tl { width:100%; height:22px; display:block; }
  #info { position:absolute; left:16px; top:10px; background:rgba(0,0,0,.45); color:#fff; padding:6px 9px; border-radius:4px; pointer-events:none; white-space:pre; }
  #legend { color:var(--dim); }
</style>
</head>
<body>
<div id="view"></div>
<div id="info">loading...</div>
<div id="bar">
  <div id="row">
    <select id="clip" aria-label="clip"></select>
    <button id="play">Pause</button>
    <select id="speed" aria-label="speed"><option>1</option><option>0.5</option><option>0.25</option></select>
    <label><input type="checkbox" id="mk" checked> markers</label>
    <span id="legend">red = hit contact, green ring = planted (foot-locked) foot, white tick = camera cut</span>
  </div>
  <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" aria-label="scrub">
  <canvas id="tl"></canvas>
</div>
<script>
// three.js r128 from cdnjs (pinned); falls back to the identical vendored copy (npm three@0.128.0) when the CDN is unreachable.
const CDN = "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js";
function load(src) { return new Promise((ok, bad) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = bad; document.head.appendChild(s); }); }
const params = new URLSearchParams(location.search); const SEQ = params.get("seq") || "combat_test";
window.__preview = { ready: false, errors: [], threeSource: null };
load(CDN).then(() => window.__preview.threeSource = "cdnjs")
  .catch(() => load("vendor/three.min.js").then(() => window.__preview.threeSource = "vendor"))
  .then(() => load("vendor/GLTFLoader.js")).then(() => load("vendor/OrbitControls.js")).then(init)
  .catch(e => { window.__preview.errors.push(String(e)); document.getElementById("info").textContent = "failed: " + e; });

async function init() {
  const man = await (await fetch(SEQ + ".json")).json();
  const view = document.getElementById("view");
  const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setPixelRatio(1);
  renderer.outputEncoding = THREE.sRGBEncoding; view.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6c6e73);
  const cam = new THREE.PerspectiveCamera(32, 1, 0.05, 200); cam.position.set(0.7, 1.3, 4.6);
  const ctl = new THREE.OrbitControls(cam, renderer.domElement); ctl.target.set(0.4, 1.0, 0); ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404048, 0.9)); const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(-3, 5, 4); scene.add(sun);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshLambertMaterial({ color: 0x8a8b8f }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground); scene.add(new THREE.GridHelper(12, 24, 0x555555, 0x777777));
  // 3-band toon ramp (the cel look of the Blender characters)
  const ramp = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
  ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
  const colOf = (name) => { if (man.materials[name]) return man.materials[name]; const b = (name || "").split(".")[0]; for (const k in man.materials) if (k.split(".")[0] === b) return man.materials[k]; return null; };
  const gltf = await new Promise((ok, bad) => new THREE.GLTFLoader().load(man.glb, ok, undefined, bad));
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    const nm = o.material && o.material.name; let c = colOf(nm);
    if (/eye/.test(nm || "")) c = c || "#101014";
    const mat = new THREE.MeshToonMaterial({ color: new THREE.Color(c || "#9a9aa0").convertSRGBToLinear(), gradientMap: ramp, skinning: !!o.isSkinnedMesh });
    o.material = mat; o.frustumCulled = false;
  });
  scene.add(gltf.scene);
  const mixer = new THREE.AnimationMixer(gltf.scene); const actions = {};
  gltf.animations.forEach(a => actions[a.name] = mixer.clipAction(a));
  // markers
  const hitGeo = new THREE.SphereGeometry(0.045, 16, 10), ringGeo = new THREE.RingGeometry(0.06, 0.085, 24);
  const hitMat = new THREE.MeshBasicMaterial({ color: 0xff4a4a, depthTest: false, transparent: true });
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x3fd17a, side: THREE.DoubleSide, depthTest: false });
  let markers = [];
  const sel = document.getElementById("clip"), scrub = document.getElementById("scrub"), playBtn = document.getElementById("play");
  man.clips.forEach(c => { const o = document.createElement("option"); o.value = c.id; o.textContent = `${c.id} (${c.frames} f)`; sel.appendChild(o); });
  let clip = null, act = null, playing = true;
  function setClip(id) {
    clip = man.clips.find(c => c.id === id); Object.values(actions).forEach(a => a.stop());
    act = actions[id]; act.reset().play(); act.paused = !playing; scrub.max = clip.duration;
    markers.forEach(m => scene.remove(m)); markers = [];
    clip.hits.forEach(h => { const m = new THREE.Mesh(hitGeo, hitMat); m.position.fromArray(h.point); m.renderOrder = 9; m.userData = { kind: "hit", h }; scene.add(m); markers.push(m); });
    clip.plants.forEach(p => { const m = new THREE.Mesh(ringGeo, ringMat); m.position.fromArray(p.point); m.position.y = 0.004; m.rotation.x = -Math.PI / 2; m.renderOrder = 8; m.userData = { kind: "plant", p }; scene.add(m); markers.push(m); });
    drawTimeline();
  }
  function setTime(t) { if (!act) return; act.time = Math.max(0, Math.min(clip.duration - 1e-4, t)); mixer.update(0); }
  function drawTimeline() {
    const cv = document.getElementById("tl"), w = cv.clientWidth, h = cv.clientHeight; cv.width = w; cv.height = h; const g = cv.getContext("2d");
    g.clearRect(0, 0, w, h); const X = t => t / clip.duration * w;
    const names = [...new Set(clip.plants.map(p => p.actor + p.side))];
    clip.plants.forEach(p => { const row = names.indexOf(p.actor + p.side); g.fillStyle = "rgba(63,209,122,.55)"; g.fillRect(X(p.t0), 2 + row * (14 / Math.max(1, names.length)), Math.max(1, X(p.t1) - X(p.t0)), Math.max(1, 12 / Math.max(1, names.length))); });
    clip.cuts.forEach(c => { g.fillStyle = "#f2f2f2"; g.fillRect(X(c.time), 0, 2, h); });
    clip.hits.forEach(hh => { g.fillStyle = "#ff4a4a"; g.fillRect(X(hh.time) - 1, 0, 3, h); });
  }
  sel.onchange = () => setClip(sel.value);
  playBtn.onclick = () => { playing = !playing; act.paused = !playing; playBtn.textContent = playing ? "Pause" : "Play"; };
  scrub.oninput = () => { playing = false; act.paused = true; playBtn.textContent = "Play"; setTime(+scrub.value); };
  document.getElementById("speed").onchange = e => mixer.timeScale = +e.target.value;
  function resize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); cam.aspect = w / h; cam.updateProjectionMatrix(); if (clip) drawTimeline(); }
  window.addEventListener("resize", resize); resize();
  setClip(man.clips[0].id);
  const clock = new THREE.Clock(); const info = document.getElementById("info");
  function tick() {
    const dt = Math.min(0.05, clock.getDelta()); if (playing) mixer.update(dt); ctl.update();
    const t = act ? act.time : 0; if (playing) scrub.value = t;
    const show = document.getElementById("mk").checked; let nh = 0, np = 0;
    markers.forEach(m => {
      if (m.userData.kind === "hit") { const d = Math.abs(t - m.userData.h.time); m.visible = show && d < 0.3; const s = 1 + 1.0 * Math.max(0, 0.12 - d) / 0.12; m.scale.setScalar(s); if (d < 0.05) nh++; }
      else { const p = m.userData.p; m.visible = show && t >= p.t0 && t <= p.t1; if (m.visible) np++; }
    });
    const f = Math.round(t * man.fps);
    info.textContent = `${clip.id}  frame ${f}/${clip.frames - 1}  t ${t.toFixed(2)} s\nplanted feet locked: ${np}${nh ? "   HIT " + clip.hits.filter(h => Math.abs(t - h.time) < 0.05).map(h => h.id + " " + h.attacker + "->" + h.target + "." + h.part).join(", ") : ""}`;
    renderer.render(scene, cam); requestAnimationFrame(tick);
  }
  tick();
  Object.assign(window.__preview, { ready: true, clips: man.clips.map(c => c.id), animations: gltf.animations.map(a => [a.name, a.duration, a.tracks.length]),
    setClip: (id) => { sel.value = id; setClip(id); }, setTime: (t) => { playing = false; act.paused = true; scrub.value = t; setTime(t); }, manifest: man });
}
window.addEventListener("error", e => window.__preview && window.__preview.errors.push(e.message));
</script>
</body>
</html>
